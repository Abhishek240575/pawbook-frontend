<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f26a1b">
<title>PawBook Shop — Browse Products</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://images.pexels.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="shop.css">
<style>
.lhead{position:relative;margin-top:20px;border-radius:24px;overflow:hidden;min-height:150px;display:flex;align-items:center;background:var(--o-l)}
.lhead img{position:absolute;right:0;top:0;height:100%;width:46%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.lhead-t{position:relative;z-index:2;padding:26px 32px}
.crumb{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{text-decoration:none;color:var(--muted)}
.crumb a:hover{color:var(--o-d)}
.lhead h1{font-size:32px;font-weight:900;color:var(--navy);margin-top:6px;letter-spacing:-.5px}
.lhead p{font-size:13.5px;color:#5b5f75;margin-top:2px}
.subcats{display:flex;gap:10px;overflow-x:auto;padding:18px 2px 4px;scrollbar-width:none}
.subcats::-webkit-scrollbar{display:none}
.sc{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;background:#fff;border:1.5px solid var(--line);text-decoration:none;font-size:13px;font-weight:700;color:var(--navy);cursor:pointer}
.sc img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.sc.on{border-color:var(--o);background:var(--o-ll);color:var(--o-d)}
.layout{display:grid;grid-template-columns:270px 1fr;gap:26px;margin-top:22px;align-items:start}
.filters{position:sticky;top:140px;background:#fff;border-radius:var(--r);border:1px solid var(--line);max-height:calc(100vh - 160px);overflow:auto}
.f-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line2)}
.f-h b{font-size:15px;font-weight:900;color:var(--navy)}
.f-clear{border:none;background:none;color:var(--o-d);font-weight:800;font-size:12.5px;cursor:pointer}
.fg{border-bottom:1px solid var(--line2);padding:14px 18px}
.fg:last-child{border-bottom:none}
.fg-t{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.chk{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:13px;color:var(--ink);cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--o);cursor:pointer}
.chk .n{margin-left:auto;font-size:11.5px;color:var(--muted)}
.pets{display:flex;flex-wrap:wrap;gap:8px}
.pet-chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--navy)}
.pet-chip.on{border-color:var(--o);background:var(--o-ll);color:var(--o-d)}
.price-row{display:flex;gap:8px;align-items:center}
.price-row input{width:100%;height:40px;border-radius:10px;border:1.5px solid var(--line);padding:0 10px;outline:none;background:var(--cream)}
.price-row input:focus{border-color:var(--o)}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar .count{font-size:13.5px;color:var(--muted);font-weight:600}
.toolbar .count b{color:var(--navy)}
.toolbar .sp{flex:1}
.sort{height:42px;border-radius:999px;border:1.5px solid var(--line);padding:0 16px;background:#fff;font-weight:700;color:var(--navy);cursor:pointer;outline:none}
.f-open{display:none;height:42px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:var(--navy);cursor:pointer;align-items:center;gap:6px}
.f-open .badge{position:static;border:none;display:none}
.f-open .badge.show{display:inline-flex}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px 6px 12px;border-radius:999px;background:var(--o-l);color:var(--o-d);font-size:12.5px;font-weight:700}
.chip button{border:none;background:rgba(255,255,255,.7);width:20px;height:20px;border-radius:50%;cursor:pointer;color:var(--o-d);font-size:12px;display:flex;align-items:center;justify-content:center}
.pager{display:flex;justify-content:center;gap:6px;margin-top:30px}
.pager button{min-width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:800;color:var(--navy);cursor:pointer}
.pager button.on{background:var(--o);border-color:var(--o);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}
.f-sheet-h,.f-apply{display:none}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}
  .f-open{display:inline-flex}
  .filters{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:902;max-height:82vh;border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.2)}
  .filters.show{transform:none}
  .f-sheet-h{display:block;width:44px;height:5px;border-radius:999px;background:#ddd;margin:10px auto 0}
  .f-apply{display:block;position:sticky;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
  .f-apply .btn{width:100%}
}
@media(max-width:760px){
  .lhead{min-height:120px;border-radius:18px}
  .lhead img{width:50%}
  .lhead-t{padding:18px 20px}
  .lhead h1{font-size:23px}
  .lhead p{display:none}
}
</style>
</head>
<body>
<div id="shop-header"></div>

<main class="wrap">
  <section class="lhead" id="lhead">
    <img id="lhead-img" alt="">
    <div class="lhead-t">
      <div class="crumb"><a href="42_shop.html" data-i18n="h.shop">Shop</a><i class="ti ti-chevron-right"></i><span id="crumb-cur"></span></div>
      <h1 id="ltitle"></h1>
      <p id="lsub"></p>
    </div>
  </section>
  <div class="subcats" id="subcats"></div>

  <div class="layout">
    <aside class="filters" id="filters" aria-label="Filters">
      <div class="f-sheet-h"></div>
      <div class="f-h"><b data-i18n="f.t">Filters</b><button class="f-clear" onclick="clearAll()" data-i18n="f.clear">Clear all</button></div>
      <div class="fg"><div class="fg-t" data-i18n="f.pet">Pet</div><div class="pets" id="f-pets"></div></div>
      <div class="fg"><div class="fg-t" data-i18n="f.cat">Category</div><div id="f-cats"></div></div>
      <div class="fg" id="fg-brand" style="display:none"><div class="fg-t" data-i18n="f.brand">Brand</div><div id="f-brands"></div></div>
      <div class="fg"><div class="fg-t" data-i18n="f.price">Price</div>
        <div class="price-row"><input id="f-min" type="number" min="0" inputmode="numeric" data-i18n-ph="f.min" placeholder="Min"><span>–</span><input id="f-max" type="number" min="0" inputmode="numeric" data-i18n-ph="f.max" placeholder="Max"></div>
        <div id="f-price-hint" style="font-size:11.5px;color:var(--muted);margin-top:6px"></div></div>
      <div class="fg"><div class="fg-t" data-i18n="f.rating">Customer rating</div><div id="f-rating"></div></div>
      <div class="fg"><div class="fg-t" data-i18n="f.stage">Life stage</div><div id="f-stage"></div></div>
      <div class="fg"><div class="fg-t" data-i18n="f.more">More</div>
        <label class="chk"><input type="checkbox" id="f-stock" onchange="setF('in_stock',this.checked?'1':'')"><span data-i18n="f.instock">In stock only</span></label>
        <label class="chk"><input type="checkbox" id="f-sale" onchange="setF('on_sale',this.checked?'1':'')"><span data-i18n="f.sale">On sale</span></label>
      </div>
      <div class="f-apply"><button class="btn btn-o" onclick="toggleFilters(false)"><span data-i18n="f.show">Show results</span></button></div>
    </aside>

    <section>
      <div class="toolbar">
        <button class="f-open" onclick="toggleFilters(true)"><i class="ti ti-adjustments-horizontal"></i><span data-i18n="f.t">Filters</span><em class="badge" id="f-count"></em></button>
        <div class="count" id="count"></div><div class="sp"></div>
        <label class="sr" for="sort" data-i18n="so.label">Sort by</label>
        <select id="sort" class="sort" onchange="setF('sort',this.value)">
          <option value="recommended" data-i18n="so.rec">Recommended</option>
          <option value="popular" data-i18n="so.pop">Popularity</option>
          <option value="price_asc" data-i18n="so.pa">Price: low to high</option>
          <option value="price_desc" data-i18n="so.pd">Price: high to low</option>
          <option value="new" data-i18n="so.new">New arrivals</option>
          <option value="rating" data-i18n="so.rate">Highest rated</option>
          <option value="discount" data-i18n="so.disc">Best discounts</option>
        </select>
      </div>
      <div class="chips" id="chips"></div>
      <div class="pgrid" id="grid"></div>
      <div class="pager" id="pager"></div>
    </section>
  </div>
</main>
<div class="ov" id="f-ov" onclick="toggleFilters(false)"></div>
<div id="shop-footer"></div>

<script src="pawbook-i18n.js"></script>
<script src="shop-i18n.js"></script>
<script src="shop.js"></script>
<script>
var S = Shop, T = PBi18n.t;
var qs = new URLSearchParams(location.search);
var F = {};   // active filters (mirrors the URL)
['q','category','pet','brand','life_stage','min_price','max_price','rating','in_stock','on_sale','sort','page','wishlist'].forEach(function(k){ if (qs.get(k)) F[k] = qs.get(k); });
var WISH = F.wishlist === '1';
var facets = null, lastTotal = 0;
S.init(WISH ? 'wish' : (F.pet && F.pet.indexOf(',') < 0 ? F.pet : (F.on_sale ? 'offers' : 'all')));

function list(k){ return (F[k] || '').split(',').filter(Boolean); }
function toggleIn(k, v){ var l = list(k), i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); setF(k, l.join(',')); }
function setF(k, v){ if (v) F[k] = v; else delete F[k]; if (k !== 'page') delete F.page; sync(); load(); }
function clearAll(){ var keep = {}; if (F.q) keep.q = F.q; if (F.sort) keep.sort = F.sort; F = keep; sync(); load(); }
function sync(){
  var p = new URLSearchParams(); Object.keys(F).forEach(function(k){ p.set(k, F[k]); });
  history.replaceState(null, '', location.pathname + (p.toString() ? '?' + p.toString() : ''));
}
function toggleFilters(on){ document.getElementById('filters').classList.toggle('show', on); document.getElementById('f-ov').classList.toggle('show', on); document.body.style.overflow = on ? 'hidden' : ''; }

/* ── header banner ── */
function renderHead(){
  var title, sub = '', img = 37891869, cur;
  var cats = list('category'), pets = list('pet');
  if (WISH) { title = T('h.wish'); sub = T('l.wishs'); img = 35237328; }
  else if (F.q) { title = T('l.results', {q: F.q}); }
  else if (cats.length === 1) { title = S.catLabel(cats[0]); img = S.catInfo(cats[0]).img; sub = pets.length === 1 ? T('l.for', {pet: T('pet.' + pets[0])}) : ''; }
  else if (pets.length === 1) { title = T('l.forpet', {pet: T('pet.' + pets[0])}); img = (S.PETS.filter(function(p){ return p.id === pets[0]; })[0] || {}).img || img; sub = T('l.petsub'); }
  else if (F.on_sale) { title = T('h.offers'); img = 28802858; sub = T('home.dealss'); }
  else if (F.brand && F.brand.indexOf(',') < 0) { title = F.brand; }
  else { title = T('l.all'); sub = T('l.alls'); }
  document.getElementById('ltitle').textContent = title;
  document.getElementById('lsub').textContent = sub;
  document.getElementById('crumb-cur').textContent = title;
  document.getElementById('lhead-img').src = S.px(img, 800);
  document.title = title + ' — PawBook Shop';
  // category shortcuts (keeps pet filter)
  var show = ['food','treats','toys','grooming','walk','beds','clothing','bowls','health','litter','aquarium','cages','travel','training','accessories'];
  document.getElementById('subcats').innerHTML = WISH ? '' : show.map(function(id){
    var on = cats.length === 1 && cats[0] === id;
    return '<a class="sc' + (on ? ' on' : '') + '" onclick="setF(\'category\',\'' + (on ? '' : id) + '\')"><img src="' + S.px(S.catInfo(id).img, 100) + '" alt="">' + S.esc(S.catLabel(id)) + '</a>';
  }).join('');
}

/* ── filter sidebar ── */
function renderFilters(){
  var pets = list('pet');
  document.getElementById('f-pets').innerHTML = S.PETS.map(function(p){
    return '<button class="pet-chip' + (pets.indexOf(p.id) >= 0 ? ' on' : '') + '" onclick="toggleIn(\'pet\',\'' + p.id + '\')">' + S.esc(T('pet.' + p.id)) + '</button>';
  }).join('');
  var counts = {}; ((facets && facets.categories) || []).forEach(function(c){ counts[c.category] = c.n; });
  var cats = list('category');
  var catIds = S.CATS.map(function(c){ return c.id; }).filter(function(id){ return counts[id] || cats.indexOf(id) >= 0; });
  if (!catIds.length) catIds = ['food','treats','toys','grooming','walk','beds','clothing','health'];
  document.getElementById('f-cats').innerHTML = catIds.map(function(id){
    return '<label class="chk"><input type="checkbox"' + (cats.indexOf(id) >= 0 ? ' checked' : '') + ' onchange="toggleIn(\'category\',\'' + id + '\')"><span>' + S.esc(S.catLabel(id)) + '</span>' + (counts[id] ? '<span class="n">' + counts[id] + '</span>' : '') + '</label>';
  }).join('');
  var brands = (facets && facets.brands) || [], sb = list('brand');
  document.getElementById('fg-brand').style.display = brands.length || sb.length ? '' : 'none';
  document.getElementById('f-brands').innerHTML = brands.map(function(b){
    return '<label class="chk"><input type="checkbox"' + (sb.indexOf(b.brand) >= 0 ? ' checked' : '') + ' data-brand="' + S.esc(b.brand) + '" onchange="toggleIn(\'brand\',this.getAttribute(\'data-brand\'))"><span>' + S.esc(b.brand) + '</span><span class="n">' + b.n + '</span></label>';
  }).join('');
  document.getElementById('f-rating').innerHTML = [4,3,2].map(function(r){
    return '<label class="chk"><input type="radio" name="rt"' + (F.rating == r ? ' checked' : '') + ' onclick="setF(\'rating\',F.rating==\'' + r + '\'?\'\':\'' + r + '\')"><span>' + S.starsHTML(r) + ' ' + S.esc(T('f.up')) + '</span></label>';
  }).join('');
  var st = list('life_stage');
  document.getElementById('f-stage').innerHTML = ['puppy','kitten','adult','senior'].map(function(s){
    return '<label class="chk"><input type="checkbox"' + (st.indexOf(s) >= 0 ? ' checked' : '') + ' onchange="toggleIn(\'life_stage\',\'' + s + '\')"><span>' + S.esc(T('ls.' + s)) + '</span></label>';
  }).join('');
  document.getElementById('f-min').value = F.min_price || ''; document.getElementById('f-max').value = F.max_price || '';
  var pr = facets && facets.price;
  document.getElementById('f-price-hint').textContent = pr && pr.max ? T('f.range', {a: S.money(pr.min), b: S.money(pr.max)}) : '';
  document.getElementById('f-stock').checked = !!F.in_stock; document.getElementById('f-sale').checked = !!F.on_sale;
  document.getElementById('sort').value = F.sort || 'recommended';
  // active chips
  var chips = [];
  list('pet').forEach(function(v){ chips.push(['pet', v, T('pet.' + v)]); });
  list('category').forEach(function(v){ chips.push(['category', v, S.catLabel(v)]); });
  list('brand').forEach(function(v){ chips.push(['brand', v, v]); });
  list('life_stage').forEach(function(v){ chips.push(['life_stage', v, T('ls.' + v)]); });
  if (F.min_price || F.max_price) chips.push(['price', '', (F.min_price ? S.money(F.min_price) : '₹0') + ' – ' + (F.max_price ? S.money(F.max_price) : '∞')]);
  if (F.rating) chips.push(['rating', '', F.rating + '★ ' + T('f.up')]);
  if (F.in_stock) chips.push(['in_stock', '', T('f.instock')]);
  if (F.on_sale) chips.push(['on_sale', '', T('f.sale')]);
  if (F.q) chips.push(['q', '', '“' + F.q + '”']);
  document.getElementById('chips').innerHTML = WISH ? '' : chips.map(function(c, i){ return '<span class="chip">' + S.esc(c[2]) + '<button onclick="dropChip(' + i + ')" aria-label="remove"><i class="ti ti-x"></i></button></span>'; }).join('');
  window._chips = chips;
  var n = chips.filter(function(c){ return c[0] !== 'q'; }).length, fc = document.getElementById('f-count');
  fc.textContent = n; fc.classList.toggle('show', n > 0);
}
function dropChip(i){
  var c = window._chips[i];
  if (c[0] === 'price') { delete F.min_price; delete F.max_price; setF('page', ''); return; }
  if (['pet','category','brand','life_stage'].indexOf(c[0]) >= 0) return toggleIn(c[0], c[1]);
  setF(c[0], '');
}
['f-min','f-max'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(){
    var v = this.value.replace(/\D/g, ''); setF(id === 'f-min' ? 'min_price' : 'max_price', v);
  });
});

/* ── results ── */
var seq = 0;
function load(){
  renderHead(); renderFilters();
  var grid = document.getElementById('grid'), my = ++seq;
  S.skeletons(grid, 8); document.getElementById('pager').innerHTML = '';
  var p;
  if (WISH) {
    p = S.loggedIn() ? S.api('/shop/wishlist').then(function(d){ return {products: d.products, total: d.products.length, page: 1, limit: 999}; })
                     : Promise.all(S.wish.ids().map(function(id){ return S.api('/shop/products/' + encodeURIComponent(id)).then(function(d){ return d.product; }).catch(function(){ return null; }); }))
                         .then(function(ps){ ps = ps.filter(Boolean); return {products: ps, total: ps.length, page: 1, limit: 999}; });
  } else {
    var q = new URLSearchParams(); Object.keys(F).forEach(function(k){ if (k !== 'wishlist') q.set(k, F[k]); }); q.set('limit', 24);
    p = S.api('/shop/products?' + q.toString());
  }
  p.then(function(d){
    if (my !== seq) return;
    facets = d.facets || facets; lastTotal = d.total; renderFilters();
    document.getElementById('count').innerHTML = (d.total === 1 ? T('l.count1') : T('l.count', {n: '<b>' + d.total + '</b>'}));
    if (!d.products.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-ic"><i class="ti ' + (WISH ? 'ti-heart' : 'ti-search') + '"></i></div><div class="empty-t">' + S.esc(T(WISH ? 'l.wishempty' : 'l.none')) + '</div><div class="empty-s">' + S.esc(T(WISH ? 'l.wishemptys' : 'l.nones')) + '</div>'
        + (WISH ? '<a class="btn btn-o" href="43_shop_list.html">' + S.esc(T('c.browse')) + '</a>' : '<button class="btn btn-o" onclick="clearAll()">' + S.esc(T('f.clear')) + '</button>') + '</div>';
      return;
    }
    S.renderCards(grid, d.products);
    var pages = Math.ceil(d.total / d.limit);
    if (pages > 1) {
      var cur = d.page, h = '<button ' + (cur <= 1 ? 'disabled' : '') + ' onclick="setF(\'page\',' + (cur - 1) + ');scrollTo(0,0)" aria-label="prev"><i class="ti ti-chevron-left"></i></button>';
      for (var i = Math.max(1, cur - 2); i <= Math.min(pages, cur + 2); i++) h += '<button class="' + (i === cur ? 'on' : '') + '" onclick="setF(\'page\',' + i + ');scrollTo(0,0)">' + i + '</button>';
      h += '<button ' + (cur >= pages ? 'disabled' : '') + ' onclick="setF(\'page\',' + (cur + 1) + ');scrollTo(0,0)" aria-label="next"><i class="ti ti-chevron-right"></i></button>';
      document.getElementById('pager').innerHTML = h;
    }
  }).catch(function(){
    if (my !== seq) return;
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><div class="empty-ic"><i class="ti ti-wifi-off"></i></div><div class="empty-t">' + S.esc(T('l.err')) + '</div><div class="empty-s">' + S.esc(T('l.errs')) + '</div><button class="btn btn-o" onclick="load()">' + S.esc(T('l.retry')) + '</button></div>';
  });
}
load();
window.addEventListener('pb:langchange', function(){ load(); });
</script>
</body>
</html>
