<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PawBook — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<style>
/* ── LAYOUT ── */
.msg-layout{max-width:100%;margin:0;padding:0 16px;display:grid;grid-template-columns:320px 1fr;gap:0;height:calc(100vh - 72px)}
@media(max-width:768px){.msg-layout{display:block!important;grid-template-columns:1fr!important}}

/* ── CONVERSATION LIST ── */
.msg-list{border-right:1px solid var(--border);background:#fff;border-radius:var(--radius-md) 0 0 var(--radius-md);overflow:hidden;display:flex;flex-direction:column}
.msg-list-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.msg-search{display:flex;align-items:center;gap:8px;background:#f0f2f5;border-radius:20px;padding:8px 14px;margin:10px 16px}
.msg-search input{border:none;outline:none;background:transparent;font-size:14px;font-family:'Poppins',sans-serif;flex:1}
.msg-item{display:flex;gap:12px;padding:12px 16px;cursor:pointer;transition:background 0.12s;border-bottom:1px solid var(--border);align-items:center}
.msg-item:hover,.msg-item.active{background:#e7f3ff}
.msg-av{width:50px;height:50px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative;background:#e4e6eb}
.msg-av img{width:100%;height:100%;object-fit:cover}
.msg-av-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;background:#1877F2}
.msg-name{font-size:14px;font-weight:700;color:var(--text)}
.msg-preview{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.msg-time{font-size:11px;color:var(--muted);margin-left:auto;flex-shrink:0}
.msg-badge{background:var(--blue);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 7px;margin-left:4px}
.conv-list-scroll{overflow-y:auto;flex:1}

/* ── CHAT WINDOW ── */
.chat-window{background:#f0f2f5;display:flex;flex-direction:column;border-radius:0 var(--radius-md) var(--radius-md) 0;overflow:hidden;border:1px solid var(--border);border-left:none}
.chat-header{background:#fff;padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.chat-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e4e6eb}
.chat-av img{width:100%;height:100%;object-fit:cover}
.chat-av-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;background:#1877F2}
.chat-name{font-size:15px;font-weight:800}
.chat-username{font-size:12px;color:var(--muted)}
.chat-actions{margin-left:auto;display:flex;gap:8px}

/* ── MESSAGES ── */
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg-bubble-wrap{display:flex;gap:8px;align-items:flex-end}
.msg-bubble-wrap.mine{flex-direction:row-reverse}
.bubble-av{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e4e6eb}
.bubble-av img{width:100%;height:100%;object-fit:cover}
.bubble-av-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:#1877F2}
.bubble{max-width:65%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;word-break:break-word}
.bubble.theirs{background:#fff;color:var(--text);border-radius:18px 18px 18px 4px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.bubble.mine{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px}
.bubble-time{font-size:10px;color:var(--muted);margin-top:3px;padding:0 4px}
.mine .bubble-time{text-align:right}

/* ── EMPTY / LOADING STATES ── */
.empty-conv{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--muted)}
.empty-conv i{font-size:48px;opacity:.3}
.empty-conv p{font-size:14px;font-weight:600}
.loading-dots{display:flex;gap:4px;align-items:center;justify-content:center;padding:20px}
.loading-dots span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:dot .9s infinite ease-in-out}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── FOOTER ── */
.chat-footer{background:#fff;padding:12px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-input{flex:1;border:none;outline:none;font-size:14px;font-family:'Poppins',sans-serif;padding:8px 16px;background:#f0f2f5;border-radius:20px}
.send-btn{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.send-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── NEW MESSAGE MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:600;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;width:420px;max-width:95vw;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:16px;font-weight:800}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f0f2f5;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.modal-body{padding:16px}
.user-search-inp{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-family:'Poppins',sans-serif;font-size:14px;outline:none}
.user-search-inp:focus{border-color:var(--blue)}
.user-results{margin-top:10px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.user-result-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .1s}
.user-result-item:hover{background:#f0f2f5}
.user-result-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e4e6eb}
.user-result-av img{width:100%;height:100%;object-fit:cover}
.user-result-av-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;background:#1877F2}
.user-result-name{font-size:14px;font-weight:700}
.user-result-username{font-size:12px;color:var(--muted)}

/* ── MOBILE ── */
@media(max-width:768px){
  .topnav-search{display:none}
  .topnav{padding:0 10px;gap:6px;position:fixed;top:0;left:0;right:0;z-index:400;background:#fff;border-bottom:1px solid #e4e6eb;height:56px}
  .msg-layout{grid-template-columns:1fr;height:calc(100vh - 56px)!important;margin:0!important;padding:0!important;padding-top:56px!important}
  .msg-list{position:fixed!important;top:56px!important;left:0!important;right:0!important;z-index:300!important;height:calc(100vh - 56px)!important;border-radius:0!important;display:none!important}
  .msg-list.mobile-open{display:flex!important}
  .chat-window{border-radius:0!important;border:none!important;height:calc(100vh - 56px)!important}
  .bubble{max-width:82%;font-size:13px;padding:8px 12px}
}
html,body{overflow-x:hidden!important;max-width:100%!important}
</style>
<link rel="stylesheet" href="mobile.css">
<style class="pb-mobile-pad">@media(max-width:768px){body{padding-bottom:72px}}</style>
<style id="pb-burger">
.burger-btn{display:flex;width:38px;height:38px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:#1877F2;font-size:28px;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;padding:0}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:450}
.drawer-overlay.open{display:block}
.drawer-panel{position:fixed;top:0;left:-320px;bottom:0;width:300px;background:#fff;z-index:500;overflow-y:auto;transition:left .28s ease;box-shadow:4px 0 32px rgba(0,0,0,.25);display:flex;flex-direction:column}

.drawer-item{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;font-size:14px;font-weight:600;color:#050505;border:none;background:none;width:100%;font-family:inherit;text-align:left}

.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 0;border:none;background:none;font-family:inherit;color:#65676b}
.bnav-item i{font-size:22px}
.bnav-item span{font-size:9px;font-weight:700;text-transform:uppercase}
.bnav-item.active{color:#1877F2}
@media(max-width:768px){.burger-btn{display:flex!important}.bottomnav{display:flex!important}}
@media(min-width:769px){.burger-btn{display:none!important}.bottomnav{display:none!important}}
</style>
</head>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
var API = 'https://pawbook-api-cquc.onrender.com/api/v1';

function token(){ return localStorage.getItem('pb_token') || ''; }
function me(){ try{ return JSON.parse(localStorage.getItem('pb_user')||'{}'); }catch(e){ return {}; } }
function authHeaders(){ return {'Content-Type':'application/json','Authorization':'Bearer '+token()}; }
function goTo(p){ window.location.href = p; }

// Redirect if not logged in
if (!token()) { goTo('01_login.html'); }

// Populate drawer with real user info
(function(){
  var u = me();
  if (u.full_name) {
    var n = document.getElementById('drawer-name');
    var h = document.getElementById('drawer-handle');
    var a = document.getElementById('drawer-av');
    if(n) n.textContent = u.full_name;
    if(h) h.textContent = '@' + (u.username||'');
    if(a && u.avatar_url) { a.src = u.avatar_url; a.style.display='block'; }
  }
})();

// ── STATE ─────────────────────────────────────────────────────────────────────
var conversations = [];
var activeConvId  = null;
var pollTimer     = null;
var lastMsgId     = null;   // track newest message to detect new ones

// ── TOAST ─────────────────────────────────────────────────────────────────────
function toast(msg, type){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:'+(type==='error'?'#dc2626':type==='info'?'#6366f1':'#16a34a')+';color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:9999;font-family:Poppins,sans-serif;white-space:nowrap;pointer-events:none';
  t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500);
}

// ── FORMAT TIME ───────────────────────────────────────────────────────────────
function fmtTime(iso){
  if(!iso) return '';
  var d = new Date(iso);
  var now = new Date();
  var diff = now - d;
  if (diff < 60000) return 'now';
  if (diff < 3600000) return Math.floor(diff/60000)+'m';
  if (diff < 86400000) return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}

function fmtFull(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}

// ── AVATAR HELPER ─────────────────────────────────────────────────────────────
function avatarEl(url, name, cls){
  if(url){
    return '<img src="'+url+'" alt="'+name+'">';
  }
  var init = (name||'?').charAt(0).toUpperCase();
  return '<div class="'+cls+'">'+init+'</div>';
}

// ── LOAD CONVERSATIONS ────────────────────────────────────────────────────────
async function loadConversations(){
  try {
    var r = await fetch(API+'/conversations', {headers: authHeaders()});
    var data = await r.json();
    if(data.success){ conversations = data.data; renderConvList(conversations); }
  } catch(e){ /* silent */ }
}

function renderConvList(convs){
  var el = document.getElementById('conv-list');
  if(!convs.length){
    el.innerHTML = '<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">No conversations yet.<br>Tap <b>New</b> to start one.</div>';
    return;
  }
  el.innerHTML = convs.map(function(c){
    var unread = parseInt(c.unread_count)||0;
    return '<div class="msg-item'+(c.conversation_id===activeConvId?' active':'')+'" onclick="openConv(\''+c.conversation_id+'\',\''+esc(c.other_name)+'\',\''+esc(c.other_username)+'\','+(c.other_avatar?'\''+esc(c.other_avatar)+'\'':"null")+')" data-conv-id="'+c.conversation_id+'">'+
      '<div class="msg-av">'+avatarEl(c.other_avatar, c.other_name, 'msg-av-placeholder')+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="msg-name">'+esc(c.other_name)+'</div>'+
        '<div class="msg-preview">'+(c.last_message?esc(c.last_message.substring(0,60)):'Say hello!')+'</div>'+
      '</div>'+
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'+
        '<div class="msg-time">'+fmtTime(c.last_message_at||c.created_at)+'</div>'+
        (unread>0?'<div class="msg-badge">'+unread+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ── FILTER CONVERSATIONS ──────────────────────────────────────────────────────
function filterConvs(q){
  if(!q.trim()){ renderConvList(conversations); return; }
  var filtered = conversations.filter(function(c){
    return (c.other_name||'').toLowerCase().includes(q.toLowerCase()) ||
           (c.other_username||'').toLowerCase().includes(q.toLowerCase());
  });
  renderConvList(filtered);
}

// ── OPEN CONVERSATION ─────────────────────────────────────────────────────────
async function openConv(convId, name, username, avatar){
  activeConvId = convId;
  lastMsgId = null;

  // Update header
  var avEl = document.getElementById('chat-header-av');
  var phEl = document.getElementById('chat-header-ph');
  var nameEl = document.getElementById('chat-header-name');
  var uEl = document.getElementById('chat-header-username');
  nameEl.textContent = name;
  uEl.textContent = '@'+username;
  if(avatar){
    avEl.innerHTML = '<img src="'+avatar+'" style="width:100%;height:100%;object-fit:cover">';
  } else {
    avEl.innerHTML = '<div class="chat-av-placeholder">'+name.charAt(0).toUpperCase()+'</div>';
  }

  // Mark active in list
  document.querySelectorAll('.msg-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.convId === convId);
  });

  // Load messages
  document.getElementById('chat-body').innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
  await loadMessages(convId, true);

  // Start polling for new messages every 3s
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(function(){ pollNewMessages(); }, 3000);

  // Mobile: show chat window
  if(window.innerWidth <= 768){
    document.getElementById('msg-list').classList.remove('mobile-open');
    document.getElementById('chat-window').style.display = 'flex';
  }
}

// ── LOAD MESSAGES ─────────────────────────────────────────────────────────────
async function loadMessages(convId, scroll){
  try {
    var r = await fetch(API+'/conversations/'+convId+'/messages', {headers: authHeaders()});
    var data = await r.json();
    if(data.success){
      renderMessages(data.data);
      if(scroll){ scrollBottom(); }
      if(data.data.length){
        lastMsgId = data.data[data.data.length-1].message_id;
      }
      // Refresh conv list to clear unread badges
      loadConversations();
    }
  } catch(e){ /* silent */ }
}

// ── POLL FOR NEW MESSAGES ─────────────────────────────────────────────────────
async function pollNewMessages(){
  if(!activeConvId) return;
  try {
    var r = await fetch(API+'/conversations/'+activeConvId+'/messages', {headers: authHeaders()});
    var data = await r.json();
    if(!data.success) return;
    var msgs = data.data;
    if(!msgs.length) return;
    var newest = msgs[msgs.length-1].message_id;
    if(newest !== lastMsgId){
      lastMsgId = newest;
      renderMessages(msgs);
      scrollBottom();
      loadConversations(); // refresh unread counts
    }
  } catch(e){ /* silent */ }
}

// ── RENDER MESSAGES ───────────────────────────────────────────────────────────
function renderMessages(msgs){
  var myId = (me()||{}).user_id;
  var body = document.getElementById('chat-body');
  if(!msgs.length){
    body.innerHTML = '<div class="empty-conv"><i class="ti ti-message-circle"></i><p>No messages yet. Say hello!</p></div>';
    return;
  }
  body.innerHTML = msgs.map(function(m){
    var isMine = m.sender_id === myId;
    var av = isMine ? '' :
      '<div class="bubble-av">'+avatarEl(m.sender_avatar, m.sender_name, 'bubble-av-ph')+'</div>';
    return '<div class="msg-bubble-wrap'+(isMine?' mine':'')+'">'+
      av+
      '<div>'+
        '<div class="bubble '+(isMine?'mine':'theirs')+'">'+esc(m.content)+'</div>'+
        '<div class="bubble-time">'+fmtFull(m.created_at)+(isMine&&m.is_read?' ✓✓':'')+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function scrollBottom(){
  var body = document.getElementById('chat-body');
  body.scrollTop = body.scrollHeight;
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────────────
async function sendMessage(){
  if(!activeConvId){ toast('Select a conversation first','error'); return; }
  var inp = document.getElementById('chat-input');
  var text = inp.value.trim();
  if(!text) return;

  inp.value = '';
  var btn = document.getElementById('send-btn');
  btn.disabled = true;

  // Optimistic bubble
  var myUser = me();
  var body = document.getElementById('chat-body');
  var emptyEl = body.querySelector('.empty-conv');
  if(emptyEl) body.innerHTML = '';
  var time = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  var div = document.createElement('div');
  div.className = 'msg-bubble-wrap mine';
  div.innerHTML = '<div><div class="bubble mine">'+esc(text)+'</div><div class="bubble-time" style="text-align:right">'+time+' ✓</div></div>';
  body.appendChild(div);
  scrollBottom();

  try {
    var r = await fetch(API+'/conversations/'+activeConvId+'/messages', {
      method:'POST', headers: authHeaders(),
      body: JSON.stringify({content: text})
    });
    var data = await r.json();
    if(!data.success){ toast('Failed to send','error'); }
    loadConversations();
  } catch(e){ toast('Network error','error'); }

  btn.disabled = false;
}

// ── NEW CONVERSATION MODAL ────────────────────────────────────────────────────
var userSearchTimer = null;

function openNewMsg(){
  document.getElementById('new-msg-modal').classList.add('open');
  document.getElementById('user-search-inp').value = '';
  document.getElementById('user-results').innerHTML = '<div style="font-size:13px;color:var(--muted);padding:12px 0;text-align:center">Start typing to search</div>';
  setTimeout(function(){ document.getElementById('user-search-inp').focus(); }, 100);
}

function closeNewMsg(){ document.getElementById('new-msg-modal').classList.remove('open'); }

function searchForUser(q){
  clearTimeout(userSearchTimer);
  if(!q.trim()){
    document.getElementById('user-results').innerHTML = '<div style="font-size:13px;color:var(--muted);padding:12px 0;text-align:center">Start typing to search</div>';
    return;
  }
  userSearchTimer = setTimeout(async function(){
    try {
      var r = await fetch(API+'/messages/search-users?q='+encodeURIComponent(q), {headers: authHeaders()});
      var data = await r.json();
      var el = document.getElementById('user-results');
      if(!data.success || !data.data.length){
        el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:12px 0;text-align:center">No users found</div>';
        return;
      }
      el.innerHTML = data.data.map(function(u){
        return '<div class="user-result-item" onclick="startConvWith(\''+u.user_id+'\',\''+esc(u.full_name)+'\',\''+esc(u.username)+'\','+(u.avatar_url?'\''+esc(u.avatar_url)+'\'':"null")+')" >'+
          '<div class="user-result-av">'+avatarEl(u.avatar_url, u.full_name, 'user-result-av-ph')+'</div>'+
          '<div><div class="user-result-name">'+esc(u.full_name)+'</div><div class="user-result-username">@'+esc(u.username)+'</div></div>'+
        '</div>';
      }).join('');
    } catch(e){ /* silent */ }
  }, 300);
}

async function startConvWith(userId, name, username, avatar){
  closeNewMsg();
  try {
    var r = await fetch(API+'/conversations', {
      method:'POST', headers: authHeaders(),
      body: JSON.stringify({other_user_id: userId})
    });
    var data = await r.json();
    if(data.success){
      await loadConversations();
      openConv(data.data.conversation_id, name, username, avatar);
    } else {
      toast('Could not start conversation','error');
    }
  } catch(e){ toast('Network error','error'); }
}

// ── ATTACH PHOTO ──────────────────────────────────────────────────────────────
function attachPhoto(){
  if(!activeConvId){ toast('Select a conversation first','info'); return; }
  toast('Photo sharing coming soon','info');
}

// ── MOBILE BACK BUTTON ────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function(){
  var chatHeader = document.querySelector('.chat-header');
  if(chatHeader && window.innerWidth <= 768){
    chatHeader.style.cursor = 'pointer';
    chatHeader.addEventListener('click', function(e){
      if(e.target.closest('.chat-actions')) return;
      document.getElementById('msg-list').classList.toggle('mobile-open');
    });
  }
  // Initial load
  loadConversations();
});

// ── DRAWER ────────────────────────────────────────────────────────────────────
function openDrawer(){ document.getElementById('drawer-panel').classList.add('open'); document.getElementById('drawer-overlay').classList.add('open'); document.body.style.overflow='hidden'; }
function closeDrawer(){ document.getElementById('drawer-panel').classList.remove('open'); document.getElementById('drawer-overlay').classList.remove('open'); document.body.style.overflow=''; }

// ── CLOSE MODAL ON BACKDROP ───────────────────────────────────────────────────
document.getElementById('new-msg-modal').addEventListener('click', function(e){ if(e.target===this) closeNewMsg(); });
</script>
