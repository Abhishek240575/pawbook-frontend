<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawBook — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<!-- style.css intentionally omitted — self-contained styles below -->
<style>
/* ══ RESET & BASE ══ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#f0f2f5;color:#1c1e21}
:root{--blue:#1877F2;--blue2:#1558b0;--green:#42b72a;--red:#e03030;--bd:#e4e6eb;--muted:#65676b;--white:#fff;--bg:#f0f2f5}

/* ══ SHELL ══ */
.shell{display:grid;grid-template-columns:300px 300px 1fr;height:calc(100vh - 68px);background:#f0f2f5;gap:0}
@media(max-width:1000px){.shell{grid-template-columns:260px 1fr}}
@media(max-width:680px){.shell{grid-template-columns:1fr}}

/* ══ PANE ══ */
.pane{background:var(--white);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}

/* ══ PANE HEADER ══ */
.ph{padding:16px 18px 0;flex-shrink:0}
.ph-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph-title{font-size:20px;font-weight:800;color:#1c1e21}
.ph-acts{display:flex;gap:4px}
.ic-btn{width:36px;height:36px;border-radius:50%;background:#f0f2f5;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--muted);transition:.15s;flex-shrink:0}
.ic-btn:hover{background:#dce0e5;color:var(--blue)}

/* ══ TABS ══ */
.tabs{display:flex;border-bottom:2px solid var(--bd);flex-shrink:0}
.tab{flex:1;padding:10px 0;font-size:12.5px;font-weight:700;background:none;border:none;border-bottom:2.5px solid transparent;margin-bottom:-2px;cursor:pointer;color:var(--muted);font-family:'Poppins',sans-serif;transition:.15s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* ══ SEARCH BAR ══ */
.sbar{display:flex;align-items:center;gap:8px;background:#f0f2f5;border-radius:22px;padding:8px 16px;margin:10px 16px}
.sbar input{border:none;outline:none;background:transparent;font-size:13px;font-family:'Poppins',sans-serif;flex:1;color:#1c1e21}
.sbar i{color:var(--muted);font-size:15px;flex-shrink:0}

/* ══ SCROLL ══ */
.scroll{flex:1;overflow-y:auto}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}

/* ══ USER CARDS ══ */
.uc{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .12s;position:relative}
.uc:hover{background:#f0f7ff}
.uav{width:50px;height:50px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative}
.uav img{width:100%;height:100%;object-fit:cover}
.uav-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;background:var(--blue)}
.uav-dot{position:absolute;bottom:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff}
.ui{flex:1;min-width:0}
.uname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usub{font-size:11.5px;color:var(--muted);margin-top:1px}
.urole{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;flex-shrink:0}
.r-vet{background:#eff6ff;color:#1d4ed8}
.r-shelter{background:#fdf4ff;color:#7e22ce}
.r-owner{background:#f0fdf4;color:#166534}

/* ══ CONV LIST ══ */
.ci{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .12s}
.ci:hover,.ci.active{background:#e7f3ff}
.cav{width:50px;height:50px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e4e6eb}
.cav img{width:100%;height:100%;object-fit:cover}
.cav-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff}
.cav-dm{background:var(--blue)}.cav-grp{background:#7c3aed}.cav-bc{background:#d97706}
.cinfo{flex:1;min-width:0}
.cname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cprev{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmeta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.ctime{font-size:10px;color:var(--muted)}
.cbadge{background:var(--blue);color:#fff;font-size:10px;font-weight:800;border-radius:12px;padding:2px 7px;min-width:20px;text-align:center}

/* ══ CHAT PANE ══ */
.chat{flex:1;background:#f0f2f5;display:flex;flex-direction:column;overflow:hidden}

/* ══ CHAT HEADER ══ */
.chd{background:var(--white);padding:12px 20px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.chd-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0}
.chd-av img{width:100%;height:100%;object-fit:cover}
.chd-av-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff}
.chd-name{font-size:15px;font-weight:800}
.chd-sub{font-size:11px;color:var(--muted);margin-top:1px}
.chd-acts{margin-left:auto;display:flex;gap:6px}

/* ══ EDIT BAR ══ */
.ebar{background:#fff8e1;border-top:2px solid #ffd54f;padding:8px 16px;display:flex;align-items:center;gap:10px;font-size:12px;flex-shrink:0}
.ebar i{color:#f59e0b}
.ebar span{font-weight:600;color:#92400e}

/* ══ MESSAGES ══ */
.cbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.cbody::-webkit-scrollbar{width:4px}
.cbody::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.dsep{text-align:center;font-size:11px;color:var(--muted);margin:10px 0;display:flex;align-items:center;gap:10px}
.dsep::before,.dsep::after{content:'';flex:1;height:1px;background:var(--bd)}

/* ── BUBBLE WRAP ── */
.bw{display:flex;gap:8px;align-items:flex-end;position:relative}
.bw.mine{flex-direction:row-reverse}
.bav2{width:30px;height:30px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#e4e6eb}
.bav2 img{width:100%;height:100%;object-fit:cover}
.bav2-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;background:var(--blue)}
.bgroup{display:flex;flex-direction:column;max-width:65%}
.bsname{font-size:10.5px;font-weight:700;color:var(--blue);margin-bottom:3px}
.bubble{padding:9px 14px;border-radius:18px;font-size:13.5px;line-height:1.55;word-break:break-word;position:relative}
.bubble.theirs{background:var(--white);border-radius:18px 18px 18px 4px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bubble.mine{background:var(--blue);color:#fff;border-radius:18px 18px 4px 18px}
.bubble.ghost{background:#f0f2f5!important;color:var(--muted)!important;font-style:italic;box-shadow:none}
.bmeta{font-size:10px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px}
.bmine .bmeta{justify-content:flex-end}
.edited-tag{font-size:9.5px;color:var(--muted);opacity:.8}

/* ── MESSAGE ACTIONS (hover) ── */
.bw:hover .mact{opacity:1;pointer-events:all}
.mact{position:absolute;top:-34px;background:var(--white);border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.15);display:flex;padding:4px 6px;gap:2px;opacity:0;pointer-events:none;transition:.15s;z-index:20;white-space:nowrap}
.bw.mine .mact{right:40px}.bw.theirs .mact{left:40px}
.mab{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:12px;font-size:14px;transition:.1s;line-height:1}
.mab:hover{background:#f0f2f5}

/* ══ INPUT BAR ══ */
.cfoot{background:var(--white);padding:10px 16px;border-top:1px solid var(--bd);display:flex;align-items:flex-end;gap:10px;flex-shrink:0}
.cinput{flex:1;min-height:40px;max-height:120px;background:#f0f2f5;border:none;border-radius:22px;padding:10px 18px;font-size:13.5px;font-family:'Poppins',sans-serif;resize:none;outline:none;line-height:1.4;color:#1c1e21}
.send-btn{width:42px;height:42px;border-radius:50%;background:var(--blue);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;flex-shrink:0;transition:.12s}
.send-btn:hover{background:var(--blue2);transform:scale(1.05)}
.send-btn:disabled{background:#ccc;cursor:default;transform:none}

/* ══ EMPTY ══ */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:40px}
.empty-icon{width:80px;height:80px;border-radius:50%;background:#e4e6eb;display:flex;align-items:center;justify-content:center;font-size:36px;color:#bcc0c4}
.empty p{font-size:15px;font-weight:700;color:#1c1e21}
.empty span{font-size:13px}

/* ══ BROADCAST ══ */
.bc-compose{background:linear-gradient(135deg,#fffbeb,#fef3c7);border-bottom:1px solid #fde68a;padding:14px 16px;display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.bc-compose textarea{flex:1;background:rgba(255,255,255,.7);border:1.5px solid #fde68a;border-radius:12px;padding:10px 14px;font-size:13px;font-family:'Poppins',sans-serif;resize:none;outline:none;min-height:44px;max-height:100px;color:#1c1e21}
.bc-compose textarea:focus{border-color:#f59e0b}
.bc-send{width:42px;height:42px;border-radius:50%;background:#f59e0b;border:none;cursor:pointer;color:#fff;font-size:19px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bc-item{background:var(--white);border-radius:12px;border:1px solid #fde68a;padding:14px 16px;margin:10px 14px;position:relative}
.bc-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bc-av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#f59e0b;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;flex-shrink:0}
.bc-av img{width:100%;height:100%;object-fit:cover}
.bc-sender{font-size:12.5px;font-weight:700}
.bc-time{font-size:10px;color:var(--muted);margin-left:auto}
.bc-body{font-size:13.5px;line-height:1.55}
.bc-acts{display:flex;gap:8px;margin-top:10px}

/* ══ MODAL ══ */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
.mbg.open{display:flex}
.modal{background:var(--white);border-radius:18px;width:420px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.mhd{padding:18px 22px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between}
.mhd h3{font-size:17px;font-weight:800}
.mbody{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.mfoot{padding:14px 22px;border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:flex-end}
.field label{font-size:11.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea{width:100%;padding:10px 14px;border:1.5px solid var(--bd);border-radius:10px;font-size:13.5px;font-family:'Poppins',sans-serif;outline:none;transition:.15s;background:#fff}
.field input:focus,.field textarea:focus{border-color:var(--blue)}
.btn{padding:10px 22px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;transition:.12s}
.btn-pri{background:var(--blue);color:#fff}.btn-pri:hover{background:var(--blue2)}
.btn-gh{background:#f0f2f5;color:#1c1e21}.btn-gh:hover{background:#dce0e5}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c02020}
.btn-sm{padding:6px 14px;font-size:11.5px;border-radius:8px}

/* ══ MEMBER PICKER ══ */
.mpick{border:1.5px solid var(--bd);border-radius:10px;overflow:hidden;max-height:190px;overflow-y:auto}
.mpi{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .1s}
.mpi:hover{background:#f0f7ff}
.mpi.sel{background:#e7f3ff}
.mpchk{width:20px;height:20px;border:2px solid var(--bd);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800;transition:.12s}
.mpi.sel .mpchk{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{background:#e7f3ff;color:var(--blue);font-size:11.5px;font-weight:700;border-radius:20px;padding:4px 12px;display:flex;align-items:center;gap:5px}
.chip button{background:none;border:none;cursor:pointer;color:inherit;font-size:14px;padding:0;line-height:1}

/* ══ LOADING ══ */
.ld{display:flex;align-items:center;justify-content:center;padding:30px;color:var(--muted)}
.ld i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.emsg{padding:16px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div id="nav-ph">
  <nav style="height:68px;background:#1877F2;display:flex;align-items:center;padding:0 24px;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)">
    <a href="02_feed.html" style="color:#fff;font-size:22px;font-weight:900;text-decoration:none;letter-spacing:-0.5px">🐾 PawBook</a>
    <div style="flex:1;max-width:320px;background:rgba(255,255,255,.15);border-radius:22px;display:flex;align-items:center;padding:6px 14px;gap:8px">
      <i class="ti ti-search" style="color:rgba(255,255,255,.8);font-size:15px"></i>
      <input placeholder="Search PawBook…" style="border:none;outline:none;background:transparent;font-size:13px;color:#fff;font-family:'Poppins',sans-serif;flex:1" onclick="location.href='27_search.html'">
    </div>
    <div style="flex:1"></div>
    <a href="02_feed.html" style="color:rgba(255,255,255,.85);font-size:13px;font-weight:600;text-decoration:none">Feed</a>
    <a href="13_messages.html" style="color:#fff;font-size:13px;font-weight:700;text-decoration:none;border-bottom:2px solid rgba(255,255,255,.8);padding-bottom:2px">Messages</a>
    <a href="05_profile.html" style="color:rgba(255,255,255,.85);font-size:13px;font-weight:600;text-decoration:none">Profile</a>
  </nav>
</div>

<div class="shell">
  <!-- ══ PANE 1: PEOPLE + CHATS ══ -->
  <div class="pane" id="pane1">
    <div class="ph">
      <div class="ph-row">
        <span class="ph-title">Messages</span>
        <div class="ph-acts">
          <button class="ic-btn" title="New group chat" onclick="openNewGroupModal()"><i class="ti ti-users-plus"></i></button>
        </div>
      </div>
      <div class="sbar">
        <i class="ti ti-search"></i>
        <input id="psearch" placeholder="Search people…" oninput="debouncePeople(this.value)">
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-people" onclick="setTab('people')">People</button>
      <button class="tab" id="tab-chats" onclick="setTab('chats')">Chats</button>
    </div>
    <div class="scroll" id="people-pane">
      <div class="ld"><i class="ti ti-loader-2"></i></div>
    </div>
    <div class="scroll" id="chats-pane" style="display:none">
      <div class="ld"><i class="ti ti-loader-2"></i></div>
    </div>
  </div>

  <!-- ══ PANE 2: GROUP + BROADCAST ══ -->
  <div class="pane" id="pane2">
    <div class="ph">
      <div class="ph-row">
        <span class="ph-title" style="font-size:16px">Group Chats</span>
        <div class="ph-acts">
          <button class="ic-btn" title="Create group" onclick="openNewGroupModal()"><i class="ti ti-plus"></i></button>
        </div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-groups" onclick="setP2Tab('groups')">Groups</button>
      <button class="tab" id="tab-bc" onclick="setP2Tab('bc')">Broadcast</button>
    </div>
    <div class="scroll" id="groups-pane">
      <div class="ld"><i class="ti ti-loader-2"></i></div>
    </div>
    <div id="bc-pane" style="display:none;flex:1;flex-direction:column;overflow:hidden">
      <div class="bc-compose">
        <i class="ti ti-speakerphone" style="font-size:22px;color:#f59e0b;flex-shrink:0;margin-bottom:4px"></i>
        <textarea id="bc-inp" placeholder="Write a broadcast to all users…" rows="2"></textarea>
        <button class="bc-send" onclick="sendBroadcast()"><i class="ti ti-send"></i></button>
      </div>
      <div class="scroll" id="bc-list"><div class="ld"><i class="ti ti-loader-2"></i></div></div>
    </div>
  </div>

  <!-- ══ PANE 3: CHAT ══ -->
  <div class="chat" id="chat-pane">
    <div class="empty">
      <div class="empty-icon"><i class="ti ti-messages"></i></div>
      <p>Your messages</p>
      <span>Select a person or conversation<br>to start chatting</span>
    </div>
  </div>
</div>

<!-- NEW GROUP MODAL -->
<div class="mbg" id="m-group">
  <div class="modal">
    <div class="mhd"><h3>New Group Chat</h3><button class="ic-btn" onclick="closeM('m-group')"><i class="ti ti-x"></i></button></div>
    <div class="mbody">
      <div class="field"><label>Group Name *</label><input id="ng-name" placeholder="e.g. Dog Lovers Mumbai"></div>
      <div class="field">
        <label>Add Members</label>
        <div class="sbar" style="margin:0 0 8px"><i class="ti ti-search"></i><input id="ng-search" placeholder="Search users…" oninput="debNGS(this.value)"></div>
        <div class="chips" id="ng-chips" style="margin-bottom:8px"></div>
        <div class="mpick" id="ng-pick"></div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-gh" onclick="closeM('m-group')">Cancel</button>
      <button class="btn btn-pri" onclick="createGroup()">Create Group</button>
    </div>
  </div>
</div>

<!-- ADD MEMBERS MODAL -->
<div class="mbg" id="m-addmem">
  <div class="modal">
    <div class="mhd"><h3>Add Members</h3><button class="ic-btn" onclick="closeM('m-addmem')"><i class="ti ti-x"></i></button></div>
    <div class="mbody">
      <div class="sbar" style="margin:0 0 8px"><i class="ti ti-search"></i><input id="am-search" placeholder="Search users…" oninput="debAMS(this.value)"></div>
      <div class="chips" id="am-chips" style="margin-bottom:8px"></div>
      <div class="mpick" id="am-pick"></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-gh" onclick="closeM('m-addmem')">Cancel</button>
      <button class="btn btn-pri" onclick="confirmAddMem()">Add Members</button>
    </div>
  </div>
</div>

<script>
const API = 'https://pawbook-api-cquc.onrender.com/api/v1';
const tok = () => localStorage.getItem('pb_token') || '';
const me  = () => { try{ return JSON.parse(localStorage.getItem('pb_user')||'{}'); }catch(e){ return {}; } };
const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };
const ini = n => (n||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
const rel = ts => {
  const d=(Date.now()-new Date(ts))/1000;
  if(d<60) return 'now';
  if(d<3600) return Math.floor(d/60)+'m';
  if(d<86400) return Math.floor(d/3600)+'h';
  return new Date(ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
};
const av = (url,name,cls) => url
  ? `<img src="${esc(url)}" alt="" onerror="this.style.display='none'">`
  : `<div class="${cls||''}" style="${!cls?'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#fff;background:var(--blue)':''}">${esc(ini(name))}</div>`;

async function api(path, opts={}){
  try{
    const r = await fetch(API+path, {
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+tok()},
      ...opts
    });
    return r.json();
  }catch(e){ return {success:false, message:'Network error'}; }
}

if(!tok()){ location.href='01_login.html'; }
// navbar is inline — no fetch needed

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let activeId=null, activeType=null; // 'dm'|'group'
let pollId=null, lastId=null;
let selMem={}, addMem={};
let editState=null; // {id, type}
let curGroupId=null;

// ══════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════
function setTab(t){
  ['people','chats'].forEach(k=>{
    document.getElementById('tab-'+k).classList.toggle('active',k===t);
    document.getElementById(k==='people'?'people-pane':'chats-pane').style.display=k===t?'':'none';
  });
  if(t==='chats') loadConvs();
}
function setP2Tab(t){
  ['groups','bc'].forEach(k=>{
    document.getElementById('tab-'+k).classList.toggle('active',k===t);
  });
  document.getElementById('groups-pane').style.display = t==='groups'?'':'none';
  document.getElementById('bc-pane').style.display     = t==='bc'?'flex':'none';
  if(t==='bc') loadBroadcasts();
}

// ══════════════════════════════════════════════════════════
// PEOPLE
// ══════════════════════════════════════════════════════════
async function loadPeople(q=''){
  const el = document.getElementById('people-pane');
  el.innerHTML = '<div class="ld"><i class="ti ti-loader-2"></i></div>';
  let users = [];
  const term = q.trim();
  if(term){
    // Typed search — try both endpoints
    let r = await api('/messages/search-users?q='+encodeURIComponent(term));
    if(!r.success || !r.data?.length){
      r = await api('/users/search?q='+encodeURIComponent(term));
    }
    users = r.success ? (r.data||[]) : [];
  } else {
    // No query — try /messages/users first (new endpoint)
    let r = await api('/messages/users');
    if(r.success && r.data?.length){
      users = r.data;
    } else {
      // Fallback: search common letters in parallel to get a broad user list
      const letters = ['a','e','i','o','u','s','n','r'];
      const results = await Promise.all(
        letters.map(l => api('/messages/search-users?q='+l).then(x=>x.success?x.data||[]:[]))
      );
      const seen = new Set();
      for(const arr of results){
        for(const u of arr){
          if(!seen.has(u.user_id)){ seen.add(u.user_id); users.push(u); }
        }
      }
    }
  }
  renderPeople(users, el);
}
function renderPeople(users, el){
  if(!users.length){
    el.innerHTML='<div class="emsg">No users found</div>'; return;
  }
  const roleMap={vet:{cls:'r-vet',label:'Vet'},shelter_admin:{cls:'r-shelter',label:'Shelter'},pet_owner:{cls:'r-owner',label:'Owner'}};
  el.innerHTML = users.map(u=>{
    const rm = roleMap[u.role]||{cls:'r-owner',label:'User'};
    return `<div class="uc" onclick="dmUser('${esc(u.user_id)}','${esc(u.full_name)}','${esc(u.username||'')}','${esc(u.avatar_url||'')}')">
      <div class="uav">
        ${av(u.avatar_url, u.full_name)}
        ${u.is_online?'<div class="uav-dot"></div>':''}
      </div>
      <div class="ui">
        <div class="uname">${esc(u.full_name)}</div>
        <div class="usub">@${esc(u.username||'')}${u.is_online?' · <span style="color:var(--green);font-weight:600">Online</span>':''}</div>
      </div>
      <span class="urole ${rm.cls}">${rm.label}</span>
    </div>`;
  }).join('');
}
let ptimer;
function debouncePeople(v){ clearTimeout(ptimer); ptimer=setTimeout(()=>loadPeople(v),300); }
async function dmUser(uid, name, username, avatar){
  const r = await api('/conversations',{method:'POST',body:JSON.stringify({other_user_id:uid})});
  if(!r.success){alert('Could not start conversation: '+r.message);return;}
  setTab('chats');
  loadConvs();
  openConv(r.data.conversation_id, name, username, avatar, 'dm');
}

// ══════════════════════════════════════════════════════════
// CONVERSATIONS
// ══════════════════════════════════════════════════════════
async function loadConvs(){
  const el = document.getElementById('chats-pane');
  const r = await api('/conversations');
  if(!r.success||!r.data?.length){
    el.innerHTML='<div class="emsg">No conversations yet.<br><span style="font-size:12px">Go to People to start one.</span></div>'; return;
  }
  el.innerHTML = r.data.map(c=>`
    <div class="ci ${activeId===c.conversation_id&&activeType==='dm'?'active':''}"
         onclick="openConv('${esc(c.conversation_id)}','${esc(c.other_name)}','${esc(c.other_username||'')}','${esc(c.other_avatar||'')}','dm')">
      <div class="cav"><div class="cav-ph cav-dm">${esc(ini(c.other_name))}</div>
        ${c.other_avatar?`<img src="${esc(c.other_avatar)}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%">`:''}</div>
      <div class="cinfo">
        <div class="cname">${esc(c.other_name)}</div>
        <div class="cprev">${esc(c.last_message||'Start chatting…')}</div>
      </div>
      <div class="cmeta">
        <span class="ctime">${c.last_message_at?rel(c.last_message_at):''}</span>
        ${c.unread_count>0?`<span class="cbadge">${c.unread_count}</span>`:''}
      </div>
    </div>`).join('');
}
async function openConv(id, name, username, avatar, type){
  clearInterval(pollId); lastId=null;
  activeId=id; activeType=type;
  renderChatShell(name, username, avatar, type);
  await loadMsgs(type);
  pollId = setInterval(()=>pollMsgs(type), 3000);
  if(type==='dm') loadConvs();
  else loadGroupConvs();
}
function renderChatShell(name, username, avatar, type){
  const isGrp = type==='group';
  const avHTML = avatar
    ? `<img src="${esc(avatar)}" alt="">`
    : `<div class="chd-av-ph" style="background:${isGrp?'#7c3aed':'var(--blue)'}">${esc(ini(name))}</div>`;
  document.getElementById('chat-pane').innerHTML = `
    <div class="chd">
      <div class="chd-av">${avHTML}</div>
      <div>
        <div class="chd-name">${esc(name)}</div>
        <div class="chd-sub">${isGrp?'Group chat · tap ➕ to add members':'@'+esc(username)}</div>
      </div>
      <div class="chd-acts">
        ${isGrp?`<button class="ic-btn" title="Add members" onclick="openAddMemModal()"><i class="ti ti-user-plus"></i></button>`:''}
        <button class="ic-btn" title="Close" onclick="closeChat()"><i class="ti ti-x"></i></button>
      </div>
    </div>
    <div id="ebar" style="display:none" class="ebar">
      <i class="ti ti-pencil"></i><span>Editing message</span>
      <button class="btn btn-gh btn-sm" onclick="cancelEdit()" style="margin-left:auto">Cancel</button>
    </div>
    <div class="cbody" id="cbody"></div>
    <div class="cfoot">
      <textarea class="cinput" id="cinp" placeholder="Write a message…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="send-btn" onclick="sendMsg()"><i class="ti ti-send"></i></button>
    </div>`;
}
async function loadMsgs(type){
  const el=document.getElementById('cbody'); if(!el) return;
  const url = type==='group'
    ? `/group-conversations/${activeId}/messages`
    : `/conversations/${activeId}/messages`;
  const r = await api(url);
  if(!r.success){ el.innerHTML='<div class="emsg">Could not load messages</div>'; return; }
  renderMsgs(r.data||[], type);
}
function renderMsgs(msgs, type){
  const el=document.getElementById('cbody'); if(!el) return;
  if(!msgs.length){
    el.innerHTML='<div class="emsg" style="padding:32px">No messages yet. Say hi! 👋</div>'; return;
  }
  const myId=me().user_id;
  lastId = msgs.at(-1)?.message_id || msgs.at(-1)?.group_msg_id;
  let html='', lastDate='';
  for(const m of msgs){
    const isMine = m.sender_id===myId;
    const msgId  = m.message_id||m.group_msg_id;
    const dateStr= new Date(m.created_at).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    if(dateStr!==lastDate){ html+=`<div class="dsep">${esc(dateStr)}</div>`; lastDate=dateStr; }
    const ghost  = m.is_deleted||m.is_revoked;
    const avHtml = m.sender_avatar
      ? `<img src="${esc(m.sender_avatar)}" alt="">`
      : `<div class="bav2-ph">${esc(ini(m.sender_name))}</div>`;
    const acts = isMine && !ghost ? `
      <div class="mact">
        <button class="mab" title="Edit" onclick="startEdit('${esc(msgId)}','${type}','${esc(m.content).replace(/'/g,'&#39;')}')">✏️</button>
        <button class="mab" title="Delete" onclick="delMsg('${esc(msgId)}','${type}')">🗑️</button>
        <button class="mab" title="Revoke for everyone (15 min)" onclick="revokeMsg('${esc(msgId)}','${type}')">↩️</button>
      </div>` : '';
    html+=`<div class="bw ${isMine?'mine':'theirs'}">
      ${!isMine?`<div class="bav2">${avHtml}</div>`:''}
      <div class="bgroup">
        ${!isMine&&type==='group'?`<div class="bsname">${esc(m.sender_name)}</div>`:''}
        <div class="bubble ${isMine?'mine':'theirs'}${ghost?' ghost':''}">${esc(m.content)}</div>
        <div class="bmeta ${isMine?'bmine':''}">
          <span>${rel(m.created_at)}</span>
          ${m.edited_at&&!ghost?`<span class="edited-tag">· edited</span>`:''}
          ${isMine&&m.is_read?'<i class="ti ti-checks" style="font-size:12px;color:var(--blue)"></i>':''}
        </div>
        ${acts}
      </div>
      ${isMine?`<div class="bav2">${avHtml}</div>`:''}
    </div>`;
  }
  el.innerHTML=html; el.scrollTop=el.scrollHeight;
}
async function pollMsgs(type){
  const el=document.getElementById('cbody'); if(!el||!activeId) return;
  const url = type==='group'
    ? `/group-conversations/${activeId}/messages`
    : `/conversations/${activeId}/messages`;
  const r = await api(url);
  if(!r.success) return;
  const msgs=r.data||[];
  const newLast = msgs.at(-1)?.message_id || msgs.at(-1)?.group_msg_id;
  if(newLast!==lastId) renderMsgs(msgs,type);
}
async function sendMsg(){
  const inp=document.getElementById('cinp'); if(!inp) return;
  const content=inp.value.trim(); if(!content) return;
  if(editState){ await doEdit(content); return; }
  inp.value=''; inp.style.height='auto';
  // optimistic
  const el=document.getElementById('cbody');
  const tid='tmp'+Date.now();
  el?.insertAdjacentHTML('beforeend',`<div class="bw mine" id="${tid}">
    <div class="bgroup"><div class="bubble mine">${esc(content)}</div>
    <div class="bmeta bmine"><span>sending…</span></div></div>
  </div>`);
  el && (el.scrollTop=el.scrollHeight);
  const url = activeType==='group'
    ? `/group-conversations/${activeId}/messages`
    : `/conversations/${activeId}/messages`;
  const r = await api(url,{method:'POST',body:JSON.stringify({content})});
  document.getElementById(tid)?.remove();
  if(r.success) pollMsgs(activeType);
  else alert('Failed to send: '+r.message);
}
function closeChat(){
  clearInterval(pollId); activeId=null; activeType=null;
  document.getElementById('chat-pane').innerHTML=`<div class="empty">
    <div class="empty-icon"><i class="ti ti-messages"></i></div>
    <p>Your messages</p><span>Select a person or conversation to start chatting</span>
  </div>`;
}

// ══════════════════════════════════════════════════════════
// EDIT / DELETE / REVOKE
// ══════════════════════════════════════════════════════════
function startEdit(msgId, type, content){
  editState={msgId,type};
  const inp=document.getElementById('cinp');
  inp.value=content; inp.focus();
  const eb=document.getElementById('ebar');
  if(eb) eb.style.display='flex';
}
function cancelEdit(){
  editState=null;
  const inp=document.getElementById('cinp'); if(inp) inp.value='';
  const eb=document.getElementById('ebar'); if(eb) eb.style.display='none';
}
async function doEdit(content){
  if(!editState) return;
  const {msgId,type}=editState;
  const url=type==='group'
    ?`/group-conversations/${activeId}/messages/${msgId}`
    :`/conversations/${activeId}/messages/${msgId}`;
  const r=await api(url,{method:'PATCH',body:JSON.stringify({content})});
  cancelEdit();
  if(r.success) pollMsgs(type); else alert('Edit failed: '+r.message);
}
async function delMsg(msgId,type){
  if(!confirm('Delete this message?')) return;
  const url=type==='group'
    ?`/group-conversations/${activeId}/messages/${msgId}`
    :`/conversations/${activeId}/messages/${msgId}`;
  const r=await api(url,{method:'DELETE'});
  if(r.success) pollMsgs(type); else alert(r.message);
}
async function revokeMsg(msgId,type){
  if(!confirm('Revoke this message for everyone?\n(Only possible within 15 minutes)')) return;
  const url=type==='group'
    ?`/group-conversations/${activeId}/messages/${msgId}/revoke`
    :`/conversations/${activeId}/messages/${msgId}/revoke`;
  const r=await api(url,{method:'POST'});
  if(r.success) pollMsgs(type); else alert(r.message||'Revoke failed (must be within 15 minutes)');
}

async function loadGroupConvs(){
  const el=document.getElementById('groups-pane');
  const r=await api('/group-conversations');
  if(!r.success||!r.data?.length){
    el.innerHTML='<div class="emsg">No group chats yet.<br><span style="font-size:12px">Tap ➕ to create one.</span></div>'; return;
  }
  el.innerHTML=r.data.map(g=>`
    <div class="ci ${activeId===g.group_conv_id&&activeType==='group'?'active':''}"
         onclick="openConv('${esc(g.group_conv_id)}','${esc(g.name)}','','','group')">
      <div class="cav"><div class="cav-ph cav-grp">${esc(ini(g.name))}</div></div>
      <div class="cinfo">
        <div class="cname">${esc(g.name)}</div>
        <div class="cprev">${esc(g.last_message||'Group created')}</div>
      </div>
      <div class="cmeta">
        <span class="ctime">${g.last_message_at?rel(g.last_message_at):''}</span>
        ${g.unread_count>0?`<span class="cbadge">${g.unread_count}</span>`:''}
      </div>
    </div>`).join('');
}
// New group modal
function openNewGroupModal(){
  selMem={};
  document.getElementById('ng-name').value='';
  document.getElementById('ng-search').value='';
  document.getElementById('ng-pick').innerHTML='';
  renderChips('ng-chips',selMem,'ng');
  openM('m-group');
}
let ngsT;
function debNGS(v){ clearTimeout(ngsT); ngsT=setTimeout(()=>searchPick(v,'ng-pick',selMem,'ng'),300); }
async function searchPick(q, pickId, sel, ctx){
  if(!q.trim()){ document.getElementById(pickId).innerHTML=''; return; }
  const r=await api('/messages/search-users?q='+encodeURIComponent(q));
  const users=r.data||[];
  document.getElementById(pickId).innerHTML=users.map(u=>`
    <div class="mpi ${sel[u.user_id]?'sel':''}" onclick="toggleSel('${esc(u.user_id)}','${esc(u.full_name)}','${esc(u.username||'')}','${pickId}',${JSON.stringify(ctx)})">
      <div class="mpchk">${sel[u.user_id]?'✓':''}</div>
      <div class="uav" style="width:32px;height:32px">${av(u.avatar_url,u.full_name)}</div>
      <div><div style="font-size:12.5px;font-weight:700">${esc(u.full_name)}</div><div class="usub">@${esc(u.username||'')}</div></div>
    </div>`).join('');
}
function toggleSel(uid,name,username,pickId,ctx){
  const sel=ctx==='ng'?selMem:addMem;
  const chipsId=ctx==='ng'?'ng-chips':'am-chips';
  const searchId=ctx==='ng'?'ng-search':'am-search';
  if(sel[uid]) delete sel[uid]; else sel[uid]={user_id:uid,full_name:name,username};
  renderChips(chipsId,sel,ctx);
  searchPick(document.getElementById(searchId).value,pickId,sel,ctx);
}
function renderChips(id,sel,ctx){
  document.getElementById(id).innerHTML=Object.values(sel).map(u=>
    `<div class="chip">${esc(u.full_name)}<button onclick="toggleSel('${esc(u.user_id)}','${esc(u.full_name)}','${esc(u.username||'')}','${ctx==='ng'?'ng-pick':'am-pick'}','${ctx}')">×</button></div>`
  ).join('');
}
async function createGroup(){
  const name=document.getElementById('ng-name').value.trim();
  if(!name){alert('Group name required');return;}
  const member_ids=Object.keys(selMem);
  const r=await api('/group-conversations',{method:'POST',body:JSON.stringify({name,member_ids})});
  if(!r.success){alert('Error: '+r.message);return;}
  closeM('m-group'); loadGroupConvs();
  openConv(r.data.group_conv_id,name,'','','group');
}
// Add members
function openAddMemModal(){
  addMem={};
  document.getElementById('am-search').value='';
  document.getElementById('am-pick').innerHTML='';
  renderChips('am-chips',addMem,'am');
  openM('m-addmem');
}
let amsT;
function debAMS(v){ clearTimeout(amsT); amsT=setTimeout(()=>searchPick(v,'am-pick',addMem,'am'),300); }
async function confirmAddMem(){
  const ids=Object.keys(addMem);
  if(!ids.length){alert('Select at least one person');return;}
  const r=await api(`/group-conversations/${activeId}/members`,{method:'POST',body:JSON.stringify({member_ids:ids})});
  if(!r.success){alert('Error: '+r.message);return;}
  closeM('m-addmem'); alert(`Added ${r.data.added} member(s) ✅`);
}

// ══════════════════════════════════════════════════════════
// BROADCAST
// ══════════════════════════════════════════════════════════
async function loadBroadcasts(){
  const el=document.getElementById('bc-list');
  const r=await api('/broadcasts');
  if(!r.success){
    el.innerHTML='<div class="emsg">Broadcast not available yet.<br><span style="font-size:11px">Push backend update first.</span></div>'; return;
  }
  const bcs=r.data||[];
  const myId=me().user_id;
  if(!bcs.length){el.innerHTML='<div class="emsg">No broadcasts yet</div>';return;}
  el.innerHTML=bcs.map(b=>`
    <div class="bc-item">
      <div class="bc-meta">
        <div class="bc-av">${b.sender_avatar?`<img src="${esc(b.sender_avatar)}" alt="">`:esc(ini(b.sender_name))}</div>
        <span class="bc-sender">${esc(b.sender_name)}</span>
        <span class="bc-time">${rel(b.created_at)}${b.edited_at?' · edited':''}</span>
      </div>
      <div class="bc-body">${b.is_revoked?'<em style="color:var(--muted)">[Broadcast revoked]</em>':esc(b.content)}</div>
      ${b.sender_id===myId&&!b.is_revoked?`<div class="bc-acts">
        <button class="btn btn-gh btn-sm" onclick="editBC('${esc(b.broadcast_id)}','${esc(b.content).replace(/'/g,"&#39;")}')">Edit</button>
        <button class="btn btn-red btn-sm" onclick="revokeBC('${esc(b.broadcast_id)}')">Revoke</button>
      </div>`:''}
    </div>`).join('');
}
async function sendBroadcast(){
  const inp=document.getElementById('bc-inp');
  const content=inp.value.trim(); if(!content) return;
  const r=await api('/broadcasts',{method:'POST',body:JSON.stringify({content})});
  if(r.success){inp.value='';loadBroadcasts();} else alert('Failed: '+r.message);
}
async function editBC(id,current){
  const c=prompt('Edit broadcast:',current);
  if(!c?.trim()) return;
  const r=await api(`/broadcasts/${id}`,{method:'PATCH',body:JSON.stringify({content:c})});
  if(r.success) loadBroadcasts(); else alert('Edit failed: '+r.message);
}
async function revokeBC(id){
  if(!confirm('Revoke this broadcast for everyone?')) return;
  const r=await api(`/broadcasts/${id}/revoke`,{method:'POST'});
  if(r.success) loadBroadcasts(); else alert('Failed: '+r.message);
}
