<!DOCTYPE html>

<style id="mobile-nuclear">
/* NUCLEAR MOBILE FIX - prevents ALL horizontal overflow */
html { overflow-x: hidden !important; }
body { overflow-x: hidden !important; max-width: 100vw !important; }

@media (max-width: 768px) {
  /* Every single element respects viewport */
  *, *::before, *::after {
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  
  /* But don't break inline elements */
  span, a, i, b, strong, em, small, label {
    max-width: none !important;
  }
  
  /* Force body full width */
  html, body {
    width: 100% !important;
    overflow-x: hidden !important;
  }
  
  /* Kill ALL fixed pixel widths on layout elements */
  div, section, article, main, nav, header, footer, aside {
    max-width: 100% !important;
    min-width: 0 !important;
  }
  
  /* Force single column on ALL grid/flex layouts */
  .page, .page-wrap, [class*="layout"], [class*="wrap"],
  [class*="grid"], [class*="container"] {
    display: block !important;
    width: 100% !important;
    padding-left: 10px !important;
    padding-right: 10px !important;
    padding-bottom: 72px !important;
  }
  
  /* Override inline style grids */
  [style*="grid-template-columns"],
  [style*="display: grid"],
  [style*="display:grid"] {
    display: block !important;
  }
  
  /* Override inline style flex that causes overflow */
  [style*="width: 1"], [style*="width:1"],
  [style*="width: 8"], [style*="width: 9"] {
    width: 100% !important;
    max-width: 100% !important;
  }
  
  /* Sidebars always hidden */
  .left-sidebar, .right-sidebar, aside,
  [class*="sidebar"], .right-panel, .left-panel:not(.main) {
    display: none !important;
  }
  
  /* Cards, content areas */
  .card, .card-body, .sc-body, .settings-content,
  [class*="content"], [class*="panel"]:not(.drawer-panel) {
    width: 100% !important;
    max-width: 100% !important;
    border-radius: 10px !important;
  }
  
  /* Topnav */
  .topnav, nav.topnav {
    padding: 0 12px !important;
    gap: 8px !important;
  }
  .topnav-tabs, .nav-tabs { display: none !important; }
  .topnav-search, .nav-search { 
    flex: 1 !important;
    min-width: 0 !important;
    max-width: 160px !important;
  }
  
  /* Bottom nav */
  .bottomnav { display: flex !important; }
  
  /* Padding top for fixed navbar */
  body { padding-top: 0 !important; }
  .page, .page-wrap { padding-top: 64px !important; }
  
  /* Tabs - horizontal scroll */
  .tabs, [class*="tab-bar"], [class*="filter-row"],
  .filter-row, .filter-row1, .filter-row2 {
    overflow-x: auto !important;
    flex-wrap: nowrap !important;
    white-space: nowrap !important;
    -webkit-overflow-scrolling: touch !important;
    scrollbar-width: none !important;
  }
  .tabs::-webkit-scrollbar,
  [class*="filter-row"]::-webkit-scrollbar { display: none !important; }
  
  /* Images */
  img { max-width: 100% !important; height: auto !important; }
  
  /* Tables */
  table { display: block !important; overflow-x: auto !important; width: 100% !important; }
  
  /* Modals */
  .modal-box, [class*="modal-box"],
  [id*="modal"] > div:first-child {
    width: calc(100vw - 24px) !important;
    max-width: calc(100vw - 24px) !important;
    margin: 0 auto !important;
  }
  
  /* Profile page specific */
  .profile-header, .profile-tabs { width: 100% !important; }
  .profile-grid, .pet-grid { grid-template-columns: 1fr !important; }
  
  /* Vet cards */
  .vet-grid, .vet-list { 
    grid-template-columns: 1fr !important;
    display: block !important;
  }
  
  /* Messages */
  .msg-layout {
    display: block !important;
    height: auto !important;
    min-height: calc(100vh - 112px) !important;
  }
  .msg-panel { display: none !important; }
  
  /* Settings */
  .settings-page, .settings-layout { display: block !important; }
  .settings-nav {
    display: flex !important;
    flex-wrap: wrap !important;
    gap: 6px !important;
    padding: 10px !important;
    position: static !important;
  }
  .sn-item {
    flex: 0 0 auto !important;
    padding: 7px 12px !important;
    border-radius: 999px !important;
    font-size: 12px !important;
    border-left-width: 1.5px !important;
  }
  
  /* Discover */
  .main-content { flex-direction: column !important; display: block !important; }
  .left-panel { width: 100% !important; max-height: none !important; height: auto !important; }
  .map-panel { height: 280px !important; }
  
  /* Home feed - edge to edge */
  #feed > div, #feed .card { border-radius: 0 !important; }
  
  /* Pet profile */
  .profile-tabs { overflow-x: auto !important; white-space: nowrap !important; }
  .profile-tab { display: inline-block !important; white-space: nowrap !important; }
  
  /* Three-column home */
  .home-3col, .three-col { display: block !important; }
}

@media (max-width: 480px) {
  .topnav-search, .nav-search { display: none !important; }
  body { font-size: 14px !important; }
}
</style>

<style>

.nav-icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:#f0f2f5;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#050505;font-size:18px}

.nav-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1877F2,#8b5cf6);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}

.page-wrap{padding-top:56px;max-width:680px;margin:0 auto;padding-bottom:70px}

/* Filter tabs */
.notif-header{background:#fff;border-bottom:1px solid #e4e6eb;display:flex;align-items:center;justify-content:space-between;padding:0 16px}

/* Notification items */
.notif-section{padding:12px 16px 6px;font-size:12px;font-weight:800;color:#65676b;text-transform:uppercase;letter-spacing:.5px}
.notif-item{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;cursor:pointer;transition:background .1s;border-bottom:1px solid #f8fafc;background:#fff}

.notif-icon-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff}

.notif-thumb{width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0}
.notif-thumb img{width:100%;height:100%;object-fit:cover;display:block}

.empty-state{text-align:center;padding:60px 20px;color:#8a8d91}
.empty-state-icon{font-size:56px;margin-bottom:12px}

.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.88);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}

<style id="burger-styles">
/* BURGER BUTTON */
.burger-btn { display:flex; width:38px; height:38px; border-radius:50%; border:none; background:transparent; cursor:pointer; color:#1877F2; font-size:28px; align-items:center; justify-content:center; flex-shrink:0; font-weight:900; line-height:1; padding:0; }

/* DRAWER OVERLAY */
.drawer-overlay {

}
.drawer-overlay.open { display: block; }
/* DRAWER PANEL */
.drawer-panel {
  position: fixed; top: 0; left: -320px; bottom: 0;

}
.drawer-item:hover { background: #eff6ff; color: #1a56db; }
.drawer-item i { font-size: 20px; width: 24px; flex-shrink: 0; }
.drawer-badge { margin-left: auto; background: #dc2626; color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; }
.drawer-footer { padding: 8px 0; border-top: 1px solid #e4e6eb; }
/* BOTTOM NAV */
.bottomnav {
  display: none !important;
  position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
  background: #fff; border-top: 1px solid #e4e6eb;
  box-shadow: 0 -2px 8px rgba(0,0,0,.08); z-index: 300;

@media (max-width: 768px) { .bottomnav { display: flex !important; } }
.bnav-item {

@media (max-width: 768px) { body { padding-bottom: 72px; } }

}

  var t=document.getElementById('pb-toast');

  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2600);
}

var currentFilter = 'all';
var currentSearch = '';

function renderNotifs() {
  var filtered = NOTIFS.filter(function(n) {
    if(currentFilter === 'unread' && !n.unread) return false;
    if(currentFilter === 'health' && n.type !== 'health') return false;
    if(currentFilter === 'social' && n.type !== 'social') return false;
    if(currentSearch) {
      var text = n.text.replace(/<[^>]+>/g,'').toLowerCase();
      if(text.indexOf(currentSearch.toLowerCase()) < 0) return false;
    }
    return true;
  });

  var list = document.getElementById('notif-list');
  if(!filtered.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔔</div><div style="font-size:16px;font-weight:700;margin-bottom:6px">All caught up!</div><div style="font-size:13px">No notifications to show</div></div>';
    return;
  }

  var categories = {new:'New',today:'Today',week:'This Week',older:'Earlier'};
  var html = '';
  var shown = {};

  Object.keys(categories).forEach(function(cat) {
    var items = filtered.filter(function(n){ return n.category === cat; });
    if(!items.length) return;
    html += '<div class="notif-section">'+categories[cat]+'</div>';
    items.forEach(function(n) {
      // Avatar
      var avHtml = '';
      if(n.icon && n.icon.startsWith('http')) {
        avHtml = '<img src="'+n.icon+'" alt="">';
      } else {
        avHtml = '<div style="width:44px;height:44px;border-radius:50%;background:'+(n.iconBg||'#f0f2f5')+';display:flex;align-items:center;justify-content:center;font-size:22px">'+n.icon+'</div>';
      }

      // Action buttons
      var actionsHtml = '';
      if(n.actions) {
        actionsHtml = '<div class="notif-action-btns"><button class="notif-btn-accept" onclick="event.stopPropagation();acceptInvite('+n.id+',this)">Accept</button><button class="notif-btn-decline" onclick="event.stopPropagation();declineInvite('+n.id+',this)">Decline</button></div>';
      } else if(n.followBtn) {
        actionsHtml = '<div class="notif-action-btns"><button class="notif-btn-accept" onclick="event.stopPropagation();followBack('+n.id+',this)">Follow Back</button></div>';
      } else if(n.btn) {
        actionsHtml = '<div class="notif-action-btns"><button class="notif-btn-accept" onclick="event.stopPropagation();'+n.btn.action+'">'+n.btn.label+'</button></div>';
      }

      html += '<div class="notif-item'+(n.unread?' unread':'')+'" id="notif-'+n.id+'" onclick="markOneRead('+n.id+')">' +
        '<div class="notif-av" style="position:relative">'+avHtml+
          '<div class="notif-icon-badge" style="background:'+n.badgeBg+'">'+n.badge+'</div>'+
        '</div>'+
        '<div class="notif-body">'+
          '<div class="notif-text">'+n.text+'</div>'+
          '<div class="notif-time">'+n.time+'</div>'+
          actionsHtml+
        '</div>'+
        (n.thumb ? '<div class="notif-thumb"><img src="'+n.thumb+'" alt=""></div>' : '')+
        (n.unread ? '<div class="notif-dot"></div>' : '')+
      '</div>';
    });
  });

  list.innerHTML = html;
}

function filterNotifs(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.ntab').forEach(function(b){
    b.classList.remove('active');
  });
  if(btn) btn.classList.add('active');
  renderNotifs();
}

function searchNotifs(q) {
  currentSearch = q;
  renderNotifs();
}

function markOneRead(id) {
  var n = NOTIFS.find(function(x){ return x.id === id; });
  if(n) n.unread = false;
  var el = document.getElementById('notif-' + id);
  if(el) {
    el.classList.remove('unread');
    var dot = el.querySelector('.notif-dot');
    if(dot) dot.remove();
  }
}

function markAllRead() {
  NOTIFS.forEach(function(n){ n.unread = false; });
  renderNotifs();
  showToast('All notifications marked as read', 'success');
}

function acceptInvite(id, btn) {
  btn.textContent = 'Joined!';
  btn.style.background = '#16a34a';
  var decline = btn.nextElementSibling;
  if(decline) decline.style.display = 'none';
  showToast('Joined the group!', 'success');
}

function declineInvite(id, btn) {
  var parent = btn.closest('.notif-item');
  if(parent) parent.style.opacity = '0.4';
  showToast('Invitation declined', 'info');
}

function followBack(id, btn) {
  btn.textContent = 'Following';
  btn.style.background = '#16a34a';
  showToast('Now following!', 'success');
}

// Init
renderNotifs();
</script>
