<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawBook — Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="mobile.css">
<style>
.notif-page{max-width:680px;margin:72px auto 80px;padding:0 16px}
.notif-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.notif-title{font-size:22px;font-weight:900}
.mark-all{font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;background:none;border:none;font-family:'Poppins',sans-serif}
.notif-group-label{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:8px 0 4px;margin-top:8px}
.notif-item{display:flex;gap:12px;padding:12px 16px;background:#fff;border-radius:12px;margin-bottom:6px;cursor:pointer;transition:background 0.15s;border:1px solid var(--border);align-items:flex-start;position:relative}
.notif-item:hover{background:#f8f9ff}
.notif-item.unread{background:#eff6ff;border-color:#dbeafe}
.notif-item.unread::before{content:'';position:absolute;left:6px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:var(--blue)}
.notif-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.notif-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;position:relative}
.notif-av img{width:100%;height:100%;object-fit:cover}
.notif-av-badge{position:absolute;bottom:-2px;right:-2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;border:2px solid #fff}
.notif-content{flex:1;min-width:0}
.notif-text{font-size:14px;color:var(--text);line-height:1.5}
.notif-text strong{font-weight:700}
.notif-time{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.notif-action{margin-top:8px;display:flex;gap:8px}
.notif-btn{height:30px;padding:0 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;border:none}
.notif-btn-blue{background:var(--blue);color:#fff}
.notif-btn-gray{background:#f0f2f5;color:var(--text)}
.notif-thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;flex-shrink:0}
.notif-thumb img{width:100%;height:100%;object-fit:cover}
.notif-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.notif-tabs::-webkit-scrollbar{display:none}
.ntab{flex-shrink:0;height:34px;padding:0 16px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif;color:var(--muted);transition:all 0.15s}
.ntab.active{background:var(--blue);border-color:var(--blue);color:#fff}
</style>
</head>
<body>
<script>function goTo(p){window.location.href=p;}</script>

<nav class="topnav">
  <a class="topnav-logo" href="07_home.html"><div class="logo-icon">🐾</div> PawBook</a>
  <div class="topnav-search"><i class="ti ti-search"></i><input placeholder="Search notifications…"></div>
  <div class="topnav-tabs">
    <button class="topnav-tab" onclick="goTo('07_home.html')"><i class="ti ti-home"></i></button>
    <button class="topnav-tab" onclick="goTo('03_groups.html')"><i class="ti ti-users"></i></button>
    <button class="topnav-tab" onclick="goTo('13_messages.html')"><i class="ti ti-message-circle"></i></button>
    <button class="topnav-tab" onclick="goTo('09_marketplace.html')"><i class="ti ti-building-store"></i></button>
    <button class="topnav-tab active"><i class="ti ti-bell"></i></button>
  </div>
  <div class="topnav-right">
    <button class="nav-icon-btn"><i class="ti ti-bell"></i></button>
    <div class="nav-avatar" id="nav-av" onclick="goTo('08_pet_profile.html')">A</div>
  </div>
</nav>

<div class="notif-page">
  <div class="notif-header">
    <div class="notif-title">Notifications</div>
    <button class="mark-all" onclick="markAllRead()">Mark all as read</button>
  </div>
  <div class="notif-tabs">
    <button class="ntab active" onclick="filterNotif('all',this)">All</button>
    <button class="ntab" onclick="filterNotif('reaction',this)">Reactions</button>
    <button class="ntab" onclick="filterNotif('comment',this)">Comments</button>
    <button class="ntab" onclick="filterNotif('follow',this)">Followers</button>
    <button class="ntab" onclick="filterNotif('vet',this)">Vet &amp; Health</button>
    <button class="ntab" onclick="filterNotif('order',this)">Orders</button>
  </div>
  <div id="notif-container"></div>
</div>

<script src="api.js"></script>
<script>
// Set user avatar initial
const user = typeof Auth !== 'undefined' ? Auth.getUser() : null;
const navAv = document.getElementById('nav-av');
if (navAv && user) navAv.textContent = (user.full_name || user.username || 'A')[0].toUpperCase();

// Notification data
const NOTIFS = [
  { id:1, type:'reaction', unread:true,
    av:'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=80&q=80',
    badge:'❤️', badgeBg:'#ef4444',
    text:'<strong>Dr. Priya Sharma</strong> and <strong>3 others</strong> reacted to your post about Bruno\'s walk',
    time:'2 minutes ago',
    action:{label:'View Post', page:'07_home.html'},
    thumb:'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=100&q=80' },

  { id:2, type:'comment', unread:true,
    av:'https://images.unsplash.com/photo-1598133894008-61f7fdb8cc3a?w=80&q=80',
    badge:'💬', badgeBg:'#1a4db3',
    text:'<strong>Rahul Dev</strong> commented: "Bruno looks so happy! 🐾"',
    time:'15 minutes ago',
    action:{label:'Reply', page:'07_home.html'} },

  { id:3, type:'follow', unread:true,
    av:'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=80&q=80',
    badge:'👤', badgeBg:'#10b981',
    text:'<strong>Ananya Bose</strong> started following you',
    time:'1 hour ago',
    action:{label:'Follow Back', page:'29_user_profile.html'} },

  { id:4, type:'vet', unread:true,
    icon:'🩺', iconBg:'#fef3c7',
    text:'<strong>Vaccination Reminder:</strong> Bruno\'s Leptospirosis booster is due in <strong>7 days</strong>',
    time:'2 hours ago',
    action:{label:'Book Appointment', page:'11_vet_booking.html'} },

  { id:5, type:'reaction', unread:false,
    av:'https://images.unsplash.com/photo-1622253692010-333f2da6031d?w=80&q=80',
    badge:'🐾', badgeBg:'#8b5cf6',
    text:'<strong>Priya M.</strong> reacted 🐾 to your photo of Luna at the park',
    time:'3 hours ago', action:null,
    thumb:'https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=100&q=80' },

  { id:6, type:'order', unread:false,
    icon:'🛒', iconBg:'#dcfce7',
    text:'<strong>Order #PB2024-001</strong> has been shipped! Royal Canin Dog Food is on its way',
    time:'5 hours ago',
    action:{label:'Track Order', page:'09_marketplace.html'} },

  { id:7, type:'follow', unread:false,
    av:'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=80&q=80',
    badge:'🏠', badgeBg:'#10b981',
    text:'<strong>Hopeful Tails Shelter</strong> accepted your adoption enquiry for Max',
    time:'Yesterday',
    action:{label:'View Details', page:'04_adoption.html'} },

  { id:8, type:'vet', unread:false,
    av:'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=80&q=80',
    badge:'📅', badgeBg:'#f59e0b',
    text:'<strong>Appointment Confirmed:</strong> Dr. Priya Sharma on May 20 at 4:00 PM',
    time:'Yesterday',
    action:{label:'View Appointment', page:'11_vet_booking.html'} },

  { id:9, type:'comment', unread:false,
    av:'https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?w=80&q=80',
    badge:'💬', badgeBg:'#1a4db3',
    text:'<strong>Dr. Arjun Mehta</strong> replied: "Yes, completely normal for Beagles!"',
    time:'2 days ago', action:null },

  { id:10, type:'reaction', unread:false,
    icon:'🎉', iconBg:'#fef3c7',
    text:'<strong>PawBook:</strong> Your post reached <strong>100 reactions!</strong> Share your milestone',
    time:'3 days ago',
    action:{label:'Share', page:'07_home.html'} },

  { id:11, type:'follow', unread:false,
    av:'https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=80&q=80',
    badge:'👤', badgeBg:'#10b981',
    text:'<strong>Sneha Kapoor</strong> and <strong>2 others</strong> started following you',
    time:'4 days ago', action:null },

  { id:12, type:'vet', unread:false,
    icon:'🎂', iconBg:'#fef3c7',
    text:'<strong>Bruno\'s birthday</strong> is in 5 days! Plan something special',
    time:'5 days ago',
    action:{label:'View Profile', page:'08_pet_profile.html'} },
];

let readSet = new Set();
let currentFilter = 'all';

function renderNotifs(filter) {
  const container = document.getElementById('notif-container');
  const list = filter === 'all' ? NOTIFS : NOTIFS.filter(n => n.type === filter);

  if (!list.length) {
    container.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#94a3b8"><div style="font-size:56px;margin-bottom:14px">🔔</div><div style="font-size:16px;font-weight:700;margin-bottom:6px">All caught up!</div><div style="font-size:13px">No notifications in this category</div></div>';
    return;
  }

  const newItems   = list.filter(n => n.unread && !readSet.has(n.id));
  const todayItems = list.filter(n => !n.unread && (n.time.includes('hour') || n.time.includes('minute')));
  const oldItems   = list.filter(n => !n.unread && !n.time.includes('hour') && !n.time.includes('minute'));

  let html = '';
  [['New', newItems], ['Today', todayItems], ['Earlier', oldItems]].forEach(([label, items]) => {
    if (!items.length) return;
    html += `<div class="notif-group-label">${label}</div>`;
    items.forEach(n => {
      const unread = n.unread && !readSet.has(n.id);
      html += `<div class="notif-item ${unread ? 'unread' : ''}" id="n${n.id}" onclick="markRead(${n.id})">`;

      // Avatar or icon
      if (n.av) {
        html += `<div class="notif-av"><img src="${n.av}"><div class="notif-av-badge" style="background:${n.badgeBg}">${n.badge}</div></div>`;
      } else {
        html += `<div class="notif-icon" style="background:${n.iconBg}">${n.icon}</div>`;
      }

      html += `<div class="notif-content">
        <div class="notif-text">${n.text}</div>
        <div class="notif-time">${n.time}</div>`;

      if (n.action) {
        html += `<div class="notif-action">
          <button class="notif-btn notif-btn-blue" onclick="event.stopPropagation();goTo('${n.action.page}')">${n.action.label}</button>
          <button class="notif-btn notif-btn-gray" onclick="event.stopPropagation();markRead(${n.id})">Dismiss</button>
        </div>`;
      }

      html += `</div>`;
      if (n.thumb) html += `<div class="notif-thumb"><img src="${n.thumb}"></div>`;
      html += `</div>`;
    });
  });

  container.innerHTML = html;
}

function markRead(id) {
  readSet.add(id);
  const el = document.getElementById('n' + id);
  if (el) el.classList.remove('unread');
}

function markAllRead() {
  NOTIFS.forEach(n => readSet.add(n.id));
  renderNotifs(currentFilter);
  toast('All notifications marked as read');
}

function filterNotif(type, btn) {
  document.querySelectorAll('.ntab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = type;
  renderNotifs(type);
}

function toast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#16a34a;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:9999;font-family:Poppins,sans-serif;white-space:nowrap';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// Render immediately
renderNotifs('all');

// Try real API in background
(async function() {
  try {
    if (!Auth.isLoggedIn()) return;
    const res = await UserAPI.notifications(1);
    const data = res?.data || [];
    if (!data.length) return;
    // Prepend real notifs
    data.slice(0, 5).reverse().forEach((n, i) => {
      NOTIFS.unshift({
        id: 'api' + i, type: n.type || 'reaction', unread: !n.is_read,
        icon: '🔔', iconBg: '#dbeafe',
        text: n.message || n.body || 'New notification',
        time: 'Just now', action: null
      });
    });
    renderNotifs(currentFilter);
  } catch {}
})();
</script>
</body>
</html>
