<!DOCTYPE html><html lang="en"><head>
<link rel="manifest" href="manifest.json"><meta charset="UTF-8"><title>PawBook – Order Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mobile.css">
</head><body>
<nav class="topnav"><a class="topnav-logo" href="07_home.html"><div class="logo-icon">🐾</div> PawBook</a>
<div class="topnav-search"><i class="ti ti-search"></i><input placeholder="Search…"></div>
<div class="topnav-tabs">
  <button class="topnav-tab" onclick="goTo('07_home.html')"><i class="ti ti-home"></i></button>
  <button class="topnav-tab" onclick="goTo('09_marketplace.html')"><i class="ti ti-building-store"></i></button>
  <button class="topnav-tab active"><i class="ti ti-shopping-cart"></i></button>
  <button class="topnav-tab" onclick="goTo('11_vet_booking.html')"><i class="ti ti-stethoscope"></i></button>
  <button class="topnav-tab" onclick="goTo('12_notifications.html')"><i class="ti ti-bell"></i></button>
</div>
<div class="topnav-right"><div class="nav-avatar" onclick="goTo('08_pet_profile.html')">A</div></div></nav>

<div id="page-wrap" style="max-width:640px;margin:40px auto;padding:0 16px;text-align:center">
  <div id="loading-state" style="padding:60px 0">
    <div style="font-size:40px;margin-bottom:12px">🐾</div>
    <div style="color:var(--muted)">Loading your order…</div>
  </div>
  <div id="error-state" style="display:none;padding:60px 0">
    <div style="font-size:40px;margin-bottom:12px">😿</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:8px">Order not found</div>
    <div style="color:var(--muted);margin-bottom:24px">We couldn't load your order details.</div>
    <button class="btn btn-blue" onclick="goTo('09_marketplace.html')">Back to Shop</button>
  </div>
  <div id="success-state" style="display:none">
    <div style="width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#059669,#0d9488);margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 8px 32px rgba(5,150,105,0.3)">✅</div>
    <div style="font-size:32px;font-weight:900;margin-bottom:8px;color:#1a1a2e">Order Confirmed! 🎉</div>
    <div style="font-size:16px;color:var(--muted);margin-bottom:32px">Thank you <strong id="user-name">there</strong>! Your order has been placed successfully.</div>
    <div style="background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow-md);border:1px solid var(--border);margin-bottom:20px;text-align:left">
      <div style="display:flex;justify-content:space-between;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)">
        <div><div style="font-size:13px;color:var(--muted)">Order Number</div><div id="order-number" style="font-size:16px;font-weight:800">#—</div></div>
        <div style="text-align:right"><div style="font-size:13px;color:var(--muted)">Estimated Delivery</div><div id="delivery-date" style="font-size:16px;font-weight:800;color:#059669">—</div></div>
      </div>
      <div id="items-container"></div>
      <div style="border-top:1px solid var(--border);margin-top:12px;padding-top:12px">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px"><span>Subtotal</span><span id="subtotal">—</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px"><span>Delivery</span><span id="delivery-fee">—</span></div>
        <div id="discount-row" style="display:none;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px"><span>Discount</span><span id="discount-amt" style="color:#0d9488">—</span></div>
        <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:900"><span>Total Paid</span><span id="total-paid" style="color:var(--blue)">—</span></div>
      </div>
    </div>
    <div style="background:#fff;border-radius:16px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:24px;text-align:left">
      <div style="font-size:15px;font-weight:800;margin-bottom:16px">📦 Delivery Tracking</div>
      <div id="tracker-steps"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="btn btn-blue" style="padding:14px 28px;font-size:15px" onclick="goTo('09_marketplace.html')">Continue Shopping</button>
      <button class="btn btn-gray" style="padding:14px 28px;font-size:15px" onclick="goTo('07_home.html')">Go Home</button>
    </div>
  </div>
</div>

<script src="api.js"></script>
<script>
function goTo(p){ window.location.href=p; }
function fmtPrice(n){ return '₹'+(Number(n)||0).toLocaleString('en-IN'); }
function addDays(dateStr,n){
  var d=dateStr?new Date(dateStr):new Date();
  d.setDate(d.getDate()+n);
  return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDate(s){
  if(!s) return '—';
  return new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function getOrderId(){
  var p=new URLSearchParams(window.location.search);
  return p.get('order_id')||p.get('orderId')||p.get('id');
}
function authHeaders(){
  var t=localStorage.getItem('pb_token')||'';
  return {'Authorization':'Bearer '+t,'Content-Type':'application/json'};
}
function renderTracker(status,createdAt){
  var steps=[
    {label:'Order Confirmed'},
    {label:'Processing & Packing'},
    {label:'Out for Delivery'},
    {label:'Delivered 🎉'}
  ];
  var so={confirmed:0,processing:1,packed:1,shipped:2,out_for_delivery:2,delivered:3};
  var cur=so[status]!==undefined?so[status]:0;
  var html=steps.map(function(s,i){
    var done=i<=cur;
    var col=done?'#059669':'var(--muted)';
    var dot=done?'#059669':'#e4e6eb';
    var isLast=i===steps.length-1;
    var lbl='';
    if(i===0&&createdAt) lbl=fmtDate(createdAt);
    else if(i===1&&done) lbl='In progress';
    else if(i===1) lbl='Expected: '+addDays(createdAt,1);
    else if(i===2&&done) lbl='On the way';
    else if(i===2) lbl='Expected: '+addDays(createdAt,3)+' – '+addDays(createdAt,4);
    else if(i===3&&done) lbl='Delivered!';
    else lbl='Expected: '+addDays(createdAt,5);
    return '<div style="display:flex;gap:14px;align-items:flex-start">'+
      '<div style="display:flex;flex-direction:column;align-items:center">'+
        '<div style="width:14px;height:14px;border-radius:50%;background:'+dot+';flex-shrink:0"></div>'+
        (isLast?'':'<div style="width:2px;flex:1;background:#e4e6eb;min-height:30px"></div>')+
      '</div>'+
      '<div style="padding-bottom:'+(isLast?'0':'20')+'px">'+
        '<div style="font-weight:700;font-size:13px;color:'+col+'">'+(done&&i<3?'✓ ':'')+s.label+'</div>'+
        '<div style="font-size:12px;color:var(--muted)">'+lbl+'</div>'+
      '</div></div>';
  }).join('');
  document.getElementById('tracker-steps').innerHTML=html;
}
function renderOrder(order){
  var user=JSON.parse(localStorage.getItem('pb_user')||'{}');
  document.getElementById('user-name').textContent=(user.name||user.display_name||'there').split(' ')[0];
  document.getElementById('order-number').textContent='#'+(order.order_number||order.id||'—');
  var dd=order.estimated_delivery||addDays(order.created_at,5);
  document.getElementById('delivery-date').textContent=
    (typeof dd==='string'&&dd.match(/^\d{4}-/))?new Date(dd).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):dd;
  var items=order.items||order.order_items||[];
  document.getElementById('items-container').innerHTML=items.length?items.map(function(it,i){
    var img=(it.product&&it.product.images&&it.product.images[0])||it.image_url||it.image||
      'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=80&q=80';
    var name=(it.product&&it.product.name)||it.name||it.product_name||'Pet Product';
    var qty=it.quantity||1;
    var variant=(it.product&&it.product.unit)||it.variant||it.size||'';
    var price=it.price||it.unit_price||(it.product&&it.product.price)||0;
    var isLast=i===items.length-1;
    return '<div style="display:flex;gap:12px;padding:12px 0;'+(isLast?'':'border-bottom:1px solid var(--border);')+'align-items:center">'+
      '<img src="'+img+'" onerror="this.src=\'https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=80&q=80\'" style="width:60px;height:60px;border-radius:10px;object-fit:cover">'+
      '<div style="flex:1"><div style="font-weight:700">'+name+'</div><div style="font-size:12px;color:var(--muted)">'+(variant?variant+' · ':'')+'Qty: '+qty+'</div></div>'+
      '<div style="font-weight:800">'+fmtPrice(price*qty)+'</div></div>';
  }).join(''):'<div style="color:var(--muted);padding:12px 0">Order details will be emailed to you.</div>';
  var sub=order.subtotal||order.items_total||0;
  var del=order.delivery_fee||order.shipping_fee||0;
  var disc=order.discount||order.discount_amount||0;
  var tot=order.total||order.total_amount||order.amount||0;
  document.getElementById('subtotal').textContent=fmtPrice(sub);
  var dfEl=document.getElementById('delivery-fee');
  dfEl.textContent=del>0?fmtPrice(del):'FREE';
  if(del===0) dfEl.style.color='#059669';
  if(disc>0){
    document.getElementById('discount-row').style.display='flex';
    document.getElementById('discount-amt').textContent='-'+fmtPrice(disc);
  }
  document.getElementById('total-paid').textContent=fmtPrice(tot);
  renderTracker(order.status||'confirmed',order.created_at);
  document.getElementById('loading-state').style.display='none';
  document.getElementById('success-state').style.display='block';
}
function loadOrder(){
  var orderId=getOrderId();
  if(!orderId){
    var last=localStorage.getItem('pb_last_order');
    if(last){ try{ renderOrder(JSON.parse(last)); return; }catch(e){} }
    document.getElementById('loading-state').style.display='none';
    document.getElementById('error-state').style.display='block';
    return;
  }
  fetch(API_BASE+'/marketplace/orders/'+orderId,{headers:authHeaders()})
    .then(function(r){ return r.json(); })
    .then(function(res){
      var o=res.data||res.order||res;
      if(!o||!o.id){
        document.getElementById('loading-state').style.display='none';
        document.getElementById('error-state').style.display='block';
        return;
      }
      renderOrder(o);
    })
    .catch(function(err){
      console.warn('[OrderConfirm] fetch failed:',err);
      document.getElementById('loading-state').style.display='none';
      document.getElementById('success-state').style.display='block';
      var user=JSON.parse(localStorage.getItem('pb_user')||'{}');
      document.getElementById('user-name').textContent=(user.name||'there').split(' ')[0];
      document.getElementById('order-number').textContent='#'+orderId;
      document.getElementById('delivery-date').textContent=addDays(null,5)+' – '+addDays(null,7);
      document.getElementById('items-container').innerHTML='<div style="color:var(--muted);padding:12px 0">Order details will be emailed to you.</div>';
      ['subtotal','delivery-fee','total-paid'].forEach(function(id){ document.getElementById(id).textContent='—'; });
      renderTracker('confirmed',new Date().toISOString());
    });
}
document.addEventListener('DOMContentLoaded',loadOrder);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js')
      .then(function(r){console.log('[SW] Registered:',r.scope);})
      .catch(function(e){console.warn('[SW] Registration failed:',e);});
  });
}
</script>
</body></html>
