<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<meta name="robots" content="noindex">
<title>Communities – PawBook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* PawBook design system (same tokens as the Animal Welfare page) */
  --blue:#1877F2;--blue-d:#1a56db;--navy:#0f2057;--purple:#8b5cf6;
  --coral:#e5484d;--coral-d:#c2353a;--coral-soft:#fff1f1;
  --green:#16a34a;--amber:#f59e0b;
  --bg:#f0f4fa;--card:#fff;--line:#e4e9f2;--line2:#eef2f8;--text:#1a1f36;--muted:#65676b;--sub:#3d4560;
  --r:18px;--r-sm:12px;--pill:999px;--shadow:0 6px 24px rgba(15,32,87,.08);--nav-h:60px;
  /* soft category tints */
  --t-blue:#e8f1ff;--t-blue-d:#1a56db;--t-coral:#fff1f1;--t-coral-d:#c2353a;--t-green:#e7f7ee;--t-green-d:#15803d;
  --t-amber:#fff6e0;--t-amber-d:#b45309;--t-purple:#f1ecff;--t-purple-d:#6d4fd8;--t-teal:#e3f7f5;--t-teal-d:#0f766e;
  --grad:linear-gradient(135deg,#e5484d,#f97316);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid rgba(24,119,242,.35);outline-offset:2px}

/* ── top bar (matches the Animal Welfare page) ── */
.nav{position:sticky;top:0;z-index:400;height:var(--nav-h);background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;padding:0 16px}
.nav .menu{width:38px;height:38px;border-radius:50%;border:none;background:transparent;font-size:21px;display:flex;align-items:center;justify-content:center;color:#1a3a6b}
.nav .menu:hover{background:#f0f2f5}
.logo{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:21px;font-weight:900;cursor:pointer}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:19px;font-style:normal}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.crumb b{color:var(--coral)}
.nav .sp{flex:1}
.nav-ic{width:38px;height:38px;border-radius:50%;border:none;background:#f0f2f5;color:#1a3a6b;font-size:19px;display:flex;align-items:center;justify-content:center}
.nav-ic:hover{background:#e4ebf7;color:var(--blue)}
.nav-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:none}
.nav-av img{width:100%;height:100%;object-fit:cover}
@media(max-width:640px){.crumb,.nav .hide-s{display:none}.logo{font-size:19px}}

/* ── layout ── */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 120px}
.hero-band{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,#e5edff 0%,transparent 60%),linear-gradient(180deg,#f7f9ff 0%,#eef3fb 100%);margin:0 -24px;padding:0 24px}
.hero-band::before{content:'';position:absolute;inset:0;opacity:.5;background-image:radial-gradient(circle at 20px 20px,rgba(24,119,242,.07) 3px,transparent 4px);background-size:44px 44px;pointer-events:none}
.pets{position:relative;display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none;max-width:1240px;margin:0 auto}.pets::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:700;font-size:13.5px;color:var(--navy);flex-shrink:0;box-shadow:0 2px 8px rgba(24,119,242,.06)}
.pchip.on{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.12)}
.pchip .av{width:32px;height:32px}
.pchip.add{padding:5px 15px;color:var(--blue-d);border-style:dashed;background:rgba(255,255,255,.7)}
.av{border-radius:50%;background:var(--t-blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px;padding:18px 22px 6px;flex-wrap:wrap}
.ch h2{font-size:17px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.ch h2 i{width:32px;height:32px;border-radius:10px;background:var(--t-blue);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.ch .badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:var(--pill);background:var(--coral-soft);color:var(--coral-d)}
.cb{padding:8px 22px 22px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.sec{margin-top:18px}
.sec-title{font-size:22px;font-weight:900;color:var(--navy);margin:34px 0 4px}
.sec-sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}

/* ── pet hero ── */
.hero{position:relative;max-width:1240px;margin:0 auto;padding:22px 0 64px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #dbe4f3;color:var(--blue-d);font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(24,119,242,.08)}
.eyebrow i{color:var(--coral);font-size:16px}
.hero h1{font-size:48px;line-height:1.08;font-weight:900;color:var(--navy);margin:14px 0 10px;letter-spacing:-1px}
.hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-size:16px;line-height:1.6;color:var(--sub);max-width:520px}
.facts{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}
.fact{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sub)}
.fact i{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:var(--pill)}
.st-great{background:var(--t-green);color:var(--t-green-d)}.st-ok{background:var(--t-blue);color:var(--t-blue-d)}.st-care{background:var(--t-amber);color:var(--t-amber-d)}.st-new{background:var(--t-purple);color:var(--t-purple-d)}
.collage{position:relative;display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:420px}
.collage.one{grid-template-columns:1fr}.collage.one .ph{grid-row:1/3}
.collage.two{grid-template-columns:1.35fr 1fr}.collage.two .ph{grid-row:1/3}
.ph-sample{position:absolute;left:12px;top:12px;z-index:3;padding:4px 10px;border-radius:999px;background:rgba(15,32,87,.6);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;backdrop-filter:blur(4px)}
.px-credit{position:absolute;right:4px;bottom:-22px;font-size:10.5px;color:var(--muted)}.px-credit a{color:inherit}
.ph{position:relative;border-radius:22px;overflow:hidden;background:#dfe7f5;box-shadow:0 14px 34px rgba(15,32,87,.16)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ph:hover img{transform:scale(1.04)}
.ph-main{grid-row:1/3}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.ph-tag{position:absolute;left:12px;bottom:12px;z-index:2;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.ph-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#e8f1ff,#f1ecff);color:var(--navy);font-weight:700;font-size:13px;text-align:center;padding:16px}
.ph-empty .e{font-size:76px;line-height:1}
.ph-empty::after{display:none}
.ph .cam{position:absolute;right:12px;top:12px;z-index:3;height:34px;padding:0 12px;border-radius:999px;border:none;background:rgba(255,255,255,.95);font-size:12.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.float-card{position:absolute;z-index:3;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,32,87,.2);padding:12px 14px;display:flex;align-items:center;gap:10px}
.float-1{left:-22px;bottom:30px;max-width:260px}
.float-2{right:-10px;top:-14px;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;color:var(--navy);gap:6px}
.float-2 i{color:var(--coral)}
.fc-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.fc-t{font-size:13px;font-weight:800;color:var(--navy);line-height:1.3}
.fc-s{font-size:11.5px;color:var(--muted)}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:24px;padding-bottom:56px}.collage{height:300px}.float-1{left:10px;bottom:-18px}.float-2{right:8px}.hero h1{font-size:36px}}
@media(max-width:520px){.collage{height:250px;grid-template-columns:1fr}.collage .ph:not(.ph-main){display:none}.hero h1{font-size:31px}}

/* stats strip overlapping the hero (like the emergency strip) */
.stats{position:relative;z-index:5;margin-top:-34px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--navy);line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px}.stat .ic{width:38px;height:38px;font-size:19px}.stat b{font-size:19px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:700;border:none;white-space:nowrap;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn-o{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(229,72,77,.3)}.btn-o:hover{filter:brightness(1.05);box-shadow:0 10px 24px rgba(229,72,77,.38)}
.btn-w{background:#fff;color:var(--navy);border:1.5px solid #dbe4f3}.btn-w:hover{border-color:var(--blue);color:var(--blue)}
.btn-b{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 8px 20px rgba(24,119,242,.26)}
.btn-s{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn-link{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;padding:0}
.btn[disabled]{opacity:.55;pointer-events:none}

/* wellness */
.well{display:flex;gap:20px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:900;color:var(--navy);line-height:1}
.ring .num span{font-size:11px;color:var(--muted);font-weight:600}
.well h3{font-size:18px;font-weight:800;color:var(--navy)}
.well p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.inds{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.ind{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.ind .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.ind .t{font-size:13.5px;font-weight:700;color:var(--navy)}.ind .t small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ind .bar{grid-column:2/4;height:6px;border-radius:9px;background:#edf1f8;overflow:hidden;margin-top:-4px}
.ind .bar i{display:block;height:100%;border-radius:9px}
.ind .pts{font-size:12px;font-weight:700;color:var(--muted)}
.disc{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.55;background:#f5f7fb;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;display:flex;gap:8px}
.disc i{color:var(--blue);font-size:15px;margin-top:1px}

/* reminders */
.rems{display:flex;flex-direction:column;gap:10px}
.rem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe}
.rem .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rem .t{flex:1;min-width:0}.rem .t b{display:block;font-size:14px;font-weight:700;color:var(--navy)}.rem .t span{font-size:12.5px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--pill);white-space:nowrap}
.p-over{background:var(--coral-soft);color:var(--coral-d)}.p-soon{background:var(--t-amber);color:var(--t-amber-d)}.p-ok{background:var(--t-green);color:var(--t-green-d)}.p-info{background:var(--t-blue);color:var(--t-blue-d)}
.c-peach{background:var(--t-coral);color:var(--t-coral-d)}.c-sage{background:var(--t-green);color:var(--t-green-d)}.c-lav{background:var(--t-purple);color:var(--t-purple-d)}.c-sky{background:var(--t-blue);color:var(--t-blue-d)}.c-coral{background:var(--t-coral);color:var(--t-coral-d)}.c-amber{background:var(--t-amber);color:var(--t-amber-d)}.c-teal{background:var(--t-teal);color:var(--t-teal-d)}

/* quick actions: white cards with tinted icon tiles (like "How PawBook helps") */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.qa{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.qa{grid-template-columns:repeat(2,1fr);gap:10px}}
.qa button{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;font-weight:700;font-size:13.5px;line-height:1.3;color:var(--navy);transition:transform .12s,box-shadow .12s,border-color .12s}
.qa button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,32,87,.12);border-color:#cfdaf0}
.qa button i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}

/* tabs (segmented bar) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:7px;background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);scrollbar-width:none;margin:30px 0 16px;position:sticky;top:calc(var(--nav-h) + 8px);z-index:50}
.tabs::-webkit-scrollbar{display:none}
.tab{height:42px;padding:0 15px;border-radius:11px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0}
.tab i{font-size:18px}
.tab:hover{color:var(--navy);background:#f5f7fb}.tab.on{background:var(--t-blue);color:var(--blue)}
.tab.rec{margin-left:auto}.tab.rec.on{background:var(--t-purple);color:var(--t-purple-d)}
.panel{display:none}.panel.on{display:block}

/* timeline */
.month{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:20px 2px 10px;display:flex;align-items:center;gap:10px}
.month::after{content:'';flex:1;height:1px;background:var(--line)}
.month:first-child{margin-top:4px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ev{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;border:1px solid var(--line);border-top:4px solid var(--evc,#e4e9f2);box-shadow:0 2px 10px rgba(15,32,87,.04)}
.ev .top{display:flex;gap:10px;align-items:center}
.ev .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ev b{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3}
.ev .d{font-size:12px;color:var(--muted)}
.ev .who{font-size:12.5px;font-weight:600;color:var(--sub);display:flex;gap:5px;align-items:center}
.ev p{font-size:13px;line-height:1.55;color:var(--sub)}
.ev img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:4px}
.ev .del{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;background:#f5f7fb;font-size:14px;color:var(--muted);opacity:0;transition:opacity .15s}
.ev:hover .del,.ev:focus-within .del{opacity:1}
@media(hover:none){.ev .del{opacity:.8}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fchip{height:32px;padding:0 13px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:600;font-size:12.5px;color:var(--muted)}
.fchip.on{border-color:var(--blue);color:var(--blue);background:var(--t-blue)}

/* lists */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap}
.row .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.row .t{flex:1;min-width:160px}.row .t b{display:block;font-size:14px;font-weight:700;color:var(--navy)}.row .t span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--navy);font-size:16px;font-weight:800;margin-bottom:4px}
.empty p{font-size:13.5px;max-width:420px;margin:0 auto 14px;line-height:1.55}

/* daily wellness */
.dw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.dw{grid-template-columns:repeat(2,1fr)}}
.dws{border-radius:16px;padding:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.dws i{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:6px}
.dws b{font-size:21px;font-weight:900;color:var(--navy);line-height:1.1}.dws span{font-size:12.5px;font-weight:600;color:var(--sub)}
.dws small{font-size:11.5px;color:var(--muted)}
button.dws:hover{border-color:#cfdaf0;box-shadow:var(--shadow)}
.week{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:14px;padding:0 2px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk .b{width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:#cfe0fb;min-height:4px}
.wk.today .b{background:linear-gradient(180deg,var(--blue),var(--purple))}
.wk span{font-size:11.5px;font-weight:600;color:var(--muted)}.wk em{font-style:normal;font-size:11px;font-weight:700;color:var(--navy)}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

    + '<div style="display:flex;gap:8px"><button class="btn btn-g btn-s" onclick="decide(\'' + r.id + '\',\'approve\')"><i class="ti ti-check"></i>Approve</button><button class="btn btn-w btn-s" onclick="decide(\'' + r.id + '\',\'reject\')"><i class="ti ti-x"></i>Decline</button></div></div>'; }).join('') + '</div>';
}
function decide(rid, a){ api('/communities/' + CUR.id + '/requests/' + rid, {method: 'POST', body: {action: a}}).then(function(){ toast(a === 'approve' ? 'Approved — they were notified' : 'Declined'); if (CUR.requests) CUR.requests--; if (a === 'approve') CUR.members++; renderCommunity(); setCTab('requests'); }).catch(fail); }

/* ---------- report ---------- */
function reportForm(postId){
  openMo(postId ? 'Report this post' : 'Report this community', '<div class="fl" data-f="reason"><span>What is wrong? *</span><div class="cks">' + [['spam', 'Spam or advertising'], ['scam', 'Scam or asking for money'], ['selling', 'Selling or buying animals'], ['abuse', 'Abusive or hateful'], ['cruelty', 'Animal cruelty'], ['fake', 'Fake or misleading'], ['other', 'Something else']].map(function(r){ return '<label><input type="radio" name="reason" value="' + r[0] + '"><span>' + r[1] + '</span></label>'; }).join('') + '</div><div class="err">Choose a reason</div></div>'
    + '<label class="fl"><span>More details (optional)</span><textarea class="fi" name="details" maxlength="500"></textarea></label><div class="guide">If an animal is being hurt, please also report it on the <a href="36_abuse_reporting.html" style="color:var(--blue);font-weight:700">Animal Welfare</a> page.</div>', function(f){
    clearBad(f); var r = (f.querySelector('input[name=reason]:checked') || {}).value; if (!r) return markBad(f, ['reason']);
    busy(true); api('/communities/report', {method: 'POST', body: {group_id: CUR.id, post_id: postId || undefined, reason: r, details: f.details.value.trim()}}).then(function(){ closeMo(); toast('Thank you — our team will review it'); }).catch(function(e){ busy(false); if (e.status === 409) { closeMo(); return toast(e.message); } fail(e); });
  }, 'Send report');
}
/* ---------- PawBook admin ---------- */
function showAdmin(){
  api('/communities/admin/queue').then(function(d){
    openMo('Community moderation', '<b style="color:var(--navy)">Reports</b>' + (d.reports.length ? d.reports.map(function(r){ return '<div class="req"><b>' + esc(r.group.name) + (r.post ? ' · post' : '') + '</b><span class="muted" style="font-size:12px">' + r.count + ' report' + (r.count > 1 ? 's' : '') + ': ' + esc(r.reasons.join(', ')) + '</span>' + (r.post ? '<em style="font-size:13px">' + esc(String(r.post.body || '').slice(0, 200)) + '</em>' : '') + (r.details.length ? '<span class="muted" style="font-size:12px">“' + esc(r.details.join('” · “')) + '”</span>' : '')
      + '<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-w btn-s" onclick="admAct(\'' + (r.post ? 'post' : 'group') + '\',\'' + (r.post ? r.post.id : r.group.id) + '\',\'hide\')">Hide</button><button type="button" class="btn btn-w btn-s" onclick="admAct(\'' + (r.post ? 'post' : 'group') + '\',\'' + (r.post ? r.post.id : r.group.id) + '\',\'restore\')">Restore</button><button type="button" class="btn btn-w btn-s" onclick="admAct(\'' + (r.post ? 'post' : 'group') + '\',\'' + (r.post ? r.post.id : r.group.id) + '\',\'dismiss\')">Dismiss</button><button type="button" class="btn-link" onclick="openCommunity(\'' + r.group.id + '\')">Open</button></div></div>'; }).join('') : '<p class="muted">No open reports.</p>')
      + '<b style="color:var(--navy);margin-top:10px">Not yet verified</b>' + (d.unverified.length ? d.unverified.map(function(g){ return '<div class="mbr"><div class="t"><b>' + esc(g.name) + '</b><span>' + esc(g.city || '') + ' · ' + g.members + ' members</span></div><button type="button" class="btn btn-g btn-s" onclick="admAct(\'group\',\'' + g.id + '\',\'verify\')">Verify</button></div>'; }).join('') : '<p class="muted">All communities reviewed.</p>'), null);
  }).catch(fail);
}
function admAct(kind, id, a){ api('/communities/admin/' + kind + '/' + id, {method: 'POST', body: {action: a}}).then(function(){ toast('Done'); showAdmin(); }).catch(fail); }

/* ---------- photos + modal helpers ---------- */
function renderPH(){ var el = document.getElementById('pvw'); if (el) el.innerHTML = PH.map(function(u, i){ return '<div><img src="' + esc(u) + '" alt=""><button type="button" onclick="PH.splice(' + i + ',1);renderPH()" aria-label="Remove">✕</button></div>'; }).join(''); }
function pickPhotos(max){
  var inp = document.getElementById('photo-in'); inp.value = ''; inp.multiple = max > 1;
  inp.onchange = function(){ var files = [].slice.call(inp.files || [], 0, Math.max(0, max - PH.length)); if (max === 1) { PH = []; files = files.slice(0, 1); } if (!files.length) return; toast('Uploading…');
    files.reduce(function(pr, file){ return pr.then(function(){ if (file.size > 10 * 1024 * 1024) { toast('Photo is larger than 10 MB'); return; } var fd2 = new FormData(); fd2.append('file', file); return api('/media/upload', {method: 'POST', body: fd2}).then(function(d){ var u = d.url || d.secure_url || (d.media && d.media.url) || (d.file && d.file.url); if (/^https:\/\//.test(u || '')) { PH.push(u); renderPH(); } }); }); }, Promise.resolve()).catch(fail); };
  inp.click();
}
function openMo(title, body, onSubmit, saveLabel){
  MO = {submit: onSubmit}; document.getElementById('mo-title').textContent = title; document.getElementById('mo-body').innerHTML = body;
  var s = document.getElementById('mo-save'); s.style.display = onSubmit ? '' : 'none'; s.querySelector('span').textContent = saveLabel || 'Save'; s.disabled = false;
  document.getElementById('mo').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeMo(){ var m = document.getElementById('mo'); if (m) m.classList.remove('open'); document.body.style.overflow = ''; MO = null; }
function submitMo(e){ e.preventDefault(); if (MO && MO.submit) MO.submit(e.target); }
function busy(on){ var b = document.getElementById('mo-save'); if (b) b.disabled = !!on; }
function markBad(f, l){ l.forEach(function(k){ var el = f.querySelector('[data-f="' + k + '"]'); if (el) el.classList.add('bad'); }); }
function clearBad(f){ f.querySelectorAll('.fl.bad').forEach(function(x){ x.classList.remove('bad'); }); }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeMo(); document.getElementById('lb').classList.remove('open'); } });
document.addEventListener('DOMContentLoaded', boot);
</script>

          }).catch(()=>{});
      }catch(e){}
    })();
