<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#269B70">
<meta name="robots" content="noindex">
<title>VetCare – PawBook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* PawBook design system (same tokens as the Animal Welfare page) */
  --blue:#1877F2;--blue-d:#1a56db;--navy:#0f2057;--purple:#8b5cf6;
  --coral:#e5484d;--coral-d:#c2353a;--coral-soft:#fff1f1;
  --green:#16a34a;--amber:#f59e0b;
  --bg:#f0f4fa;--card:#fff;--line:#e4e9f2;--line2:#eef2f8;--text:#1a1f36;--muted:#65676b;--sub:#3d4560;
  --r:18px;--r-sm:12px;--pill:999px;--shadow:0 6px 24px rgba(15,32,87,.08);--nav-h:60px;
  /* soft category tints */
  --t-blue:#e8f1ff;--t-blue-d:#1a56db;--t-coral:#fff1f1;--t-coral-d:#c2353a;--t-green:#e7f7ee;--t-green-d:#15803d;
  --t-amber:#fff6e0;--t-amber-d:#b45309;--t-purple:#f1ecff;--t-purple-d:#6d4fd8;--t-teal:#e3f7f5;--t-teal-d:#0f766e;
  --grad:linear-gradient(135deg,#e5484d,#f97316);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid rgba(24,119,242,.35);outline-offset:2px}

/* ── top bar (matches the Animal Welfare page) ── */
.nav{position:sticky;top:0;z-index:400;height:var(--nav-h);background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;padding:0 16px}
.nav .menu{width:38px;height:38px;border-radius:50%;border:none;background:transparent;font-size:21px;display:flex;align-items:center;justify-content:center;color:#1a3a6b}
.nav .menu:hover{background:#f0f2f5}
.logo{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:21px;font-weight:900;cursor:pointer}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:19px;font-style:normal}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.crumb b{color:var(--coral)}
.nav .sp{flex:1}
.nav-ic{width:38px;height:38px;border-radius:50%;border:none;background:#f0f2f5;color:#1a3a6b;font-size:19px;display:flex;align-items:center;justify-content:center}
.nav-ic:hover{background:#e4ebf7;color:var(--blue)}
.nav-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:none}
.nav-av img{width:100%;height:100%;object-fit:cover}
@media(max-width:640px){.crumb,.nav .hide-s{display:none}.logo{font-size:19px}}

/* ── layout ── */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 120px}
.hero-band{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,#e5edff 0%,transparent 60%),linear-gradient(180deg,#f7f9ff 0%,#eef3fb 100%);margin:0 -24px;padding:0 24px}
.hero-band::before{content:'';position:absolute;inset:0;opacity:.5;background-image:radial-gradient(circle at 20px 20px,rgba(24,119,242,.07) 3px,transparent 4px);background-size:44px 44px;pointer-events:none}
.pets{position:relative;display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none;max-width:1240px;margin:0 auto}.pets::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:700;font-size:13.5px;color:var(--navy);flex-shrink:0;box-shadow:0 2px 8px rgba(24,119,242,.06)}
.pchip.on{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.12)}
.pchip .av{width:32px;height:32px}
.pchip.add{padding:5px 15px;color:var(--blue-d);border-style:dashed;background:rgba(255,255,255,.7)}
.av{border-radius:50%;background:var(--t-blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px;padding:18px 22px 6px;flex-wrap:wrap}
.ch h2{font-size:17px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.ch h2 i{width:32px;height:32px;border-radius:10px;background:var(--t-blue);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.ch .badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:var(--pill);background:var(--coral-soft);color:var(--coral-d)}
.cb{padding:8px 22px 22px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.sec{margin-top:18px}
.sec-title{font-size:22px;font-weight:900;color:var(--navy);margin:34px 0 4px}
.sec-sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}

/* ── pet hero ── */
.hero{position:relative;max-width:1240px;margin:0 auto;padding:22px 0 64px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #dbe4f3;color:var(--blue-d);font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(24,119,242,.08)}
.eyebrow i{color:var(--coral);font-size:16px}
.hero h1{font-size:48px;line-height:1.08;font-weight:900;color:var(--navy);margin:14px 0 10px;letter-spacing:-1px}
.hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-size:16px;line-height:1.6;color:var(--sub);max-width:520px}
.facts{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}
.fact{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sub)}
.fact i{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:var(--pill)}
.st-great{background:var(--t-green);color:var(--t-green-d)}.st-ok{background:var(--t-blue);color:var(--t-blue-d)}.st-care{background:var(--t-amber);color:var(--t-amber-d)}.st-new{background:var(--t-purple);color:var(--t-purple-d)}
.collage{position:relative;display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:420px}
.collage.one{grid-template-columns:1fr}.collage.one .ph{grid-row:1/3}.collage.one .ph .cam{top:auto;bottom:12px}
.collage.two{grid-template-columns:1.35fr 1fr}.collage.two .ph{grid-row:1/3}
.ph-sample{position:absolute;left:12px;top:12px;z-index:3;padding:4px 10px;border-radius:999px;background:rgba(15,32,87,.6);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;backdrop-filter:blur(4px)}
.px-credit{position:absolute;right:4px;bottom:-22px;font-size:10.5px;color:var(--muted)}.px-credit a{color:inherit}
.ph{position:relative;border-radius:22px;overflow:hidden;background:#dfe7f5;box-shadow:0 14px 34px rgba(15,32,87,.16)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ph:hover img{transform:scale(1.04)}
.ph-main{grid-row:1/3}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.ph-tag{position:absolute;left:12px;bottom:12px;z-index:2;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.ph-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#e8f1ff,#f1ecff);color:var(--navy);font-weight:700;font-size:13px;text-align:center;padding:16px}
.ph-empty .e{font-size:76px;line-height:1}
.ph-empty::after{display:none}
.ph .cam{position:absolute;right:12px;top:12px;z-index:3;height:34px;padding:0 12px;border-radius:999px;border:none;background:rgba(255,255,255,.95);font-size:12.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.float-card{position:absolute;z-index:3;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,32,87,.2);padding:12px 14px;display:flex;align-items:center;gap:10px}
.float-1{left:-22px;bottom:30px;max-width:260px}
.float-2{right:-10px;top:-14px;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;color:var(--navy);gap:6px}
.float-2 i{color:var(--coral)}
.fc-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.fc-t{font-size:13px;font-weight:800;color:var(--navy);line-height:1.3}
.fc-s{font-size:11.5px;color:var(--muted)}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:24px;padding-bottom:56px}.collage{height:300px}.float-1{left:10px;bottom:-18px}.float-2{right:8px}.hero h1{font-size:36px}}
@media(max-width:520px){.collage{height:250px;grid-template-columns:1fr}.collage .ph:not(.ph-main){display:none}.hero h1{font-size:31px}}

/* stats strip overlapping the hero (like the emergency strip) */
.stats{position:relative;z-index:5;margin-top:-34px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--navy);line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px}.stat .ic{width:38px;height:38px;font-size:19px}.stat b{font-size:19px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:700;border:none;white-space:nowrap;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn-o{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(229,72,77,.3)}.btn-o:hover{filter:brightness(1.05);box-shadow:0 10px 24px rgba(229,72,77,.38)}
.btn-w{background:#fff;color:var(--navy);border:1.5px solid #dbe4f3}.btn-w:hover{border-color:var(--blue);color:var(--blue)}
.btn-b{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 8px 20px rgba(24,119,242,.26)}
.btn-s{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn-link{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;padding:0}
.btn[disabled]{opacity:.55;pointer-events:none}

/* wellness */
.well{display:flex;gap:20px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:900;color:var(--navy);line-height:1}
.ring .num span{font-size:11px;color:var(--muted);font-weight:600}
.well h3{font-size:18px;font-weight:800;color:var(--navy)}
.well p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.inds{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.ind{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.ind .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.ind .t{font-size:13.5px;font-weight:700;color:var(--navy)}.ind .t small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ind .bar{grid-column:2/4;height:6px;border-radius:9px;background:#edf1f8;overflow:hidden;margin-top:-4px}
.ind .bar i{display:block;height:100%;border-radius:9px}
.ind .pts{font-size:12px;font-weight:700;color:var(--muted)}
.disc{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.55;background:#f5f7fb;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;display:flex;gap:8px}
.disc i{color:var(--blue);font-size:15px;margin-top:1px}

/* reminders */
.rems{display:flex;flex-direction:column;gap:10px}
.rem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe}
.rem .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rem .t{flex:1;min-width:0}.rem .t b{display:block;font-size:14px;font-weight:700;color:var(--navy)}.rem .t span{font-size:12.5px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--pill);white-space:nowrap}
.p-over{background:var(--coral-soft);color:var(--coral-d)}.p-soon{background:var(--t-amber);color:var(--t-amber-d)}.p-ok{background:var(--t-green);color:var(--t-green-d)}.p-info{background:var(--t-blue);color:var(--t-blue-d)}
.c-peach{background:var(--t-coral);color:var(--t-coral-d)}.c-sage{background:var(--t-green);color:var(--t-green-d)}.c-lav{background:var(--t-purple);color:var(--t-purple-d)}.c-sky{background:var(--t-blue);color:var(--t-blue-d)}.c-coral{background:var(--t-coral);color:var(--t-coral-d)}.c-amber{background:var(--t-amber);color:var(--t-amber-d)}.c-teal{background:var(--t-teal);color:var(--t-teal-d)}

/* quick actions: white cards with tinted icon tiles (like "How PawBook helps") */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.qa{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.qa{grid-template-columns:repeat(2,1fr);gap:10px}}
.qa button{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;font-weight:700;font-size:13.5px;line-height:1.3;color:var(--navy);transition:transform .12s,box-shadow .12s,border-color .12s}
.qa button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,32,87,.12);border-color:#cfdaf0}
.qa button i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}

/* tabs (segmented bar) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:7px;background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);scrollbar-width:none;margin:30px 0 16px;position:sticky;top:calc(var(--nav-h) + 8px);z-index:50}
.tabs::-webkit-scrollbar{display:none}
.tab{height:42px;padding:0 15px;border-radius:11px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0}
.tab i{font-size:18px}
.tab:hover{color:var(--navy);background:#f5f7fb}.tab.on{background:var(--t-blue);color:var(--blue)}
.tab.rec{margin-left:auto}.tab.rec.on{background:var(--t-purple);color:var(--t-purple-d)}
.panel{display:none}.panel.on{display:block}

/* timeline */
.month{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:20px 2px 10px;display:flex;align-items:center;gap:10px}
.month::after{content:'';flex:1;height:1px;background:var(--line)}
.month:first-child{margin-top:4px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ev{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;border:1px solid var(--line);border-top:4px solid var(--evc,#e4e9f2);box-shadow:0 2px 10px rgba(15,32,87,.04)}
.ev .top{display:flex;gap:10px;align-items:center}
.ev .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ev b{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3}
.ev .d{font-size:12px;color:var(--muted)}
.ev .who{font-size:12.5px;font-weight:600;color:var(--sub);display:flex;gap:5px;align-items:center}
.ev p{font-size:13px;line-height:1.55;color:var(--sub)}
.ev img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:4px}
.ev .del{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;background:#f5f7fb;font-size:14px;color:var(--muted);opacity:0;transition:opacity .15s}
.ev:hover .del,.ev:focus-within .del{opacity:1}
@media(hover:none){.ev .del{opacity:.8}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fchip{height:32px;padding:0 13px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:600;font-size:12.5px;color:var(--muted)}
.fchip.on{border-color:var(--blue);color:var(--blue);background:var(--t-blue)}

/* lists */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap}
.row .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.row .t{flex:1;min-width:160px}.row .t b{display:block;font-size:14px;font-weight:700;color:var(--navy)}.row .t span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--navy);font-size:16px;font-weight:800;margin-bottom:4px}
.empty p{font-size:13.5px;max-width:420px;margin:0 auto 14px;line-height:1.55}

/* daily wellness */
.dw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.dw{grid-template-columns:repeat(2,1fr)}}
.dws{border-radius:16px;padding:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.dws i{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:6px}
.dws b{font-size:21px;font-weight:900;color:var(--navy);line-height:1.1}.dws span{font-size:12.5px;font-weight:600;color:var(--sub)}
.dws small{font-size:11.5px;color:var(--muted)}
button.dws:hover{border-color:#cfdaf0;box-shadow:var(--shadow)}
.week{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:14px;padding:0 2px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk .b{width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:#cfe0fb;min-height:4px}
.wk.today .b{background:linear-gradient(180deg,var(--blue),var(--purple))}
.wk span{font-size:11.5px;font-weight:600;color:var(--muted)}.wk em{font-style:normal;font-size:11px;font-weight:700;color:var(--navy)}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mood{height:38px;padding:0 13px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:600;font-size:13px;color:var(--sub)}
.mood.on{background:var(--t-purple);border-color:#cbbdf7;color:var(--t-purple-d)}
.q{margin-top:16px;font-size:13.5px;font-weight:700;color:var(--navy)}
.streak{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,#fff6f0,#fff1f1);border:1px solid #ffe0d2;margin-top:14px;font-weight:700;font-size:13.5px;color:var(--navy)}
.streak i{font-size:22px;color:#f97316}

/* weight chart */
.wchart{position:relative;height:210px;margin:12px 0 6px}
.wchart svg{width:100%;height:100%;overflow:visible}
.wtip{position:absolute;background:var(--navy);color:#fff;font-size:12px;font-weight:700;border-radius:10px;padding:6px 9px;pointer-events:none;transform:translate(-50%,-118%);white-space:nowrap;display:none}

/* memories */
.mems{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mem{border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(15,32,87,.05);position:relative}
.mem img{width:100%;height:170px;object-fit:cover;display:block}
.mem .noimg{height:120px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#e8f1ff,#f1ecff)}
.mem .c{padding:11px 13px}.mem b{font-size:14px;font-weight:700;color:var(--navy);display:block}.mem span{font-size:12px;color:var(--muted)}
.mem p{font-size:12.5px;margin-top:4px;line-height:1.5;color:var(--sub)}

/* AI card */
.ai{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:var(--r);background:linear-gradient(135deg,#1877F2,#8b5cf6);color:#fff;margin-top:18px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(24,119,242,.25)}
.ai .ic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:27px}
.ai .t{flex:1;min-width:200px}.ai b{font-size:16px;font-weight:800;display:block}.ai span{font-size:12.5px;opacity:.9;line-height:1.5}
.ai .btn-w{border:none}

/* modal */
.mo{position:fixed;inset:0;background:rgba(15,32,87,.45);z-index:600;display:none;align-items:flex-end;justify-content:center}
.mo.open{display:flex}
@media(min-width:620px){.mo{align-items:center}}
.md{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;animation:up .22s ease}
@media(min-width:620px){.md{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;gap:10px;padding:18px 22px 8px}
.mh h3{flex:1;font-size:19px;font-weight:800;color:var(--navy)}
.mx{width:36px;height:36px;border-radius:50%;border:none;background:#f0f2f5;font-size:16px}
.mb{padding:6px 22px 8px;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 22px 22px;display:flex;gap:8px;justify-content:flex-end}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-size:13px;font-weight:700;color:#2b3250}
.fl small{font-size:12px;color:var(--muted)}
.fi{height:48px;border:1.5px solid #dfe5ef;border-radius:12px;padding:0 14px;font-size:14px;background:#f8fafd;outline:none;width:100%;transition:border-color .15s,background .15s}
textarea.fi{height:auto;min-height:90px;padding:12px 14px;resize:vertical;line-height:1.55}
.fi:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(24,119,242,.1)}
.fl.bad .fi{border-color:var(--coral);background:#fff}.fl .err{display:none;color:var(--coral-d);font-size:12px;font-weight:600}.fl.bad .err{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg label{cursor:pointer}.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 13px;border-radius:11px;border:1.5px solid #dfe5ef;font-weight:600;font-size:13px;background:#f8fafd}
.seg input:checked+span{background:var(--t-blue);border-color:var(--blue);color:var(--blue)}
.seg input:focus-visible+span{outline:3px solid rgba(24,119,242,.35)}

/* health card */
.hcard{border-radius:18px;padding:18px;background:linear-gradient(135deg,#f7f9ff,#eef3fb);border:1px solid #dbe4f3}
.hcard .top{display:flex;gap:14px;align-items:center}
.hcard .av{width:74px;height:74px;border-radius:20px;font-size:36px;border:3px solid #fff;box-shadow:0 6px 16px rgba(15,32,87,.12)}
.hcard h4{font-size:20px;font-weight:900;color:var(--navy)}
.hcard .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:12px}
.hcard .kv span{color:var(--muted)}.hcard .kv b{font-weight:700;color:var(--navy)}
.hcard ul{margin:8px 0 0 18px;font-size:13px;line-height:1.65}

/* toast etc */
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:all .25s;z-index:700;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 10px 30px rgba(15,32,87,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{background:linear-gradient(90deg,#e8edf6 25%,#f3f6fb 50%,#e8edf6 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
.muted{color:var(--muted)}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;height:62px;background:#fff;border-top:1px solid var(--line);z-index:300;padding-bottom:env(safe-area-inset-bottom)}
@media(max-width:768px){.bnav{display:flex}.wrap{padding:0 16px 110px}.hero-band{margin:0 -16px;padding:0 16px}}
.bnav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted)}
.bnav button i{font-size:22px}.bnav button.on{color:var(--blue)}
@media print{
  body{background:#fff}.nav,.bnav,.tabs,.qa,.no-print,#drawer-panel,#drawer-overlay{display:none!important}
  body.print-card .wrap{display:none}body.print-card #cardModal{display:block!important;position:static;background:none}body.print-card #cardModal .md{box-shadow:none;max-height:none;animation:none}
  body.print-card #cardModal .mf,body.print-card #cardModal .mx{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── PawBook VetCare: same design language, more green and a little more professional ── */
:root{--blue:#269B70;--blue-d:#1c7d59;--purple:#41b88e;--navy:#1f2a44;--coral:#D83D3D;--coral-d:#b52f2f;--coral-soft:#fdeeee;
  --bg:#FFF9F3;--line:#efe6dc;--line2:#f5eee6;--text:#403A35;--sub:#4d4740;--muted:#7a7068;
  --orange:#F47A38;--cream:#FFF0E5;--sage:#E6F2E7;--lav:#EEE8FF;--info:#E8F1FF;
  --grad:linear-gradient(135deg,#F47A38,#f59e0b);--ggrad:linear-gradient(135deg,#2aa676,#1c7d59);
  --t-blue:#e8f1ff;--t-blue-d:#1a56db;--t-green:#e6f2e7;--t-green-d:#1c7d59;--shadow:0 6px 22px rgba(64,58,53,.07)}
.logo{color:#1877F2}.logo i{background:linear-gradient(135deg,#1877F2,#8b5cf6)}
.crumb b{color:var(--blue)}
.nav-av{background:var(--ggrad)}
.btn-g{background:var(--ggrad);color:#fff;box-shadow:0 8px 20px rgba(38,155,112,.28)}.btn-g:hover{filter:brightness(1.05)}
.btn-r{background:#fff;color:var(--coral-d);border:1.5px solid #f3c9c9}.btn-r:hover{background:var(--coral-soft)}
.btn-w:hover{border-color:var(--blue);color:var(--blue)}
.hero-band{background:radial-gradient(1100px 480px at 85% -10%,#e3f4ea 0%,transparent 60%),linear-gradient(180deg,#fffaf5 0%,#fff3e9 100%)}
.hero-band::before{background-image:radial-gradient(circle at 20px 20px,rgba(38,155,112,.07) 3px,transparent 4px)}
.eyebrow{color:var(--blue-d)!important}
.hero h1 .accent{background:var(--ggrad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* workspace nav */
.wnav{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);scrollbar-width:none;margin:16px 0 0;position:sticky;top:calc(var(--nav-h) + 8px);z-index:60}
.wnav::-webkit-scrollbar{display:none}
.wnav button{height:40px;padding:0 14px;border-radius:11px;border:none;background:none;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0}
.wnav button i{font-size:18px}.wnav button:hover{color:var(--navy);background:#faf5ef}.wnav button.on{background:var(--sage);color:var(--blue-d)}
.wnav .cnt{background:var(--coral);color:#fff;border-radius:999px;font-size:10.5px;font-weight:800;padding:1px 7px}
/* welcome */
.clinic{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub)}
.chip i{color:var(--blue)}.chip.live{background:var(--sage);border-color:#cfe6d4;color:var(--blue-d)}.chip.live b{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(38,155,112,.18)}
.mini{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}.mini div b{display:block;font-size:28px;font-weight:900;color:var(--navy);line-height:1}.mini div span{font-size:12.5px;color:var(--muted);font-weight:600}
.collage .ph{background:#efe4d8}
/* KPI */
.kpis{position:relative;z-index:5;margin-top:-34px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px 18px;min-height:118px;text-align:left}
button.kpi:hover{border-color:#d9cbbb}
.kpi .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:10px}
.kpi b{display:block;font-size:28px;font-weight:900;color:var(--navy);line-height:1}.kpi .l{font-size:13.5px;font-weight:700;color:var(--navy);margin-top:4px}.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi .thumb{position:absolute;right:-14px;bottom:-14px;width:86px;height:86px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 6px 16px rgba(64,58,53,.15)}
@media(max-width:520px){.kpi .thumb{width:62px;height:62px;right:-12px;bottom:-12px}.kpi b{font-size:24px}}
.c-sage{background:var(--sage);color:var(--blue-d)}.c-cream{background:var(--cream);color:#c25e1f}.c-lav{background:var(--lav);color:#6d4fd8}.c-info{background:var(--info);color:#1a56db}.c-red{background:var(--coral-soft);color:var(--coral-d)}.c-grey{background:#f3efea;color:#7a7068}
/* layout */
.dgrid{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-top:22px;align-items:start}
@media(max-width:1000px){.dgrid{display:flex;flex-direction:column}.dgrid>.side{order:-1}}
.card{border-color:var(--line)}
.ch h2 i{background:var(--sage);color:var(--blue-d)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:16px;color:var(--sub)}
.daynav .today{width:auto;padding:0 12px;font-size:12.5px;font-weight:700}
.sumchips{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 14px}
.sumchips span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:#faf5ef;color:var(--sub)}
/* appointment timeline */
.tline{position:relative;display:flex;flex-direction:column;gap:12px}
.ap{display:grid;grid-template-columns:62px 1fr;gap:12px}
.ap .tm{font-size:13px;font-weight:800;color:var(--navy);padding-top:16px;text-align:right;position:relative}
.ap .tm small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.apc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--stc,#e8ddd1);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;transition:box-shadow .15s}
.apc:hover{box-shadow:var(--shadow)}
.pav{width:56px;height:56px;border-radius:16px;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--cream)}
.pav img{width:100%;height:100%;object-fit:cover}
.pav.sm{width:42px;height:42px;border-radius:13px;font-size:22px}
.pav.lg{width:96px;height:96px;border-radius:24px;font-size:48px;border:4px solid #fff;box-shadow:0 8px 20px rgba(64,58,53,.15)}
.apc .t{flex:1;min-width:180px}
.apc .t b{font-size:15px;font-weight:800;color:var(--navy)}.apc .t .s{font-size:12.5px;color:var(--muted);margin-top:1px}
.apc .why{font-size:13px;color:var(--sub);margin-top:6px;display:flex;gap:6px;align-items:flex-start}.apc .why i{color:var(--orange);margin-top:2px}
.apc .own{font-size:12.5px;color:var(--sub);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.apc .own a{color:var(--blue-d);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.apc .acts{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:10px;border-top:1px dashed var(--line);margin-top:4px}
.st{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.st-up{background:var(--info);color:#1a56db}.st-wait{background:var(--cream);color:#c25e1f}.st-in{background:var(--sage);color:var(--blue-d)}.st-done{background:#eef0f3;color:#56607a}.st-x{background:var(--coral-soft);color:var(--coral-d)}
.st-in::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--blue);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.typ{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:#faf5ef;color:var(--muted);margin-left:6px;vertical-align:2px}
/* queue */
.qlist{display:flex;flex-direction:column;gap:10px}
.qi{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:#fffdfb;flex-wrap:wrap}
.qi.urgent{border-color:#f3c0c0;background:linear-gradient(90deg,#fff4f4,#fff)}
.qi.priority{border-color:#f7dcae;background:linear-gradient(90deg,#fffaf0,#fff)}
.qi.in{border-color:#bfe0cc;background:linear-gradient(90deg,#f1faf4,#fff)}
.qn{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qi .t{flex:1;min-width:120px}.qi .t b{font-size:14px;font-weight:800;color:var(--navy)}.qi .t span{display:block;font-size:12px;color:var(--muted)}
.qi .w{text-align:right;font-size:12px;color:var(--muted);font-weight:600}.qi .w b{display:block;font-size:15px;color:var(--navy)}
.qi .qa2{display:flex;gap:6px;width:100%;flex-wrap:wrap}
.pri{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:6px}
.pri.urgent{background:var(--coral);color:#fff}.pri.priority{background:#f59e0b;color:#fff}
/* attention */
.att{display:flex;flex-direction:column;gap:12px}
.ag{border-radius:16px;padding:12px 14px;border:1px solid var(--line)}
.ag h4{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--navy)}
.ag h4 .n{margin-left:auto;min-width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 8px}
.ag.urg{background:#fff6f6;border-color:#f6d0d0}.ag.urg h4 i,.ag.urg .n{color:var(--coral-d)}.ag.urg .n{background:#fde2e2}
.ag.fol{background:#fffaf2;border-color:#f6e3c2}.ag.fol h4 i{color:#c27a12}.ag.fol .n{background:#fdefd5;color:#a5650c}
.ag.pre{background:#f4faf5;border-color:#d4ead9}.ag.pre h4 i{color:var(--blue-d)}.ag.pre .n{background:var(--sage);color:var(--blue-d)}
.ag.adm{background:#f8f7f5;border-color:#ebe6df}.ag.adm h4 i{color:#7a7068}.ag.adm .n{background:#eee9e3;color:#5d564f}
.ag ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:7px}
.ag li{font-size:12.5px;line-height:1.45;color:var(--sub);cursor:default}.ag li b{color:var(--navy);display:block;font-size:13px}
.ag li.go{cursor:pointer}.ag li.go:hover b{color:var(--blue-d)}
.ag .none{font-size:12.5px;color:var(--muted);margin-top:6px}
/* week */
.wstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:700px){.wstats{grid-template-columns:repeat(2,1fr)}}
.ws{border-radius:14px;padding:12px;background:#fffaf5;border:1px solid var(--line2)}.ws b{display:block;font-size:22px;font-weight:900;color:var(--navy)}.ws span{font-size:12px;color:var(--muted);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;margin-top:16px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;position:relative}
.bar .stk{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:9px 9px 4px 4px;overflow:hidden;min-height:4px;background:#f1e8de}
.bar .stk i{display:block;background:var(--blue)}.bar .stk em{display:block;background:#bfe0cc}
.bar span{font-size:11px;font-weight:600;color:var(--muted)}.bar u{text-decoration:none;font-size:11px;font-weight:800;color:var(--navy)}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* patients grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.pc:hover{box-shadow:var(--shadow);border-color:#e3d5c6}
.pc .t{flex:1;min-width:0}.pc b{font-size:14.5px;font-weight:800;color:var(--navy);display:block}.pc span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;gap:8px;margin-bottom:14px}.search .fi{flex:1}
/* schedule week */
.week7{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.dcol{background:#fffaf5;border:1px solid var(--line2);border-radius:16px;padding:10px;min-height:160px}
.dcol h5{font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;display:flex;justify-content:space-between}
.dcol.today{background:#f1faf4;border-color:#cfe6d4}
.sa{background:#fff;border:1px solid var(--line);border-left:3px solid var(--stc,#e8ddd1);border-radius:11px;padding:8px;margin-bottom:7px;font-size:12px;cursor:pointer}
.sa b{display:block;font-size:12.5px;color:var(--navy)}.sa span{color:var(--muted)}
/* drawer (patient profile) */
.pd-ov{position:fixed;inset:0;background:rgba(31,42,68,.4);z-index:550;display:none}.pd-ov.open{display:block}
.pd{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:560;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(31,42,68,.2)}
.pd.open{transform:none}
.pd-h{background:linear-gradient(135deg,#fff3e8,#eaf6ee);padding:20px 22px 14px;position:relative}
.pd-h .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:none;background:#fff;font-size:16px}
.pd-id{display:flex;gap:16px;align-items:center}
.pd-id h3{font-size:24px;font-weight:900;color:var(--navy)}.pd-id .s{font-size:13px;color:var(--sub);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tagp{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--sub);display:inline-flex;gap:5px;align-items:center}
.tagp.red{background:var(--coral-soft);border-color:#f3c9c9;color:var(--coral-d)}
.pd-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pd-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}
.pd-tabs button{height:36px;padding:0 13px;border:none;background:none;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.pd-tabs button.on{background:var(--sage);color:var(--blue-d)}
.pd-b{flex:1;overflow-y:auto;padding:16px 22px 40px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.box h5{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:7px}.box h5 i{color:var(--blue)}
.kv2{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}.kv2 span{color:var(--muted)}.kv2 em{font-style:normal;font-weight:600;color:var(--navy)}
.vit{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.vit div{background:#fffaf5;border-radius:12px;padding:10px;text-align:center}.vit b{display:block;font-size:18px;color:var(--navy)}.vit span{font-size:11px;color:var(--muted)}
@media(max-width:520px){.vit{grid-template-columns:repeat(2,1fr)}}
.note{border-left:3px solid var(--blue);padding:4px 0 4px 12px;margin-bottom:12px}
.note.old{border-left-color:#d8cfc5;opacity:.75}
.note .m{font-size:12px;color:var(--muted)}.note p{font-size:13px;line-height:1.55;color:var(--sub);white-space:pre-wrap;margin-top:4px}
.rxm{font-size:13px;margin:4px 0 0 18px;line-height:1.6}
.spark{height:60px;margin-top:6px}
.gate{max-width:640px;margin:40px auto;text-align:center}
.gate img{width:100%;height:240px;object-fit:cover;border-radius:22px;margin-bottom:22px;box-shadow:var(--shadow)}
.gate h1{font-size:28px;font-weight:900;color:var(--navy)}.gate p{color:var(--sub);margin:8px auto 18px;max-width:480px;line-height:1.6}
.embed{--nav-h:0px}.embed .nav,.embed #drawer-panel,.embed #drawer-overlay{display:none!important}.embed .wrap{padding-top:4px}
.medtbl{width:100%;border-collapse:collapse;font-size:13px}.medtbl td{padding:6px 4px;vertical-align:top}.medtbl input{height:40px}

  /* ===== DRAWER STYLES ===== */
  .drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:450;}
  .drawer-overlay.open{display:block;}
  .drawer-panel{position:fixed;top:0;left:-320px;bottom:0;width:300px;background:#fff;z-index:500;overflow-y:scroll;-webkit-overflow-scrolling:touch;transition:left .28s ease;box-shadow:4px 0 32px rgba(0,0,0,.25);display:flex;flex-direction:column;}
  .drawer-panel::-webkit-scrollbar{width:4px;}
  .drawer-panel::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px;}
  .drawer-panel.open{left:0;}
  .drawer-header{background:#1877F2;padding:48px 16px 16px;position:relative;display:flex;align-items:center;gap:12px;}
  .drawer-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:16px;cursor:pointer;}
  .drawer-avatar{width:50px;height:50px;border-radius:50%;border:3px solid rgba(255,255,255,.4);object-fit:cover;}
  .drawer-user-name{font-size:15px;font-weight:800;color:#fff;}
  .drawer-user-handle{font-size:12px;color:rgba(255,255,255,.7);margin-top:2px;}
  .drawer-stats{display:flex;gap:16px;margin-top:10px;}
  .drawer-stat{text-align:center;}
  .drawer-stat-val{font-size:14px;font-weight:800;color:#fff;}
  .drawer-stat-label{font-size:10px;color:rgba(255,255,255,.7);}
  .drawer-body{flex:1;padding:6px 0;}
  .drawer-section{font-size:10px;font-weight:800;color:#1877F2;text-transform:uppercase;letter-spacing:.8px;padding:16px 18px 4px;margin-top:4px;border-top:1px solid #e4e6eb;}
  .drawer-item{display:flex;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;font-size:14px;font-weight:600;color:#050505;border:none;background:none;width:100%;font-family:inherit;text-align:left;}
  .drawer-item:hover{background:#eff6ff;color:#1877F2;}
  .drawer-item i{font-size:20px;width:24px;}
  .drawer-badge{margin-left:auto;background:#dc2626;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 6px;}
  .drawer-footer{padding:8px 0;border-top:1px solid #e4e6eb;}
  /* ===== END DRAWER STYLES ===== */
</style>
</head>
<body>

<nav class="nav">
  <button class="menu" onclick="openDrawer()" aria-label="Open menu"><i class="ti ti-menu-2"></i></button>
  <div class="logo" onclick="location.href='07_home.html'"><i>🐾</i><span>PawBook</span></div>
  <div class="crumb"><i class="ti ti-chevron-right"></i><b>VetCare</b></div>
  <div class="sp"></div>
  <select class="fi hide-s" id="practice" style="display:none;width:auto;height:38px" onchange="switchPractice(this.value)" aria-label="Clinic"></select>
  <button class="nav-ic" onclick="refresh(true)" title="Refresh" aria-label="Refresh"><i class="ti ti-refresh"></i></button>
  <button class="nav-ic" onclick="location.href='12_notifications.html'" title="Notifications" aria-label="Notifications"><i class="ti ti-bell"></i></button>
  <button class="nav-av" id="nav-av" onclick="location.href='29_user_profile.html'" aria-label="My profile">·</button>
</nav>

<main class="wrap" id="app">
  <div class="skel" style="height:300px;margin-top:18px"></div>
  <div class="skel" style="height:420px;margin-top:18px"></div>
</main>

<!-- patient profile -->
<div class="pd-ov" id="pd-ov" onclick="closePatient()"></div>
<aside class="pd" id="pd" role="dialog" aria-modal="true" aria-labelledby="pd-name"><div id="pd-in"></div></aside>

<!-- generic form modal -->
<div class="mo" id="mo" onclick="if(event.target===this)closeMo()">
  <div class="md" role="dialog" aria-modal="true" aria-labelledby="mo-title">
    <div class="mh"><h3 id="mo-title"></h3><button class="mx" onclick="closeMo()" aria-label="Close"><i class="ti ti-x"></i></button></div>
    <form id="mo-form" novalidate onsubmit="submitMo(event)"><div class="mb" id="mo-body"></div>
      <div class="mf"><button type="button" class="btn btn-w" onclick="closeMo()">Cancel</button><button class="btn btn-g" id="mo-save"><i class="ti ti-check"></i><span>Save</span></button></div></form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== PawBook VetCare (41) ===================== */
/* VetCare lives inside the vet booking page (11_vet_booking.html → Vet Portal). Opened directly, it moves there. */
var EMBED = false; try { EMBED = window.top !== window.self; } catch (e) { EMBED = true; }
if (!EMBED) { var _s = new URLSearchParams(location.search).get('s'); location.replace('11_vet_booking.html?mode=vet' + (_s ? '&s=' + encodeURIComponent(_s) : '')); }
else document.documentElement.classList.add('embed');
function goTop(u){ try { window.top.location.href = u; } catch (e) { location.href = u; } }
var API = 'https://pawbook.deemona.com/api/v1';
var TOKEN = ''; try { TOKEN = localStorage.getItem('pb_token') || localStorage.getItem('pawbook_token') || localStorage.getItem('token') || ''; } catch (e) {}
var PRACTICE = '', SEC = 'dashboard', D = null, DAY = null, MO = null, PT = null, PTAB = 'summary', CACHE = {}, WEEK0 = null, AN_DAYS = 30, TIMER = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, 2800); }
function qs(o){ var p = []; o = o || {}; if (PRACTICE) o.practice = PRACTICE; Object.keys(o).forEach(function(k){ if (o[k] != null && o[k] !== '') p.push(encodeURIComponent(k) + '=' + encodeURIComponent(o[k])); }); return p.length ? '?' + p.join('&') : ''; }
function api(path, o){
  o = o || {}; var h = {}; if (TOKEN) h.Authorization = 'Bearer ' + TOKEN;
  var body = o.body; if (body) { if (PRACTICE) body.practice = PRACTICE; h['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
  var url = API + '/vetcare' + path + (o.method && o.method !== 'GET' ? '' : '');
  return fetch(url, {method: o.method || 'GET', headers: h, body: body}).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok || j.success === false) { var e = new Error(j.message || j.error || ('Something went wrong (' + r.status + ')')); e.status = r.status; e.code = j.code; e.fields = j.fields; throw e; }
      return j.data !== undefined ? j.data : j;
    });
  });
}
function fail(e){ if (e && e.status === 401) { goTop('01_login.html'); return; } if (e && e.status === 409) { toast(e.message); refresh(); return; } toast(e && e.status === 429 ? 'Too many actions — please wait a moment' : ((e && e.message) || 'Something went wrong')); }
function today(){ var d = new Date(Date.now() + 330 * 60000); return d.toISOString().slice(0, 10); }
function addD(d, n){ var x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function fd(v, o){ if (!v) return ''; var d = new Date(String(v).length === 10 ? v + 'T00:00:00' : v); return isNaN(d) ? '' : d.toLocaleDateString('en-IN', o || {day: 'numeric', month: 'short', year: 'numeric'}); }
function ft(v){ var d = new Date(v); return isNaN(d) ? '' : d.toLocaleString('en-IN', {day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'}); }
function t12(t){ if (!t) return ''; var p = t.split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + ' ' + (h < 12 ? 'AM' : 'PM'); }
function cap(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function inr(n){ return '₹' + Number(n || 0).toLocaleString('en-IN'); }
var SP = {dog: '🐕', cat: '🐈', bird: '🦜', rabbit: '🐇', fish: '🐠', hamster: '🐹', turtle: '🐢', horse: '🐴'};
function emo(s){ s = String(s || '').toLowerCase(); return SP[s] || SP[/dog|canine|pupp/.test(s) ? 'dog' : /cat|feline|kitten/.test(s) ? 'cat' : /rabbit|bunny/.test(s) ? 'rabbit' : /bird|parrot/.test(s) ? 'bird' : ''] || '🐾'; }
function pav(p, cls){ p = p || {}; return '<div class="pav ' + (cls || '') + '">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.name || '') + '" loading="lazy" onerror="this.parentNode.textContent=\'' + emo(p.species) + '\'">' : emo(p.species)) + '</div>'; }
function petLine(p){ return [p.species ? cap(p.species) : '', p.breed, p.age].filter(Boolean).join(' · '); }
function tel(ph){ return String(ph || '').replace(/[^\d+]/g, ''); }
function wa(ph, text){ var d = tel(ph).replace(/^\+/, ''); if (d.length === 10) d = '91' + d; return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : ''); }
function emptyBox(e, t, p, btn){ return '<div class="empty"><div class="e">' + e + '</div><b>' + esc(t) + '</b>' + (p ? '<p>' + esc(p) + '</p>' : '') + (btn || '') + '</div>'; }
function clinical(){ return D && (D.role === 'vet' || D.role === 'admin'); }
function greet(){ var h = new Date(Date.now() + 330 * 60000).getUTCHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }

/* ---------- boot ---------- */
function boot(){
  if (!TOKEN) { goTop('01_login.html'); return; }
  try { PRACTICE = localStorage.getItem('pb_vet_practice') || ''; } catch (e) {}
  var s = new URLSearchParams(location.search).get('s'); if (SECTIONS.some(function(x){ return x[0] === s; })) SEC = s;
  DAY = today();
  api('/me').then(function(m){
    var l = m.practices || [];
    if (l.length > 1) { var sel = document.getElementById('practice'); sel.innerHTML = l.map(function(p){ return '<option value="' + esc(p.vet_id) + '">' + esc((p.clinic || p.vet_name) + ' · ' + cap(p.role)) + '</option>'; }).join(''); sel.style.display = ''; if (!l.some(function(p){ return p.vet_id === PRACTICE; })) PRACTICE = l[0].vet_id; sel.value = PRACTICE; }
    else PRACTICE = l.length ? l[0].vet_id : '';
    return refresh(true);
  }).catch(gate);
}
function practiceSel(){ var sel = document.getElementById('practice'); if (!EMBED || !sel || sel.options.length < 2) return ''; return '<select class="fi" style="width:auto;height:34px;border-radius:999px;font-size:13px" aria-label="Clinic" onchange="switchPractice(this.value)">' + sel.innerHTML.replace('value="' + PRACTICE + '"', 'value="' + PRACTICE + '" selected') + '</select>'; }
function switchPractice(v){ PRACTICE = v; try { localStorage.setItem('pb_vet_practice', v); } catch (e) {} CACHE = {}; refresh(true); }
function gate(e){
  if (e && e.status === 401) return fail(e);
  var code = e && e.code, h;
  if (code === 'not_vet' || code === 'pending' || code === 'suspended') {
    var t = {not_vet: ['PawBook VetCare is for vets and their clinic teams', 'Register your practice to manage appointments, your waiting room and patient records here. Clinic staff: ask your vet to add you to their team.', '<button class="btn btn-g" onclick="goTop(\'11_vet_booking.html?tab=register\')"><i class="ti ti-stethoscope"></i>Register as a vet</button>'],
      pending: ['Your registration is being verified', 'We check every vet\'s VCI registration before the workspace opens. This usually takes 2–3 business days.', '<button class="btn btn-w" onclick="goTop(\'11_vet_booking.html\')">Find a vet instead</button>'],
      suspended: ['This clinic account is suspended', 'Please write to support@deemona.com and we\'ll help.', '<a class="btn btn-w" href="mailto:support@deemona.com">Contact support</a>']}[code];
    h = '<div class="gate"><img src="img/vet/vet-owner.jpg" alt=""><span class="eyebrow"><i class="ti ti-stethoscope"></i>PawBook VetCare</span><h1>' + esc(t[0]) + '</h1><p>' + esc(t[1]) + '</p>' + t[2] + '</div>';
  } else h = emptyBox('🩺', 'Could not open the workspace', ((e && e.message) || '') + ' Please refresh in a moment.');
  document.getElementById('app').innerHTML = h;
}

/* ---------- data ---------- */
function refresh(full){
  clearTimeout(TIMER);
  var p = api('/dashboard' + qs({date: DAY})).then(function(d){ D = d; render(); });
  if (full) p = p.catch(gate); else p = p.catch(fail);
  TIMER = setTimeout(function(){ if (document.visibilityState === 'visible' && !MO && SEC === 'dashboard') refresh(); }, 60000);   // waiting times stay current
  return p;
}
var SECTIONS = [['dashboard', 'ti-layout-dashboard', 'Dashboard'], ['patients', 'ti-paw', 'Patients'], ['schedule', 'ti-calendar-event', 'Schedule'], ['consultations', 'ti-stethoscope', 'Consultations'],
  ['vaccinations', 'ti-vaccine', 'Vaccinations'], ['owners', 'ti-users', 'Pet owners'], ['analytics', 'ti-chart-bar', 'Analytics'], ['settings', 'ti-settings', 'Settings']];
function setSec(s){ SEC = s; try { history.replaceState(null, '', '?s=' + s); } catch (e) {} render(); window.scrollTo({top: 0}); }

/* ---------- render ---------- */
function render(){
  var c = D.clinic, k = D.kpi, h = '', first = (c.vet_name || '').split(' ')[0];
  var who = D.role === 'vet' ? 'Dr. ' + first : (D.viewer.name || '').split(' ')[0] || 'there';
  document.title = 'VetCare · ' + (c.clinic || c.vet_name) + ' – PawBook';
  if (SEC === 'dashboard') {
    var next = D.appointments.filter(function(a){ return a.status === 'upcoming' && !(a.queue && a.queue.status === 'done'); })[0];
    h += '<div class="hero-band"><section class="hero"><div><span class="eyebrow"><i class="ti ti-stethoscope"></i>PawBook VetCare</span>'
      + '<h1>' + greet() + ',<br><span class="accent">' + esc(who) + '!</span> 🐾</h1><p class="tag">Welcome to your PawBook VetCare workspace' + (D.role !== 'vet' ? ' — ' + esc(D.role === 'admin' ? 'clinic admin' : 'front desk') + ' view' : '') + '.</p>'
      + '<div class="clinic"><span class="chip"><i class="ti ti-building-hospital"></i>' + esc([c.clinic || ('Dr. ' + c.vet_name), c.city].filter(Boolean).join(' · ')) + '</span><span class="chip live"><b></b>Clinic workspace active</span>' + practiceSel() + '</div>'
      + '<div class="mini"><div><b>' + k.today + '</b><span>Today\'s appointments</span></div><div><b>' + k.patients + '</b><span>Registered patients</span></div><div><b>' + k.waiting + '</b><span>Waiting</span></div></div></div>'
      + '<div class="collage"><div class="ph ph-main"><img src="img/vet/vet-exam.jpg" alt="Vet examining a golden retriever"><span class="ph-tag"><i class="ti ti-heart"></i>Care, every visit</span></div>'
      + '<div class="ph"><img src="img/vet/golden-sun.jpg" alt="Happy golden retriever"><span class="ph-tag"><i class="ti ti-heart"></i>Healthy & happy</span></div>'
      + '<div class="ph"><img src="img/vet/vet-owner.jpg" alt="Vet with a pet owner and dog"><span class="ph-tag"><i class="ti ti-heart"></i>Owners we partner with</span></div>'
      + '<div class="float-card float-1"><span class="fc-ic c-sage"><i class="ti ti-clock" style="font-size:20px"></i></span><div><div class="fc-t">' + (next ? 'Next: ' + esc(next.pet ? next.pet.name : 'Appointment') + ' at ' + t12(next.time) : 'No more visits ' + (DAY === D.today ? 'today' : 'this day')) + '</div><div class="fc-s">' + (next ? esc(next.reason || next.type || '') : 'Enjoy a breather') + '</div></div></div>'
      + '<div class="float-card float-2"><i class="ti ti-paw"></i>' + k.waiting + ' waiting · ' + k.in_consult + ' in consultation</div></div></section></div>';
    h += '<div class="kpis">' + [
      ['c-sage', 'ti-calendar-heart', k.today, 'Today\'s appointments', k.completed + ' completed · ' + k.remaining + ' remaining', 'img/pets/dog-lab-face.jpg', "setSec('schedule')"],
      ['c-cream', 'ti-paw', k.patients, 'My pet patients', k.new_patients_30 ? '+' + k.new_patients_30 + ' new in 30 days' : 'Registered clinic patients', 'img/pets/cat-ginger.jpg', "setSec('patients')"],
      ['c-lav', 'ti-armchair', k.waiting, 'Little ones waiting', k.in_consult ? k.in_consult + ' in consultation' : 'Pets in the waiting room', 'img/pets/dog-sunset.jpg', "document.getElementById('queue').scrollIntoView({behavior:'smooth'})"],
      ['c-info', 'ti-vaccine', k.vaccines_due_7, 'Vaccines due this week', k.vaccines_overdue ? k.vaccines_overdue + ' overdue among patients' : 'None overdue', 'img/pets/cat-kitten.jpg', "setSec('vaccinations')"]
    ].map(function(x){ return '<button class="kpi" onclick="' + x[6] + '"><span class="ic ' + x[0] + '"><i class="ti ' + x[1] + '"></i></span><b>' + x[2] + '</b><div class="l">' + x[3] + '</div><small>' + esc(x[4]) + '</small><img class="thumb" src="' + x[5] + '" alt="" loading="lazy"></button>'; }).join('') + '</div>';
  }
  h += '<div class="wnav" role="tablist">' + SECTIONS.map(function(s){ var n = s[0] === 'dashboard' && D.attention.urgent.length ? '<span class="cnt">' + D.attention.urgent.length + '</span>' : '';
    if (s[0] === 'consultations' && !clinical()) return ''; return '<button class="' + (SEC === s[0] ? 'on' : '') + '" role="tab" aria-selected="' + (SEC === s[0]) + '" onclick="setSec(\'' + s[0] + '\')"><i class="ti ' + s[1] + '"></i>' + s[2] + n + '</button>'; }).join('') + '</div>';
  h += '<div id="sec">' + (SEC === 'dashboard' ? dashHTML() : '<div class="skel" style="height:320px;margin-top:18px"></div>') + '</div>';
  document.getElementById('app').innerHTML = h;
  if (SEC !== 'dashboard') loadSec();
}

/* ---------- dashboard ---------- */
var STL = {upcoming: ['st-up', 'Upcoming', '#9cc0f5'], waiting: ['st-wait', 'Waiting', '#F47A38'], in_consult: ['st-in', 'In consultation', '#269B70'], completed: ['st-done', 'Completed', '#c9ced8'], done: ['st-done', 'Seen', '#c9ced8'], cancelled: ['st-x', 'Cancelled', '#D83D3D'], 'no-show': ['st-x', 'No-show', '#D83D3D'], left: ['st-x', 'Left', '#D83D3D']};
function apState(a){ if (a.status !== 'upcoming') return a.status; if (a.queue && (a.queue.status === 'waiting' || a.queue.status === 'in_consult')) return a.queue.status; if (a.queue && a.queue.status === 'done') return 'done'; return 'upcoming'; }
function dashHTML(){
  var h = '<div class="dgrid"><div>' + visitsHTML() + weekHTML() + '</div><div class="side">' + queueHTML() + attentionHTML() + quickHTML() + '</div></div>';
  return h;
}
function visitsHTML(){
  var l = D.appointments, isT = DAY === D.today;
  var h = '<section class="card"><div class="ch"><h2><i class="ti ti-calendar-heart"></i>' + (isT ? 'Today\'s pet visits' : 'Pet visits') + '</h2><div class="daynav no-print"><button onclick="goDay(-1)" aria-label="Previous day"><i class="ti ti-chevron-left"></i></button>' + (isT ? '' : '<button class="today" onclick="goDay(0)">Today</button>') + '<button onclick="goDay(1)" aria-label="Next day"><i class="ti ti-chevron-right"></i></button></div></div><div class="cb">'
    + '<div class="muted" style="font-size:13px;font-weight:600;margin:-4px 0 10px">' + esc(fd(DAY, {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'})) + '</div>';
  if (!l.length) return h + emptyBox('📅', 'No appointments ' + (isT ? 'today' : 'on this day'), 'Appointments that pet owners book with you on PawBook appear here.', '<button class="btn btn-w btn-s" onclick="setSec(\'schedule\')"><i class="ti ti-calendar"></i>Open schedule</button>') + '</div></section>';

  if (s === 'schedule') { WEEK0 = WEEK0 || D.today; return go(api('/schedule' + qs({from: WEEK0, days: 7})), scheduleHTML); }

    + '<div class="two">' + fl('Heart rate (bpm)', inp('heart_rate', 'number', n.heart_rate, 'min="10" max="400" step="1"'), 'heart_rate', '10–400') + fl('Respiratory rate (/min)', inp('resp_rate', 'number', n.resp_rate, 'min="2" max="200" step="1"'), 'resp_rate', '2–200') + '</div>'
    + fl('Assessment / diagnosis', inp('diagnosis', 'text', n.diagnosis, 'maxlength="200"'), 'diagnosis') + fl('Clinical notes', '<textarea class="fi" name="notes" maxlength="5000" placeholder="History, examination findings, plan…">' + esc(n.notes || '') + '</textarea>', 'notes', 'Please add notes, a diagnosis or vitals')
    + fl('Allergies', inp('allergies', 'text', n.allergies != null ? n.allergies : (PT.allergies || ''), 'maxlength="300" placeholder="None known"'), 'allergies') + fl('Follow-up date (optional)', inp('follow_up_date', 'date', n.follow_up_date, 'min="' + D.today + '"'), 'follow_up_date', 'Please pick today or a later date')
    + (!n.id && open ? '<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" name="link" checked> Link to today\'s appointment (' + esc(t12(open.time)) + ')</label><input type="hidden" name="appointment_id" value="' + esc(open.id) + '">' : '') }; },
  prescription: function(){ var open = PT.appointments.filter(function(a){ return a.date === D.today; })[0]; return {title: 'Prescription · ' + PT.pet.name, save: 'Issue prescription', body: fl('Diagnosis / title', inp('title', 'text', '', 'maxlength="200" required placeholder="e.g. Allergic dermatitis"'), 'title', 'Please add a title')
    + '<div class="fl" data-f="medicines"><span>Medicines</span><table class="medtbl" id="meds">' + medRow() + '</table><button type="button" class="btn-link" onclick="document.getElementById(\'meds\').insertAdjacentHTML(\'beforeend\', medRow())">+ Add another medicine</button><span class="err">Please add at least one medicine</span></div>'
    + fl('Instructions (optional)', '<textarea class="fi" name="instructions" maxlength="2000" placeholder="Give with food, complete the course…"></textarea>', 'instructions') + fl('Valid until (optional)', inp('valid_until', 'date', addD(D.today, 30), 'min="' + D.today + '"'), 'valid_until', 'Please pick today or a later date')
    + (open ? '<input type="hidden" name="appointment_id" value="' + esc(open.id) + '">' : '') + '<small class="muted">The prescription appears in the owner\'s PawBook Pet Health page.</small>' }; },
  vaccination: function(){ return {title: 'Record a vaccination · ' + PT.pet.name, save: 'Save vaccination', body: fl('Vaccine', inp('name', 'text', '', 'maxlength="100" list="vxl" required placeholder="e.g. Rabies, DHPPiL"') + '<datalist id="vxl"><option>Rabies</option><option>DHPPiL</option><option>DHPPi</option><option>Leptospirosis</option><option>Kennel cough (Bordetella)</option><option>FVRCP</option><option>FeLV</option></datalist>', 'name', 'Please enter the vaccine')
    + '<div class="two">' + fl('Date given', inp('given_date', 'date', D.today, 'max="' + D.today + '" required'), 'given_date', 'Not in the future') + fl('Next due', inp('next_due_date', 'date', ''), 'next_due_date', 'Must be after the date given') + '</div>'
    + fl('Batch / lot number', inp('batch_number', 'text', '', 'maxlength="60"'), 'batch_number') + fl('Notes (optional)', inp('notes', 'text', '', 'maxlength="300"'), 'notes') + '<small class="muted">Saved under your name and added to the owner\'s Vaccination Diary.</small>' }; },
  staff: function(){ return {title: 'Add a team member', save: 'Add', body: fl('Their PawBook email', inp('email', 'email', '', 'maxlength="200" required'), 'email', 'Please enter a valid email', 'They need a PawBook account first.') + '<div class="fl"><span>Role</span>' + seg('role', [['receptionist', 'Receptionist']].concat(D.role === 'vet' ? [['admin', 'Clinic admin']] : [])) + '</div>' }; }
};
function medRow(){ return '<tr><td><input class="fi" name="m_name" placeholder="Medicine" maxlength="100"></td><td><input class="fi" name="m_dose" placeholder="Dose" maxlength="80"></td><td><input class="fi" name="m_freq" placeholder="How often" maxlength="80"></td><td><input class="fi" name="m_dur" placeholder="How long" maxlength="80"></td></tr>'; }
function openForm(kind, o){
  if (['followup', 'note', 'prescription', 'vaccination'].indexOf(kind) >= 0 && !PT) return;
  var f = FORMS[kind](o || {}); MO = {kind: kind, o: o || {}};
  document.getElementById('mo-title').textContent = f.title; document.getElementById('mo-body').innerHTML = f.body; document.querySelector('#mo-save span').textContent = f.save;
  var s = document.getElementById('mo-save'); s.style.display = ''; s.className = 'btn ' + (kind === 'cancel' ? 'btn-r' : 'btn-g');
  document.getElementById('mo').classList.add('open'); document.body.style.overflow = 'hidden';
  setTimeout(function(){ var i = document.querySelector('#mo-body input:not([type=radio]):not([type=hidden]):not([type=checkbox])'); if (i && window.innerWidth > 640) i.focus(); }, 60);
}
function closeMo(){ document.getElementById('mo').classList.remove('open'); document.body.style.overflow = PT ? 'hidden' : ''; MO = null; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { if (MO) closeMo(); else if (PT) closePatient(); } });
function val(f, n){ var e = f.elements[n]; if (!e) return ''; if (e.length && e[0] && e[0].type === 'radio') { for (var i = 0; i < e.length; i++) if (e[i].checked) return e[i].value; return ''; } return (e.value || '').trim(); }
function mark(f, keys){ f.querySelectorAll('.fl').forEach(function(l){ l.classList.toggle('bad', keys.indexOf(l.getAttribute('data-f')) >= 0); }); var b = f.querySelector('.fl.bad .fi'); if (b) b.focus(); }
function nnum(x){ return x === '' ? null : Number(x); }
function submitMo(e){
  e.preventDefault(); if (!MO) return; var f = e.target, k = MO.kind, o = MO.o, btn = document.getElementById('mo-save'), bad = [], req, msg;
  var pid = PT && PT.pet.id, after = function(){ closeMo(); toast(msg); refresh(); if (PT) openPatient(pid, true); };
  if (k === 'walkin') { var b = {walkin_name: val(f, 'walkin_name'), walkin_species: val(f, 'walkin_species'), walkin_owner: val(f, 'walkin_owner'), reason: val(f, 'reason'), priority: val(f, 'priority')}; if (!b.walkin_name) bad.push('walkin_name'); req = function(){ return api('/queue', {method: 'POST', body: b}); }; msg = 'Added to the waiting room'; }
  if (k === 'reschedule') { var d = val(f, 'date'), t = val(f, 'time'); if (!d || d < D.today) bad.push('date'); if (!t) bad.push('time'); req = function(){ return api('/appointments/' + o.id, {method: 'PATCH', body: {action: 'reschedule', token: o.token, date: d, time: t.slice(0, 5)}}); }; msg = 'Rescheduled to ' + fd(d) + ', ' + t12(t.slice(0, 5)); }
  if (k === 'cancel') { req = function(){ return api('/appointments/' + o.id, {method: 'PATCH', body: {action: 'cancel', token: o.token, reason: val(f, 'reason')}}); }; msg = 'Appointment cancelled'; }
  if (k === 'followup') { var fb = {pet_id: pid, date: val(f, 'date'), time: val(f, 'time').slice(0, 5), consult_type: val(f, 'consult_type'), reason: val(f, 'reason')}; if (!fb.date || fb.date < D.today) bad.push('date'); if (!fb.time) bad.push('time'); req = function(){ return api('/appointments', {method: 'POST', body: fb}); }; msg = 'Follow-up booked'; }
  if (k === 'note') { var nb = {weight_kg: nnum(val(f, 'weight_kg')), temperature_c: nnum(val(f, 'temperature_c')), heart_rate: nnum(val(f, 'heart_rate')), resp_rate: nnum(val(f, 'resp_rate')), diagnosis: val(f, 'diagnosis'), notes: val(f, 'notes'), allergies: val(f, 'allergies'), follow_up_date: val(f, 'follow_up_date') || null};
    if (o.edit) nb.supersedes = o.edit; else if (f.elements.link && f.elements.link.checked) nb.appointment_id = val(f, 'appointment_id');
    if (nb.weight_kg != null && !(nb.weight_kg > 0 && nb.weight_kg <= 200)) bad.push('weight_kg'); if (nb.temperature_c != null && !(nb.temperature_c >= 30 && nb.temperature_c <= 45)) bad.push('temperature_c');
    if (!nb.notes && !nb.diagnosis && nb.weight_kg == null && nb.temperature_c == null) bad.push('notes');
    req = function(){ return api('/patients/' + pid + '/notes', {method: 'POST', body: nb}); }; msg = o.edit ? 'Record updated · old version kept' : 'Consultation record saved'; }
  if (k === 'prescription') { var meds = [], rows = f.querySelectorAll('#meds tr'); rows.forEach(function(r){ var g = function(n){ return (r.querySelector('[name=' + n + ']').value || '').trim(); }; if (g('m_name')) meds.push({name: g('m_name'), dose: g('m_dose'), frequency: g('m_freq'), duration: g('m_dur')}); });
    var rb = {title: val(f, 'title'), medicines: meds, instructions: val(f, 'instructions'), valid_until: val(f, 'valid_until') || null, appointment_id: val(f, 'appointment_id') || undefined}; if (!rb.title) bad.push('title'); if (!meds.length) bad.push('medicines');
    req = function(){ return api('/patients/' + pid + '/prescriptions', {method: 'POST', body: rb}); }; msg = 'Prescription issued'; }
  if (k === 'vaccination') { var vb = {name: val(f, 'name'), given_date: val(f, 'given_date'), next_due_date: val(f, 'next_due_date') || null, batch_number: val(f, 'batch_number'), notes: val(f, 'notes')}; if (!vb.name) bad.push('name'); if (!vb.given_date || vb.given_date > D.today) bad.push('given_date'); if (vb.next_due_date && vb.next_due_date <= vb.given_date) bad.push('next_due_date');
    req = function(){ return api('/patients/' + pid + '/vaccinations', {method: 'POST', body: vb}); }; msg = 'Vaccination recorded'; }
  if (k === 'staff') { var sb = {email: val(f, 'email'), role: val(f, 'role')}; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(sb.email)) bad.push('email'); req = function(){ return api('/staff', {method: 'POST', body: sb}); }; msg = 'Added to your clinic team'; }
  if (bad.length) return mark(f, bad);
  btn.disabled = true;
  req().then(function(){ if (k === 'staff') { closeMo(); toast(msg); loadSec(); } else after(); }).catch(function(err){ if (err.fields) mark(f, err.fields); if (err.status === 409) { closeMo(); } fail(err); }).then(function(){ btn.disabled = false; });
}
