<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ═══════════════════════════════════════════════════════════
   PAWBOOK UNIFIED THEME v3
   Facebook Blue × Clean White × India-first
═══════════════════════════════════════════════════════════ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --pb-blue: #1877F2;
  --pb-blue-dark: #0d65d9;
  --pb-blue-soft: #e7f0fd;
  --pb-green: #22c55e;
  --pb-green-soft: #dcfce7;
  --pb-red: #ef4444;
  --pb-red-soft: #fee2e2;
  --pb-amber: #f59e0b;
  --pb-purple: #8b5cf6;
  --pb-grad: linear-gradient(135deg,#1877F2,#8b5cf6);
  --pb-ig-grad: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
  --pb-bg: #f0f2f5;
  --pb-card: #ffffff;
  --pb-border: #e4e6eb;
  --pb-text: #050505;
  --pb-text2: #65676b;
  --pb-text3: #8a8d91;
  --pb-radius: 12px;
  --pb-radius-sm: 8px;
  --pb-pill: 999px;
  --pb-shadow: 0 1px 2px rgba(0,0,0,.1),0 2px 8px rgba(0,0,0,.06);
  --pb-shadow-md: 0 4px 20px rgba(0,0,0,.1);
  --pb-shadow-lg: 0 12px 48px rgba(0,0,0,.16);
  --pb-nav-h: 56px;
}

/* ── RESET ── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--pb-bg);color:var(--pb-text);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
button{font-family:'Inter',sans-serif;cursor:pointer}
input,textarea,select{font-family:'Inter',sans-serif}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}

/* ── TOPNAV ── */
.pb-nav{
  position:fixed;top:0;left:0;right:0;height:var(--pb-nav-h);
  background:#fff;border-bottom:1px solid var(--pb-border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
  z-index:400;box-shadow:0 1px 0 rgba(0,0,0,.08);
}
.pb-nav-logo{font-size:22px;font-weight:900;color:var(--pb-blue);display:flex;align-items:center;gap:8px;cursor:pointer}
.pb-nav-logo-icon{width:36px;height:36px;border-radius:10px;background:var(--pb-grad);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.pb-nav-search{flex:1;max-width:260px;height:40px;background:var(--pb-bg);border-radius:var(--pb-pill);display:flex;align-items:center;padding:0 14px;gap:8px}
.pb-nav-search input{border:none;outline:none;background:transparent;font-size:14px;color:var(--pb-text);width:100%}
.pb-nav-search input::placeholder{color:var(--pb-text3)}
.pb-nav-tabs{flex:1;display:flex;align-items:center;justify-content:center;gap:2px}
.pb-nav-tab{height:48px;width:100px;border-radius:var(--pb-radius-sm);border:none;background:transparent;cursor:pointer;color:var(--pb-text3);font-size:22px;display:flex;align-items:center;justify-content:center;transition:all .15s;position:relative}
.pb-nav-tab:hover{background:var(--pb-bg);color:var(--pb-blue)}
.pb-nav-tab.active{color:var(--pb-blue)}
.pb-nav-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--pb-blue);border-radius:3px 3px 0 0}
.pb-nav-right{display:flex;align-items:center;gap:6px;margin-left:auto}
.pb-icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--pb-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--pb-text);font-size:18px;transition:background .15s;position:relative}
.pb-icon-btn:hover{background:var(--pb-border)}
.pb-avatar{width:36px;height:36px;border-radius:50%;background:var(--pb-grad);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* ── BUTTONS ── */
.pb-btn{height:36px;padding:0 18px;border-radius:var(--pb-pill);border:none;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;font-family:'Inter',sans-serif}
.pb-btn-blue{background:var(--pb-blue);color:#fff}
.pb-btn-blue:hover{background:var(--pb-blue-dark)}
.pb-btn-gray{background:var(--pb-bg);color:var(--pb-text)}
.pb-btn-gray:hover{background:var(--pb-border)}
.pb-btn-green{background:var(--pb-green);color:#fff}
.pb-btn-green:hover{background:#16a34a}
.pb-btn-red{background:var(--pb-red);color:#fff}
.pb-btn-red:hover{background:#dc2626}
.pb-btn-outline{background:transparent;border:1.5px solid var(--pb-border);color:var(--pb-text2)}
.pb-btn-outline:hover{background:var(--pb-bg)}
.pb-btn-sm{height:30px;padding:0 12px;font-size:12px}
.pb-btn-lg{height:44px;padding:0 28px;font-size:15px}
.pb-btn-full{width:100%;justify-content:center}

/* ── CARDS ── */
.pb-card{background:var(--pb-card);border-radius:var(--pb-radius);border:1px solid var(--pb-border);box-shadow:var(--pb-shadow);overflow:hidden}
.pb-card-body{padding:14px 16px}

/* ── BADGES ── */
.pb-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--pb-pill);font-size:11px;font-weight:700}
.pb-badge-blue{background:var(--pb-blue-soft);color:var(--pb-blue)}
.pb-badge-green{background:var(--pb-green-soft);color:#16a34a}
.pb-badge-red{background:var(--pb-red-soft);color:var(--pb-red)}
.pb-badge-amber{background:#fef3c7;color:var(--pb-amber)}
.pb-badge-purple{background:#f3e8ff;color:var(--pb-purple)}

/* ── FORM INPUTS ── */
.pb-input{width:100%;height:44px;border:1.5px solid var(--pb-border);border-radius:var(--pb-radius);padding:0 14px;font-size:14px;color:var(--pb-text);outline:none;background:var(--pb-card);transition:border-color .15s}
.pb-input:focus{border-color:var(--pb-blue)}
.pb-select{width:100%;height:44px;border:1.5px solid var(--pb-border);border-radius:var(--pb-radius);padding:0 14px;font-size:14px;color:var(--pb-text);outline:none;background:var(--pb-card);cursor:pointer}
.pb-select:focus{border-color:var(--pb-blue)}
.pb-textarea{width:100%;border:1.5px solid var(--pb-border);border-radius:var(--pb-radius);padding:10px 14px;font-size:14px;color:var(--pb-text);outline:none;resize:none;transition:border-color .15s}
.pb-textarea:focus{border-color:var(--pb-blue)}
.pb-label{font-size:12px;font-weight:700;color:var(--pb-text2);display:block;margin-bottom:5px}

/* ── MODAL ── */
.pb-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.pb-modal-bg.open{display:flex}
.pb-modal{background:var(--pb-card);border-radius:16px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--pb-shadow-lg)}
.pb-modal-head{padding:16px 18px;border-bottom:1px solid var(--pb-border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--pb-card);z-index:1;border-radius:16px 16px 0 0}
.pb-modal-title{font-size:17px;font-weight:800;color:var(--pb-text)}
.pb-modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--pb-bg);cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;color:var(--pb-text2)}
.pb-modal-body{padding:18px}

/* ── TOAST ── */
.pb-toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.88);color:#fff;padding:10px 20px;border-radius:var(--pb-pill);font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center;backdrop-filter:blur(8px)}
.pb-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── BOTTOM NAV ── */
.pb-bottomnav{position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid var(--pb-border);display:none;align-items:center;justify-content:space-around;z-index:400}
@media(max-width:768px){.pb-bottomnav{display:flex}}
.pb-bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 12px;border-radius:var(--pb-radius-sm);border:none;background:none}
.pb-bnav-item i{font-size:22px;color:var(--pb-text3)}
.pb-bnav-item.active i{color:var(--pb-blue)}
.pb-bnav-label{font-size:9px;font-weight:600;color:var(--pb-text3)}
.pb-bnav-item.active .pb-bnav-label{color:var(--pb-blue)}

/* ── PAGE LAYOUT ── */
.pb-page-wrap{padding-top:var(--pb-nav-h);padding-bottom:60px;min-height:100vh}
.pb-container{max-width:1100px;margin:0 auto;padding:20px 16px}

/* ── SECTION HEADERS ── */
.pb-section-title{font-size:18px;font-weight:800;color:var(--pb-text);margin-bottom:14px}
.pb-divider{height:1px;background:var(--pb-border);margin:12px 0}

/* ── HERO BANNER ── */
.pb-hero{background:var(--pb-blue);position:relative;overflow:hidden;padding:40px 20px}
.pb-hero-dark{background:var(--pb-text)}
.pb-hero::before{content:'';position:absolute;inset:0;opacity:.12}
.pb-hero-inner{position:relative;z-index:1}
.pb-hero h1{font-size:clamp(24px,4vw,36px);font-weight:900;color:#fff;margin-bottom:8px}
.pb-hero p{font-size:14px;color:rgba(255,255,255,.75);margin-bottom:20px}

/* ── DROPDOWN ── */
.pb-dropdown{position:relative}
.pb-dropdown-menu{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--pb-border);border-radius:var(--pb-radius);box-shadow:var(--pb-shadow-md);z-index:100;max-height:260px;overflow-y:auto;display:none}
.pb-dropdown-menu.open{display:block}
.pb-dropdown-item{padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--pb-bg)}
.pb-dropdown-item:hover{background:var(--pb-blue-soft);color:var(--pb-blue)}
.pb-dropdown-item:last-child{border-bottom:none}

    notifications:'12_notifications.html'

// ── TOAST ────────────────────────────────────
function toast(msg, type) {
  var t = document.getElementById('pb-toast');
  if(!t) {
    t = document.createElement('div');
    t.id = 'pb-toast';
    t.className = 'pb-toast';
    document.body.appendChild(t);
  }
  var bg = type==='error'?'#ef4444':type==='success'?'#22c55e':type==='info'?'#1877F2':'rgba(0,0,0,.88)';
  t.style.background = bg;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}

function openModal(id) {
  var m = document.getElementById(id);
  if(m) { m.classList.add('open'); document.body.style.overflow='hidden'; }
}
function closeModal(id) {
  var m = document.getElementById(id);
  if(m) { m.classList.remove('open'); document.body.style.overflow=''; }
}

// ── CITY SELECTOR BUILDER ─────────────────────
function buildCitySelector(countryId, stateId, cityId, onchange) {
  var countries = Object.keys(PB_CITIES);
  var countryHtml = '<select class="pb-select" id="'+countryId+'" onchange="pbUpdateStates(\''+countryId+'\',\''+stateId+'\',\''+cityId+'\')">';
  countryHtml += '<option value="">🌍 Select Country</option>';
  countries.forEach(function(c){ countryHtml += '<option>'+c+'</option>'; });
  countryHtml += '</select>';

  var stateHtml = '<select class="pb-select" id="'+stateId+'" onchange="pbUpdateCities(\''+countryId+'\',\''+stateId+'\',\''+cityId+'\')" disabled><option value="">Select State/Region</option></select>';
  var cityHtml = '<select class="pb-select" id="'+cityId+'" disabled><option value="">Select City</option></select>';

  return {country: countryHtml, state: stateHtml, city: cityHtml};
}

function pbUpdateStates(countryId, stateId, cityId) {
  var country = document.getElementById(countryId).value;
  var stateEl = document.getElementById(stateId);
  var cityEl = document.getElementById(cityId);
  stateEl.innerHTML = '<option value="">Select State/Region</option>';
  cityEl.innerHTML = '<option value="">Select City</option>';
  cityEl.disabled = true;
  if(!country || !PB_CITIES[country]) { stateEl.disabled = true; return; }
  stateEl.disabled = false;
  Object.keys(PB_CITIES[country]).forEach(function(s){
    stateEl.innerHTML += '<option>'+s+'</option>';
  });
}

function pbUpdateCities(countryId, stateId, cityId) {
  var country = document.getElementById(countryId).value;
  var state = document.getElementById(stateId).value;
  var cityEl = document.getElementById(cityId);
  cityEl.innerHTML = '<option value="">Select City</option>';
  if(!country || !state || !PB_CITIES[country] || !PB_CITIES[country][state]) { cityEl.disabled = true; return; }
  cityEl.disabled = false;
  PB_CITIES[country][state].forEach(function(c){
    cityEl.innerHTML += '<option>'+c+'</option>';
  });
}

// ── EMERGENCY NUMBER LOOKUP ───────────────────
function pbGetEmergencyNumbers(country, region) {
  if(!country || !PB_EMERGENCY[country]) return [];
  var results = [];
  var allKey = 'All ' + country;
  if(PB_EMERGENCY[country][allKey]) results = results.concat(PB_EMERGENCY[country][allKey]);
  if(region && PB_EMERGENCY[country][region]) results = results.concat(PB_EMERGENCY[country][region]);
  return results;
}

<script>
const EVENTS = [
  { id:1, type:'meetup', title:'Delhi Dog Park Meetup 🐕', date:'Sun, Sep 15 · 7:00 AM', location:'Lodhi Garden, New Delhi', description:'Monthly dog meetup! All breeds welcome. Bring water and treats.', img:'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=600&q=80', attendees:234, interested:567, organizer:'Delhi Dog Club', free:true, going:false },
  { id:2, type:'adoption', title:'Adoption Drive — 50 Pets Need Homes 🏠', date:'Sat, Sep 14 · 10:00 AM - 5:00 PM', location:'Connaught Place, New Delhi', description:'Hopeful Tails Shelter is hosting a mega adoption event. Meet dogs, cats, rabbits, and more!', img:'https://images.unsplash.com/photo-1444212477490-ca407925329e?w=600&q=80', attendees:89, interested:1234, organizer:'Hopeful Tails Shelter', free:true, going:false },
  { id:3, type:'vet', title:'Free Vaccination Camp 💉', date:'Sat, Sep 14 · 9:00 AM - 1:00 PM', location:'Sanjay Gandhi Animal Care, GK-1', description:'Free rabies + distemper vaccination for all pets. Bring health records.', img:'https://images.unsplash.com/photo-1628009368231-7bb7cfcb0def?w=600&q=80', attendees:156, interested:892, organizer:'Delhi SPCA', free:true, going:false },
  { id:4, type:'show', title:'PawBook Pet Talent Show 🏆', date:'Sat, Sep 21 · 3:00 PM', location:'India Habitat Centre, New Delhi', description:'Show off your pet\'s talents! Prizes for Best Trick, Cutest Pet, Best Costume.', img:'https://images.unsplash.com/photo-1535930891776-0c2dfb7fda1a?w=600&q=80', attendees:312, interested:2341, organizer:'PawBook India', free:false, price:'₹299', going:false },
  { id:5, type:'training', title:'Puppy Socialization Workshop 🎓', date:'Sun, Sep 22 · 10:00 AM', location:'Vasant Kunj Pet Club, Delhi', description:'Professional trainers teach basic commands, leash walking, and socialization for puppies 8-16 weeks.', img:'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=600&q=80', attendees:28, interested:145, organizer:'Cessna Lifeline', free:false, price:'₹599', going:false },
  { id:6, type:'online', title:'Live Q&A: Exotic Pet Care 🦎', date:'Fri, Sep 13 · 8:00 PM IST', location:'PawBook Live', description:'Dr. Arjun Mehta answers your questions about reptiles, birds, and exotic pet care. Join free!', img:'https://images.unsplash.com/photo-1548767797-d8c844163c4a?w=600&q=80', attendees:678, interested:4521, organizer:'Dr. Arjun Mehta', free:true, going:false },
  { id:7, type:'meetup', title:'Mumbai Cat Lovers Cafe Meetup 🐈', date:'Sat, Sep 28 · 4:00 PM', location:'Bandra, Mumbai', description:'Monthly cat lovers gathering at The Purrfect Cafe. Cats welcome on leash!', img:'https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=600&q=80', attendees:67, interested:234, organizer:'Mumbai Cat Society', free:true, going:false },
  { id:8, type:'vet', title:'Bird & Avian Health Camp 🦜', date:'Sun, Sep 29 · 9:00 AM', location:'Lajpat Nagar, Delhi', description:'Free checkup and clipping for all pet birds. Specialist avian vet on site.', img:'https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=600&q=80', attendees:45, interested:321, organizer:'Delhi Avian Society', free:true, going:false },
];

let currentFilter = 'all';
let goingEvents = new Set();

function renderEvents(filter = 'all') {
  const filtered = filter === 'all' ? EVENTS : EVENTS.filter(e => e.type === filter);
  const list = document.getElementById('events-list');

  // Group by upcoming vs this week
  list.innerHTML = '';

  const upcoming = filtered.filter((_,i) => i < 3);
  const more = filtered.filter((_,i) => i >= 3);

  if(upcoming.length) {
    list.innerHTML += `<div class="section-label">📅 This Weekend</div>`;
    list.innerHTML += upcoming.map(e => renderEventCard(e)).join('');
  }
  if(more.length) {
    list.innerHTML += `<div class="section-label">🗓️ Coming Up</div>`;
    list.innerHTML += more.map(e => renderEventCard(e)).join('');
  }
  if(!filtered.length) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8"><div style="font-size:48px;margin-bottom:12px">📭</div><div style="font-weight:700">No events in this category</div><div style="font-size:13px;margin-top:6px">Check back soon!</div></div>`;
  }
}

function renderEventCard(e) {
  const isGoing = goingEvents.has(e.id);
  return `
  <div class="event-card">
    <img class="event-img" src="${e.img}" onerror="this.style.background='#dbeafe';this.style.height='80px'">
    <div class="event-body">
      <div class="event-date-badge">📅 ${e.date}</div>
      <div class="event-title">${e.title}</div>
      <div class="event-meta"><i class="ti ti-map-pin" style="color:#1a4db3"></i> ${e.location}</div>
      <div class="event-meta"><i class="ti ti-users" style="color:#10b981"></i> ${e.attendees} going · ${e.interested} interested · by ${e.organizer}</div>
      <div style="font-size:12px;color:#475569;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${e.description}</div>
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:12px">
        <div style="display:flex;align-items:center">
          <img src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=60&q=80" style="width:24px;height:24px;border-radius:50%;border:2px solid #fff;margin-right:-6px;object-fit:cover;flex-shrink:0">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=60&q=80" style="width:24px;height:24px;border-radius:50%;border:2px solid #fff;margin-right:-6px;object-fit:cover;flex-shrink:0">
          <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=60&q=80" style="width:24px;height:24px;border-radius:50%;border:2px solid #fff;margin-right:-6px;object-fit:cover;flex-shrink:0">
        </div>
        <span style="font-size:11px;color:#64748b;margin-left:10px">+${e.attendees-3} going</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 14px">
        <span style="font-size:13px;font-weight:800;color:${e.free?'#16a34a':'#1877F2'}">${e.free?'🆓 Free':e.price}</span>
        <span style="font-size:11px;color:#65676b">${e.category||''}</span>
      </div>
      <div class="event-actions">
        <button class="event-btn btn-going ${isGoing?'active':''}" id="going-${e.id}" onclick="toggleGoing(${e.id},this)">
          ${isGoing?'✓ Going':'Going'}
        </button>
        <button class="event-btn btn-interested" onclick="toggleInterested(${e.id},this)">Interested</button>
        <button class="event-btn btn-interested" onclick="shareEvent('${e.title}')" style="padding:0 10px"><i class="ti ti-share"></i></button>
      </div>
    </div>
  </div>`;
}

function filterEvents(type, el) {
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  currentFilter = type;
  renderEvents(type);
}

function toggleGoing(id, btn) {
  if(goingEvents.has(id)) { goingEvents.delete(id); btn.textContent='Going'; btn.classList.remove('active'); showToast('Removed from going'); }
  else { goingEvents.add(id); btn.textContent='✓ Going'; btn.classList.add('active'); showToast('✅ You\'re going!'); }
}
function toggleInterested(id, btn) {
  btn.textContent = btn.textContent==='Interested'?'★ Interested':'Interested';
  btn.style.color = btn.textContent==='★ Interested'?'#f59e0b':'';
  showToast(btn.textContent==='★ Interested'?'⭐ Marked as interested!':'Removed');
}
function shareEvent(title) {
  navigator.clipboard?.writeText('Check out this event on PawBook: '+title).then(()=>showToast('🔗 Link copied!'));
}
function createEvent() {
  const title = prompt('Event name:');
  if(!title) return;
  showToast('🎉 Event created! (Coming soon — full form)');
}
function showToast(msg) {
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a4db3;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:9999;font-family:Poppins,sans-serif;white-space:nowrap';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000);
}

renderEvents();
</script>
