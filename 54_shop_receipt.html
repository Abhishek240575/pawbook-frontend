<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Order receipt — PawBook Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="shop.css?v=10">
<style>
body{background:#f4f1ec}
.tb{display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:820px;margin:18px auto 0;padding:0 16px;flex-wrap:wrap}
.tb a{color:var(--muted);font-size:13px;font-weight:600;text-decoration:none}
.doc{max-width:820px;margin:14px auto 40px;background:#fff;border:1px solid #e9e2d8;border-radius:16px;padding:32px 36px;color:#1f2433;font-size:13px;line-height:1.55;box-sizing:border-box}
.dh{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #1f2433;padding-bottom:16px;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center}.brand .ic{width:40px;height:40px;border-radius:12px;background:var(--o);display:flex;align-items:center;justify-content:center;font-size:20px}
.brand b{font-size:20px;font-weight:900;display:block;line-height:1.1}.brand small{color:var(--muted);font-size:11.5px}
.dh h1{font-size:20px;margin:0;text-align:right}.dh .meta{text-align:right;color:#4b5163;font-size:12.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0}
.cols h3{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 4px}
table.it{width:100%;border-collapse:collapse;margin-top:6px}
table.it th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;border-bottom:1px solid #d9d2c7;padding:8px 6px}
table.it td{border-bottom:1px solid #eee7dd;padding:9px 6px;vertical-align:top}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{margin-left:auto;width:290px;max-width:100%;margin-top:10px}.tot div{display:flex;justify-content:space-between;padding:4px 6px}.tot .g{border-top:2px solid #1f2433;font-weight:900;font-size:15px;margin-top:4px;padding-top:8px}
.note{margin-top:18px;font-size:11.5px;color:#5b6172;border-top:1px dashed #d9d2c7;padding-top:12px}
.label{border:2px dashed #1f2433;border-radius:12px;padding:16px 18px;margin-top:22px;display:grid;grid-template-columns:1fr auto;gap:12px}
.label .to{font-size:15px;line-height:1.45}.label .to b{font-size:17px}.label .cod{align-self:start;border:2px solid #1f2433;border-radius:10px;padding:8px 12px;text-align:center;font-weight:900;font-size:16px}
.label .cod small{display:block;font-weight:600;font-size:10.5px;letter-spacing:.5px}
.chk{width:16px;height:16px;border:1.5px solid #1f2433;border-radius:3px;display:inline-block}
.err{max-width:820px;margin:60px auto;text-align:center}
@media(max-width:640px){ .doc{padding:20px 16px;border-radius:0;border-left:0;border-right:0} .cols{grid-template-columns:1fr} .dh h1,.dh .meta{text-align:left} .label{grid-template-columns:1fr} table.it .hm{display:none} }
@media print{ body{background:#fff} .tb{display:none} .doc{border:0;margin:0;max-width:none;padding:0;border-radius:0} @page{margin:14mm} a{color:inherit;text-decoration:none} }
</style>
</head>
<body>
<div class="tb"><a href="javascript:history.length>1?history.back():window.close()"><i class="ti ti-arrow-left"></i> <span data-i18n="rt.back">Back</span></a>
  <button class="btn btn-o btn-sm" onclick="window.print()"><i class="ti ti-printer"></i><span data-i18n="rt.print">Print / save as PDF</span></button></div>
<div id="doc"><div class="doc"><div class="pc-skel" style="aspect-ratio:auto;height:300px"></div></div></div>

<script src="pawbook-i18n.js?v=10"></script>
<script src="shop-i18n.js?v=10"></script>
<script src="seller-i18n.js?v=10"></script>
<script src="shop.js?v=11"></script>
<script>
var S = Shop, T = PBi18n.t, esc = S.esc;
var qs = new URLSearchParams(location.search), OID = qs.get('id') || '', AS = qs.get('as') === 'seller' ? 'seller' : qs.get('as') === 'admin' ? 'admin' : 'buyer';
var D = null;
function money(n){ return S.money(n); }
function dt(v){ return v ? PBi18n.fmtDate(v, {day: 'numeric', month: 'short', year: 'numeric'}) : '—'; }
function addr(a){ a = a || {}; return '<b>' + esc(a.name || '') + '</b><br>' + esc([a.line1 || a.address, a.line2, a.landmark].filter(Boolean).join(', ')) + '<br>' + esc([a.city, a.state].filter(Boolean).join(', ')) + ' – ' + esc(a.pincode || '') + (a.phone ? '<br>+91 ' + esc(a.phone) : ''); }
var BRAND = '<div class="brand"><div class="ic">🐾</div><div><b>PawBook Shop</b><small>pawbook.deemona.com · support@deemona.com</small></div></div>';
function render(){
  var o = D, h = '';
  if (AS === 'seller') {
    var st = o.store || {}, live = o.items.filter(function(i){ return i.status !== 'cancelled'; }), a = o.delivery_address || {};
    document.title = T('rt.slip') + ' ' + (o.order_number || '') + ' — PawBook';
    h += '<div class="doc"><div class="dh">' + BRAND + '<div><h1>' + esc(T('rt.slip')) + '</h1><div class="meta">' + esc(T('rt.orderno')) + ' <b>' + esc(o.order_number || o.order_id) + '</b><br>' + esc(T('rt.placed')) + ' ' + esc(dt(o.created_at)) + '<br><b>' + esc(T('rt.shipby', {d: dt(o.ship_by)})) + '</b></div></div></div>'
      + '<div class="cols"><div><h3>' + esc(T('rt.from')) + '</h3><b>' + esc(st.store_name || '') + '</b><br>' + esc(st.pickup_address || '') + '<br>' + esc([st.city, st.state].filter(Boolean).join(', ')) + ' – ' + esc(st.pincode || '') + (st.phone ? '<br>+91 ' + esc(st.phone) : '') + (st.gstin ? '<br>GSTIN ' + esc(st.gstin) : '') + '</div>'
      + '<div><h3>' + esc(T('rt.shipto')) + '</h3>' + addr(a) + '</div></div>'
      + '<table class="it"><tr><th style="width:26px"></th><th>' + esc(T('rt.item')) + '</th><th class="hm">SKU</th><th class="r">' + esc(T('rt.qty')) + '</th></tr>'
      + live.map(function(i){ return '<tr><td><span class="chk"></span></td><td><b>' + esc(i.name) + '</b>' + (i.variant ? '<br><small>' + esc(i.variant) + '</small>' : '') + '</td><td class="hm">' + esc(i.sku || '—') + '</td><td class="r"><b>' + i.quantity + '</b></td></tr>'; }).join('') + '</table>'
      + '<div class="note">' + esc(T('rt.packnote')) + '</div>'
      + '<div class="label"><div class="to"><small>' + esc(T('rt.deliverto')) + '</small><br>' + addr(a) + '<br><small>' + esc(T('rt.orderno')) + ' ' + esc(o.order_number || '') + ' · ' + esc(T('rt.from')) + ' ' + esc(st.store_name || '') + '</small></div>'
      + (o.payment_method === 'cod' ? '<div class="cod"><small>' + esc(T('rt.codlabel')) + '</small>' + money(o.collect) + '</div>' : (o.payment_method ? '<div class="cod"><small>' + esc(T('rt.prepaid')) + '</small>✓</div>' : '')) + '</div>'
      + (o.payment_method === 'cod' ? '<div class="note">' + esc(T(o.single_seller ? 'rt.codnote' : 'rt.codmulti')) + '</div>' : '') + '</div>';
  } else {
    var a2 = o.delivery_address || {}, items = o.items || [];
    document.title = T('rt.receipt') + ' ' + (o.order_number || '') + ' — PawBook';
    h += '<div class="doc"><div class="dh">' + BRAND + '<div><h1>' + esc(T('rt.receipt')) + '</h1><div class="meta">' + esc(T('rt.orderno')) + ' <b>' + esc(o.order_number || o.order_id) + '</b><br>' + esc(T('rt.placed')) + ' ' + esc(dt(o.created_at)) + '<br>' + esc(T(o.payment_method === 'cod' ? 'rt.paycod' : 'rt.payother')) + '</div></div></div>'
      + '<div class="cols"><div><h3>' + esc(T('rt.billto')) + '</h3>' + addr(a2) + '</div><div><h3>' + esc(T('rt.status')) + '</h3>' + esc(T('mo.st_' + (o.state || 'pending'))) + (o.cancel_reason ? '<br><small>' + esc(o.cancel_reason) + '</small>' : '') + '</div></div>'
      + '<table class="it"><tr><th>' + esc(T('rt.item')) + '</th><th class="hm">' + esc(T('rt.seller')) + '</th><th class="r">' + esc(T('rt.qty')) + '</th><th class="r">' + esc(T('rt.price')) + '</th><th class="r">' + esc(T('rt.amount')) + '</th></tr>'
      + items.map(function(i){ var c = i.status === 'cancelled'; return '<tr' + (c ? ' style="color:#9aa0ad"' : '') + '><td>' + (c ? '<s>' : '') + esc(i.name) + (c ? '</s> <small>(' + esc(T('mo.st_cancelled')) + ')</small>' : '') + (i.variant ? '<br><small>' + esc(i.variant) + '</small>' : '') + '</td><td class="hm">' + esc(i.seller_name || i.store_name || '') + '</td><td class="r">' + i.quantity + '</td><td class="r">' + money(i.price) + '</td><td class="r">' + money(c ? 0 : i.price * i.quantity) + '</td></tr>'; }).join('') + '</table>'
      + '<div class="tot">' + (o.subtotal != null ? '<div><span>' + esc(T('c.sub')) + '</span><span>' + money(o.subtotal) + '</span></div>' : '')
      + (o.discount > 0 ? '<div><span>' + esc(T('cp.applied', {c: o.coupon_code || ''})) + '</span><span>−' + money(o.discount) + '</span></div>' : '')
      + (o.delivery_fee != null ? '<div><span>' + esc(T('c.del')) + '</span><span>' + (o.delivery_fee ? money(o.delivery_fee) : esc(T('c.freeword'))) + '</span></div>' : '')
      + '<div class="g"><span>' + esc(T('c.total')) + '</span><span>' + money(o.total) + '</span></div></div>'
      + '<div class="note">' + esc(T('rt.notinvoice')) + '</div></div>';
  }
  document.getElementById('doc').innerHTML = h;
}
function show(msg){ document.getElementById('doc').innerHTML = '<div class="err sx-card empty2"><i class="ti ti-receipt-off"></i><b>' + esc(msg) + '</b></div>'; }
if (!S.loggedIn()) location.href = '01_login.html';
else if (!OID) show(T('mo.nf'));
else S.api(AS === 'seller' ? '/shop/seller/orders/' + encodeURIComponent(OID) : AS === 'admin' ? '/shop/admin/orders/' + encodeURIComponent(OID) : '/shop/orders/' + encodeURIComponent(OID))
  .then(function(d){ D = d.order; render(); if (qs.get('print')) setTimeout(function(){ window.print(); }, 400); })
  .catch(function(e){ show(e.status === 404 ? T('mo.nf') : (e.message || T('l.err'))); });
window.addEventListener('pb:langchange', function(){ if (D) render(); });
</script>
</body>
</html>
