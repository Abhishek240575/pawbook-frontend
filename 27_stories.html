<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawBook — Stories</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
/* ── RESET EVERYTHING for this page ── */
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:'Poppins',sans-serif;background:#f0f2f5;min-height:100vh}

/* ── TOP NAV ── */
.pb-topnav{
  position:fixed;top:0;left:0;right:0;height:52px;
  background:#fff;border-bottom:1px solid #e2e8f0;
  display:flex;align-items:center;padding:0 16px;gap:12px;z-index:300;
}
.pb-topnav-back{background:none;border:none;font-size:22px;cursor:pointer;color:#1e293b;display:flex;align-items:center}
.pb-topnav-title{font-size:17px;font-weight:800;color:#1e293b;flex:1}
.pb-topnav-btn{background:#1a4db3;border:none;color:#fff;font-size:12px;font-weight:700;cursor:pointer;padding:7px 16px;border-radius:20px;font-family:'Poppins',sans-serif}

/* ── PAGE BODY ── */
.pb-page{padding-top:52px;padding-bottom:70px}

/* ══════════════════════════════════════════════
   STORY CIRCLES ROW
══════════════════════════════════════════════ */
.pb-circles-row{
  background:#fff;
  border-bottom:1.5px solid #e2e8f0;
  padding:14px 14px;
  display:flex !important;
  flex-direction:row !important;
  flex-wrap:nowrap !important;
  gap:14px;
  overflow-x:auto;
  overflow-y:visible;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  align-items:flex-start;
}
.pb-circles-row::-webkit-scrollbar{display:none}

/* Each circle item */
.pb-story-ci{
  display:flex !important;
  flex-direction:column !important;
  align-items:center;
  gap:5px;
  cursor:pointer;
  flex-shrink:0;
  width:70px;
  text-decoration:none;
}

/* Gradient ring */
.pb-story-ring{
  width:64px;
  height:64px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#bc1888);
  flex-shrink:0;
}
.pb-story-ring.seen{background:#cbd5e1}

/* Inner circle */
.pb-story-ring-inner{
  width:100%;
  height:100%;
  border-radius:50%;
  overflow:hidden;
  border:2.5px solid #fff;
  background:#eee;
}
/* Avatar image — MUST be circular */
.pb-story-ring-inner img{
  width:100% !important;
  height:100% !important;
  object-fit:cover !important;
  display:block !important;
  border-radius:0 !important;
  filter:none !important;
}

/* Name label */
.pb-story-ci-name{
  font-size:10px;
  font-weight:600;
  color:#1e293b;
  text-align:center;
  width:70px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.3;
}

/* Add Story circle */
.pb-add-circle{
  width:64px;height:64px;
  border-radius:50%;
  background:#eff6ff;
  border:2px dashed #1a4db3;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;
  position:relative;
  flex-shrink:0;
}
.pb-add-plus{
  position:absolute;bottom:0;right:0;
  width:20px;height:20px;
  background:#1a4db3;color:#fff;
  border-radius:50%;border:2px solid #fff;
  font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
}

/* ══════════════════════════════════════════════
   BROWSE GRID
══════════════════════════════════════════════ */
.pb-browse-header{
  padding:12px 16px 8px;
  font-size:14px;font-weight:800;color:#1e293b;
  background:#fff;border-bottom:1px solid #f1f5f9;
  margin-top:10px;
}
.pb-stories-grid{
  display:grid !important;
  grid-template-columns:repeat(3,1fr) !important;
  gap:3px;
  background:#111;
}
/* Each grid card */
.pb-story-card{
  position:relative;
  width:100%;
  padding-bottom:177.78%; /* 9:16 ratio */
  cursor:pointer;
  overflow:hidden;
  background:#222;
}
/* Story card image — absolute fill, sharp, no oval */
.pb-story-card-img{
  position:absolute !important;
  top:0 !important;left:0 !important;
  width:100% !important;height:100% !important;
  object-fit:cover !important;
  display:block !important;
  border-radius:0 !important;
  filter:none !important;
  -webkit-filter:none !important;
}
.pb-story-card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(transparent 55%,rgba(0,0,0,0.8));
  pointer-events:none;
}
/* Small avatar on card */
.pb-sc-av{
  position:absolute;top:8px;left:8px;
  width:32px;height:32px;
  border-radius:50%;
  overflow:hidden;
  border:2px solid #f09433;
  background:#333;
}
.pb-sc-av.seen{border-color:#94a3b8}
.pb-sc-av img{
  width:100% !important;height:100% !important;
  object-fit:cover !important;display:block !important;
}
.pb-sc-name{
  position:absolute;bottom:8px;left:8px;right:8px;
  font-size:10px;font-weight:700;color:#fff;line-height:1.3;
  text-shadow:0 1px 3px rgba(0,0,0,0.8);
}
.pb-sc-dot{
  position:absolute;top:8px;right:8px;
  width:8px;height:8px;border-radius:50%;background:#f09433;
}

/* ══════════════════════════════════════════════
   STORY VIEWER (fullscreen)
══════════════════════════════════════════════ */
#pb-viewer{
  position:fixed;inset:0;
  background:rgba(0,0,0,0.95);
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
}
.pb-sv{
  position:relative;
  width:100%;max-width:420px;
  height:100vh;
  background:#000;
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* Progress bars */
.pb-sv-prog{
  display:flex;gap:3px;
  padding:50px 10px 6px;
  flex-shrink:0;z-index:10;
}
.pb-sv-bar{
  flex:1;height:3px;
  background:rgba(255,255,255,0.3);
  border-radius:2px;overflow:hidden;
}
.pb-sv-fill{
  height:100%;background:#fff;width:0;
}
.pb-sv-fill.done{width:100%}
/* Header */
.pb-sv-head{
  display:flex;align-items:center;gap:10px;
  padding:6px 12px;flex-shrink:0;
}
.pb-sv-av{
  width:38px;height:38px;border-radius:50%;
  object-fit:cover;border:2px solid #fff;flex-shrink:0;
}
.pb-sv-name{font-size:14px;font-weight:700;color:#fff}
.pb-sv-time{font-size:11px;color:rgba(255,255,255,0.65);margin-top:1px}
.pb-sv-x{
  margin-left:auto;
  background:rgba(255,255,255,0.15);border:none;
  color:#fff;width:34px;height:34px;border-radius:50%;
  cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
}
/* Image area */
.pb-sv-img-area{
  flex:1;position:relative;overflow:hidden;background:#000;
}
#pb-sv-img{
  position:absolute !important;
  top:0 !important;left:0 !important;bottom:0 !important;right:0 !important;
  width:100% !important;height:100% !important;
  object-fit:cover !important;
  display:block !important;
  border-radius:0 !important;
  filter:none !important;
  -webkit-filter:none !important;
}
.pb-sv-caption{
  position:absolute;bottom:0;left:0;right:0;
  padding:40px 16px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,0.8));
  font-size:14px;font-weight:600;color:#fff;line-height:1.5;z-index:2;
}
.pb-sv-prev{position:absolute;left:0;top:0;width:33%;height:100%;cursor:pointer;z-index:5}
.pb-sv-next{position:absolute;right:0;top:0;width:33%;height:100%;cursor:pointer;z-index:5}
/* Footer */
.pb-sv-foot{
  padding:10px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.pb-sv-reply{
  flex:1;height:40px;border-radius:20px;
  border:1.5px solid rgba(255,255,255,0.4);
  background:rgba(255,255,255,0.08);
  color:#fff;padding:0 14px;
  font-family:'Poppins',sans-serif;font-size:13px;outline:none;
}
.pb-sv-reply::placeholder{color:rgba(255,255,255,0.45)}
.pb-sv-emoji{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;padding:4px}

@keyframes pb-float{
  0%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
  100%{opacity:0;transform:translateX(-50%) translateY(-70px) scale(1.5)}
}

/* ══════════════════════════════════════════════
   CREATE STORY MODAL
══════════════════════════════════════════════ */
#pb-create-modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:600;display:none;
  align-items:flex-end;justify-content:center;
}
.pb-create-box{
  background:#fff;border-radius:20px 20px 0 0;
  padding:20px;width:100%;max-width:500px;
}
.pb-create-preview{
  width:100%;height:200px;
  background:#f1f5f9;border-radius:12px;
  overflow:hidden;margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;cursor:pointer;
}
.pb-create-preview img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>

<script>
function goTo(p){window.location.href=p;}
function toast(msg,type){
  var bg=type==='error'?'#dc2626':type==='info'?'#6366f1':'#16a34a';
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:'+bg+';color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:700;z-index:9999;font-family:Poppins,sans-serif;white-space:nowrap;max-width:90vw;text-align:center';
  t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2500);
}
</script>

<!-- TOP NAV -->
<div class="pb-topnav">
  <button class="pb-topnav-back" onclick="goTo('07_home.html')">
    <i class="ti ti-arrow-left"></i>
  </button>
  <span class="pb-topnav-title">Stories</span>
  <button class="pb-topnav-btn" onclick="openCreate()">+ Create</button>
</div>

<div class="pb-page">

  <!-- Circles row -->
  <div class="pb-circles-row" id="pb-circles"></div>

  <!-- Grid -->
  <div class="pb-browse-header">📖 All Stories</div>
  <div class="pb-stories-grid" id="pb-grid"></div>

</div>

<!-- VIEWER -->
<div id="pb-viewer">
  <div class="pb-sv">
    <div class="pb-sv-prog" id="pb-prog"></div>
    <div class="pb-sv-head">
      <img class="pb-sv-av" id="pb-av" src="">
      <div>
        <div class="pb-sv-name" id="pb-uname"></div>
        <div class="pb-sv-time" id="pb-utime"></div>
      </div>
      <button class="pb-sv-x" onclick="closeSV()">✕</button>
    </div>
    <div class="pb-sv-img-area">
      <img id="pb-sv-img" src="" alt="">
      <div class="pb-sv-caption" id="pb-cap"></div>
      <div class="pb-sv-prev" onclick="prevSV()" title="Previous"></div>
      <div class="pb-sv-next" onclick="nextSV()" title="Next"></div>
    </div>
    <div class="pb-sv-foot">
      <input class="pb-sv-reply" placeholder="Reply to story…">
      <button class="pb-sv-emoji" onclick="floatE('❤️')">❤️</button>
      <button class="pb-sv-emoji" onclick="floatE('🐾')">🐾</button>
      <button class="pb-sv-emoji" onclick="floatE('🔥')">🔥</button>
    </div>
  </div>
</div>

<!-- CREATE MODAL -->
<div id="pb-create-modal" onclick="if(event.target===this)closeCreate()">
  <div class="pb-create-box">
    <div style="font-size:16px;font-weight:800;margin-bottom:14px">📸 Create Story</div>
    <div class="pb-create-preview" id="pb-cprev" onclick="document.getElementById('pb-cfile').click()">
      📷
      <input type="file" id="pb-cfile" accept="image/*" style="display:none" onchange="previewC(this)">
    </div>
    <input placeholder="Add a caption… 🐾" id="pb-ccap"
      style="width:100%;height:42px;border:1.5px solid #e2e8f0;border-radius:10px;padding:0 14px;font-family:'Poppins',sans-serif;font-size:13px;outline:none;margin-bottom:12px;display:block">
    <div style="display:flex;gap:8px">
      <button onclick="closeCreate()"
        style="flex:1;height:42px;border-radius:10px;border:1.5px solid #e2e8f0;background:#fff;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;cursor:pointer">Cancel</button>
      <button onclick="publishStory()"
        style="flex:2;height:42px;border-radius:10px;border:none;background:#1a4db3;color:#fff;font-family:'Poppins',sans-serif;font-size:13px;font-weight:700;cursor:pointer">Share Story</button>
    </div>
  </div>
</div>

<script>
// ── DATA ───────────────────────────────────────────────────────────────────────
var STORIES = [
  {user:'Bruno & Max',  avatar:'https://images.unsplash.com/photo-1552053831-71594a27632d?w=80&q=80',  img:'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=800&q=90',  caption:'Morning walk vibes 🐾',                  time:'2m ago',  seen:false},
  {user:'Dr. Priya',   avatar:'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=80&q=80',  img:'https://images.unsplash.com/photo-1628009368231-7bb7cfcb0def?w=800&q=90',  caption:'Vaccination drive today! Book now 🩺',  time:'15m ago', seen:false},
  {user:'Luna & Cats', avatar:'https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=80&q=80', img:'https://images.unsplash.com/photo-1573865526739-10659fec78a5?w=800&q=90', caption:'Lazy Sunday 😸',                          time:'1h ago',  seen:true},
  {user:'Delhi Pups',  avatar:'https://images.unsplash.com/photo-1583511655857-d19b40a7a54e?w=80&q=80', img:'https://images.unsplash.com/photo-1551717743-49959800b1f6?w=800&q=90',  caption:'Dog park meetup this Sunday! 🎾',        time:'2h ago',  seen:true},
  {user:'Hopeful Tails',avatar:'https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=80&q=80',  img:'https://images.unsplash.com/photo-1444212477490-ca407925329e?w=800&q=90',  caption:'5 puppies need homes! Adopt today 🏠', time:'3h ago',  seen:false},
  {user:'PawBook',     avatar:'https://images.unsplash.com/photo-1450778869180-41d0601e046e?w=80&q=80', img:'https://images.unsplash.com/photo-1576201836106-db1758fd1c97?w=800&q=90', caption:'Trending: Exotic pets care tips 🦎',     time:'5h ago',  seen:true},
];

var curIdx = 0, svTimer = null;

// ── RENDER ─────────────────────────────────────────────────────────────────────
function renderAll() { renderCircles(); renderGrid(); }

function renderCircles() {
  var row = document.getElementById('pb-circles');
  if (!row) return;
  var html = '';

  // Add Story button
  html += '<div class="pb-story-ci" onclick="openCreate()" style="cursor:pointer">' +
    '<div class="pb-add-circle">🐾<div class="pb-add-plus">+</div></div>' +
    '<div class="pb-story-ci-name">Add Story</div>' +
  '</div>';

  // Story circles
  for (var i = 0; i < STORIES.length; i++) {
    var s = STORIES[i];
    html += '<div class="pb-story-ci" onclick="openSV(' + i + ')" style="cursor:pointer">' +
      '<div class="pb-story-ring' + (s.seen ? ' seen' : '') + '">' +
        '<div class="pb-story-ring-inner">' +
          '<img src="' + s.avatar + '" alt="' + s.user + '">' +
        '</div>' +
      '</div>' +
      '<div class="pb-story-ci-name">' + s.user.split(' ')[0] + '</div>' +
    '</div>';
  }
  row.innerHTML = html;
}

function renderGrid() {
  var grid = document.getElementById('pb-grid');
  if (!grid) return;
  var html = '';
  for (var i = 0; i < STORIES.length; i++) {
    var s = STORIES[i];
    html +=
      '<div class="pb-story-card" onclick="openSV(' + i + ')">' +
        '<img class="pb-story-card-img" src="' + s.img + '" alt="' + s.user + '">' +
        '<div class="pb-story-card-overlay"></div>' +
        '<div class="pb-sc-av' + (s.seen ? ' seen' : '') + '">' +
          '<img src="' + s.avatar + '" alt="">' +
        '</div>' +
        '<div class="pb-sc-name">' + s.user + '</div>' +
        (!s.seen ? '<div class="pb-sc-dot"></div>' : '') +
      '</div>';
  }
  grid.innerHTML = html;
}

// ── VIEWER ─────────────────────────────────────────────────────────────────────
function openSV(idx) {
  curIdx = idx;
  document.getElementById('pb-viewer').style.display = 'flex';
  document.body.style.overflow = 'hidden';
  showSV(idx);
}

function showSV(idx) {
  if (idx < 0 || idx >= STORIES.length) { closeSV(); return; }
  curIdx = idx;
  var s = STORIES[idx];
  STORIES[idx].seen = true;

  document.getElementById('pb-sv-img').src = s.img;
  document.getElementById('pb-av').src = s.avatar;
  document.getElementById('pb-uname').textContent = s.user;
  document.getElementById('pb-utime').textContent = s.time;
  document.getElementById('pb-cap').textContent = s.caption;

  // Progress bars
  var bars = '';
  for (var i = 0; i < STORIES.length; i++) {
    bars += '<div class="pb-sv-bar"><div class="pb-sv-fill' + (i < idx ? ' done' : '') + '" id="pbf' + i + '"></div></div>';
  }
  document.getElementById('pb-prog').innerHTML = bars;

  // Animate bar
  clearTimeout(svTimer);
  var fill = document.getElementById('pbf' + idx);
  if (fill) {
    fill.style.transition = 'none';
    fill.style.width = '0';
    fill.offsetWidth; // force reflow
    fill.style.transition = 'width 5s linear';
    fill.style.width = '100%';
    svTimer = setTimeout(function() { nextSV(); }, 5000);
  }
}

function nextSV() {
  if (curIdx < STORIES.length - 1) showSV(curIdx + 1);
  else closeSV();
}
function prevSV() {
  if (curIdx > 0) showSV(curIdx - 1);
}
function closeSV() {
  clearTimeout(svTimer);
  document.getElementById('pb-viewer').style.display = 'none';
  document.body.style.overflow = '';
  renderAll(); // refresh seen state
}

function floatE(emoji) {
  var area = document.querySelector('.pb-sv-img-area');
  if (!area) return;
  var el = document.createElement('div');
  el.textContent = emoji;
  el.style.cssText = 'position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font-size:36px;z-index:20;pointer-events:none;animation:pb-float 1s ease-out forwards';
  area.appendChild(el);
  setTimeout(function() { el.remove(); }, 1000);
}

// Keyboard
document.addEventListener('keydown', function(e) {
  var v = document.getElementById('pb-viewer');
  if (!v || v.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') nextSV();
  else if (e.key === 'ArrowLeft') prevSV();
  else if (e.key === 'Escape') closeSV();
});

// Click outside viewer to close
document.getElementById('pb-viewer').addEventListener('click', function(e) {
  if (e.target === this) closeSV();
});

// ── CREATE STORY ───────────────────────────────────────────────────────────────
var newImg = '';

function openCreate() {
  document.getElementById('pb-create-modal').style.display = 'flex';
}
function closeCreate() {
  document.getElementById('pb-create-modal').style.display = 'none';
  document.getElementById('pb-cprev').innerHTML = '📷<input type="file" id="pb-cfile" accept="image/*" style="display:none" onchange="previewC(this)">';
  document.getElementById('pb-ccap').value = '';
  newImg = '';
}
function previewC(input) {
  if (!input.files || !input.files[0]) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    newImg = e.target.result;
    document.getElementById('pb-cprev').innerHTML =
      '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover;display:block">' +
      '<input type="file" id="pb-cfile" accept="image/*" style="display:none" onchange="previewC(this)">';
  };
  reader.readAsDataURL(input.files[0]);
}
function publishStory() {
  var cap = document.getElementById('pb-ccap').value.trim() || 'New story 🐾';
  STORIES.unshift({
    user:'You', seen:false, time:'Just now',
    avatar:'https://images.unsplash.com/photo-1552053831-71594a27632d?w=80&q=80',
    img: newImg || 'https://images.unsplash.com/photo-1587300003388-59208cc962cb?w=800&q=90',
    caption: cap
  });
  closeCreate();
  renderAll();
  toast('✅ Story shared!', 'success');
}

// ── INIT ───────────────────────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
