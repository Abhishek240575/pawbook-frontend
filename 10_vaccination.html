<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1877F2">
<meta name="robots" content="noindex">
<title>Vaccination Diary – PawBook</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* PawBook design system (same tokens as the Animal Welfare page) */
  --blue:#1877F2;--blue-d:#1a56db;--navy:#0f2057;--purple:#8b5cf6;
  --coral:#e5484d;--coral-d:#c2353a;--coral-soft:#fff1f1;
  --green:#16a34a;--amber:#f59e0b;
  --bg:#f0f4fa;--card:#fff;--line:#e4e9f2;--line2:#eef2f8;--text:#1a1f36;--muted:#65676b;--sub:#3d4560;
  --r:18px;--r-sm:12px;--pill:999px;--shadow:0 6px 24px rgba(15,32,87,.08);--nav-h:60px;
  /* soft category tints */
  --t-blue:#e8f1ff;--t-blue-d:#1a56db;--t-coral:#fff1f1;--t-coral-d:#c2353a;--t-green:#e7f7ee;--t-green-d:#15803d;
  --t-amber:#fff6e0;--t-amber-d:#b45309;--t-purple:#f1ecff;--t-purple-d:#6d4fd8;--t-teal:#e3f7f5;--t-teal-d:#0f766e;
  --grad:linear-gradient(135deg,#e5484d,#f97316);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid rgba(24,119,242,.35);outline-offset:2px}

/* ── top bar (matches the Animal Welfare page) ── */
.nav{position:sticky;top:0;z-index:400;height:var(--nav-h);background:#fff;border-bottom:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;padding:0 16px}
.nav .menu{width:38px;height:38px;border-radius:50%;border:none;background:transparent;font-size:21px;display:flex;align-items:center;justify-content:center;color:#1a3a6b}
.nav .menu:hover{background:#f0f2f5}
.logo{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:21px;font-weight:900;cursor:pointer}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-size:19px;font-style:normal}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.crumb b{color:var(--coral)}
.nav .sp{flex:1}
.nav-ic{width:38px;height:38px;border-radius:50%;border:none;background:#f0f2f5;color:#1a3a6b;font-size:19px;display:flex;align-items:center;justify-content:center}
.nav-ic:hover{background:#e4ebf7;color:var(--blue)}
.nav-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:none}
.nav-av img{width:100%;height:100%;object-fit:cover}
@media(max-width:640px){.crumb,.nav .hide-s{display:none}.logo{font-size:19px}}

/* ── layout ── */
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 120px}
.hero-band{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,#e5edff 0%,transparent 60%),linear-gradient(180deg,#f7f9ff 0%,#eef3fb 100%);margin:0 -24px;padding:0 24px}
.hero-band::before{content:'';position:absolute;inset:0;opacity:.5;background-image:radial-gradient(circle at 20px 20px,rgba(24,119,242,.07) 3px,transparent 4px);background-size:44px 44px;pointer-events:none}
.pets{position:relative;display:flex;gap:8px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none;max-width:1240px;margin:0 auto}.pets::-webkit-scrollbar{display:none}
.pchip{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:700;font-size:13.5px;color:var(--navy);flex-shrink:0;box-shadow:0 2px 8px rgba(24,119,242,.06)}
.pchip.on{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 3px rgba(24,119,242,.12)}
.pchip .av{width:32px;height:32px}
.pchip.add{padding:5px 15px;color:var(--blue-d);border-style:dashed;background:rgba(255,255,255,.7)}
.av{border-radius:50%;background:var(--t-blue);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px;padding:18px 22px 6px;flex-wrap:wrap}
.ch h2{font-size:17px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.ch h2 i{width:32px;height:32px;border-radius:10px;background:var(--t-blue);color:var(--blue);display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.ch .badge{font-size:12px;font-weight:700;padding:4px 11px;border-radius:var(--pill);background:var(--coral-soft);color:var(--coral-d)}
.cb{padding:8px 22px 22px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.sec{margin-top:18px}
.sec-title{font-size:22px;font-weight:900;color:var(--navy);margin:34px 0 4px}
.sec-sub{font-size:13.5px;color:var(--muted);margin-bottom:14px}

/* ── pet hero ── */
.hero{position:relative;max-width:1240px;margin:0 auto;padding:22px 0 64px;display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:#fff;border:1px solid #dbe4f3;color:var(--blue-d);font-size:12.5px;font-weight:700;box-shadow:0 2px 8px rgba(24,119,242,.08)}
.eyebrow i{color:var(--coral);font-size:16px}
.hero h1{font-size:48px;line-height:1.08;font-weight:900;color:var(--navy);margin:14px 0 10px;letter-spacing:-1px}
.hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tag{font-size:16px;line-height:1.6;color:var(--sub);max-width:520px}
.facts{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}
.fact{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--sub)}
.fact i{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:var(--pill)}
.st-great{background:var(--t-green);color:var(--t-green-d)}.st-ok{background:var(--t-blue);color:var(--t-blue-d)}.st-care{background:var(--t-amber);color:var(--t-amber-d)}.st-new{background:var(--t-purple);color:var(--t-purple-d)}
.collage{position:relative;display:grid;grid-template-columns:1.35fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:420px}
.collage.one{grid-template-columns:1fr}.collage.one .ph{grid-row:1/3}
.collage.two{grid-template-columns:1.35fr 1fr}.collage.two .ph{grid-row:1/3}
.ph-sample{position:absolute;left:12px;top:12px;z-index:3;padding:4px 10px;border-radius:999px;background:rgba(15,32,87,.6);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em;backdrop-filter:blur(4px)}
.px-credit{position:absolute;right:4px;bottom:-22px;font-size:10.5px;color:var(--muted)}.px-credit a{color:inherit}
.ph{position:relative;border-radius:22px;overflow:hidden;background:#dfe7f5;box-shadow:0 14px 34px rgba(15,32,87,.16)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ph:hover img{transform:scale(1.04)}
.ph-main{grid-row:1/3}
.ph::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.35));pointer-events:none}
.ph-tag{position:absolute;left:12px;bottom:12px;z-index:2;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.ph-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#e8f1ff,#f1ecff);color:var(--navy);font-weight:700;font-size:13px;text-align:center;padding:16px}
.ph-empty .e{font-size:76px;line-height:1}
.ph-empty::after{display:none}
.ph .cam{position:absolute;right:12px;top:12px;z-index:3;height:34px;padding:0 12px;border-radius:999px;border:none;background:rgba(255,255,255,.95);font-size:12.5px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:6px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.float-card{position:absolute;z-index:3;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,32,87,.2);padding:12px 14px;display:flex;align-items:center;gap:10px}
.float-1{left:-22px;bottom:30px;max-width:260px}
.float-2{right:-10px;top:-14px;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;color:var(--navy);gap:6px}
.float-2 i{color:var(--coral)}
.fc-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;flex-shrink:0}
.fc-t{font-size:13px;font-weight:800;color:var(--navy);line-height:1.3}
.fc-s{font-size:11.5px;color:var(--muted)}
@media(max-width:900px){.hero{grid-template-columns:1fr;gap:24px;padding-bottom:56px}.collage{height:300px}.float-1{left:10px;bottom:-18px}.float-2{right:8px}.hero h1{font-size:36px}}
@media(max-width:520px){.collage{height:250px;grid-template-columns:1fr}.collage .ph:not(.ph-main){display:none}.hero h1{font-size:31px}}

/* stats strip overlapping the hero (like the emergency strip) */
.stats{position:relative;z-index:5;margin-top:-34px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;display:flex;align-items:center;gap:12px}
.stat .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--navy);line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:600}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:12px}.stat .ic{width:38px;height:38px;font-size:19px}.stat b{font-size:19px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:14px;font-size:14px;font-weight:700;border:none;white-space:nowrap;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:active{transform:translateY(1px)}
.btn-o{background:var(--grad);color:#fff;box-shadow:0 8px 20px rgba(229,72,77,.3)}.btn-o:hover{filter:brightness(1.05);box-shadow:0 10px 24px rgba(229,72,77,.38)}
.btn-w{background:#fff;color:var(--navy);border:1.5px solid #dbe4f3}.btn-w:hover{border-color:var(--blue);color:var(--blue)}
.btn-b{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;box-shadow:0 8px 20px rgba(24,119,242,.26)}
.btn-s{height:36px;padding:0 14px;font-size:13px;border-radius:11px}
.btn-link{background:none;border:none;color:var(--blue);font-weight:700;font-size:13px;padding:0}
.btn[disabled]{opacity:.55;pointer-events:none}

/* wellness */
.well{display:flex;gap:20px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:30px;font-weight:900;color:var(--navy);line-height:1}
.ring .num span{font-size:11px;color:var(--muted);font-weight:600}
.well h3{font-size:18px;font-weight:800;color:var(--navy)}
.well p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.inds{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.ind{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.ind .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.ind .t{font-size:13.5px;font-weight:700;color:var(--navy)}.ind .t small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ind .bar{grid-column:2/4;height:6px;border-radius:9px;background:#edf1f8;overflow:hidden;margin-top:-4px}
.ind .bar i{display:block;height:100%;border-radius:9px}
.ind .pts{font-size:12px;font-weight:700;color:var(--muted)}
.disc{font-size:11.5px;color:var(--muted);margin-top:16px;line-height:1.55;background:#f5f7fb;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;display:flex;gap:8px}
.disc i{color:var(--blue);font-size:15px;margin-top:1px}

/* reminders */
.rems{display:flex;flex-direction:column;gap:10px}
.rem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe}
.rem .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.rem .t{flex:1;min-width:0}.rem .t b{display:block;font-size:14px;font-weight:700;color:var(--navy)}.rem .t span{font-size:12.5px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:var(--pill);white-space:nowrap}
.p-over{background:var(--coral-soft);color:var(--coral-d)}.p-soon{background:var(--t-amber);color:var(--t-amber-d)}.p-ok{background:var(--t-green);color:var(--t-green-d)}.p-info{background:var(--t-blue);color:var(--t-blue-d)}
.c-peach{background:var(--t-coral);color:var(--t-coral-d)}.c-sage{background:var(--t-green);color:var(--t-green-d)}.c-lav{background:var(--t-purple);color:var(--t-purple-d)}.c-sky{background:var(--t-blue);color:var(--t-blue-d)}.c-coral{background:var(--t-coral);color:var(--t-coral-d)}.c-amber{background:var(--t-amber);color:var(--t-amber-d)}.c-teal{background:var(--t-teal);color:var(--t-teal-d)}

/* quick actions: white cards with tinted icon tiles (like "How PawBook helps") */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1000px){.qa{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.qa{grid-template-columns:repeat(2,1fr);gap:10px}}
.qa button{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:104px;font-weight:700;font-size:13.5px;line-height:1.3;color:var(--navy);transition:transform .12s,box-shadow .12s,border-color .12s}
.qa button:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,32,87,.12);border-color:#cfdaf0}
.qa button i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}

/* tabs (segmented bar) */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:7px;background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);scrollbar-width:none;margin:30px 0 16px;position:sticky;top:calc(var(--nav-h) + 8px);z-index:50}
.tabs::-webkit-scrollbar{display:none}
.tab{height:42px;padding:0 15px;border-radius:11px;border:none;background:none;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;flex-shrink:0}
.tab i{font-size:18px}
.tab:hover{color:var(--navy);background:#f5f7fb}.tab.on{background:var(--t-blue);color:var(--blue)}
.tab.rec{margin-left:auto}.tab.rec.on{background:var(--t-purple);color:var(--t-purple-d)}
.panel{display:none}.panel.on{display:block}

/* timeline */
.month{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:20px 2px 10px;display:flex;align-items:center;gap:10px}
.month::after{content:'';flex:1;height:1px;background:var(--line)}
.month:first-child{margin-top:4px}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ev{background:#fff;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;position:relative;border:1px solid var(--line);border-top:4px solid var(--evc,#e4e9f2);box-shadow:0 2px 10px rgba(15,32,87,.04)}
.ev .top{display:flex;gap:10px;align-items:center}
.ev .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.ev b{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3}
.ev .d{font-size:12px;color:var(--muted)}
.ev .who{font-size:12.5px;font-weight:600;color:var(--sub);display:flex;gap:5px;align-items:center}
.ev p{font-size:13px;line-height:1.55;color:var(--sub)}
.ev img{width:100%;height:150px;object-fit:cover;border-radius:12px;margin-top:4px}
.ev .del{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:none;background:#f5f7fb;font-size:14px;color:var(--muted);opacity:0;transition:opacity .15s}
.ev:hover .del,.ev:focus-within .del{opacity:1}
@media(hover:none){.ev .del{opacity:.8}}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.fchip{height:32px;padding:0 13px;border-radius:var(--pill);border:1.5px solid #dbe4f3;background:#fff;font-weight:600;font-size:12.5px;color:var(--muted)}
.fchip.on{border-color:var(--blue);color:var(--blue);background:var(--t-blue)}

/* lists */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:#fbfcfe;flex-wrap:wrap}
.row .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.row .t{flex:1;min-width:160px}.row .t b{display:block;font-size:14px;font-weight:700;color:var(--navy)}.row .t span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .e{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--navy);font-size:16px;font-weight:800;margin-bottom:4px}
.empty p{font-size:13.5px;max-width:420px;margin:0 auto 14px;line-height:1.55}

/* daily wellness */
.dw{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:640px){.dw{grid-template-columns:repeat(2,1fr)}}
.dws{border-radius:16px;padding:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.dws i{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:6px}
.dws b{font-size:21px;font-weight:900;color:var(--navy);line-height:1.1}.dws span{font-size:12.5px;font-weight:600;color:var(--sub)}
.dws small{font-size:11.5px;color:var(--muted)}
button.dws:hover{border-color:#cfdaf0;box-shadow:var(--shadow)}
.week{display:flex;align-items:flex-end;gap:8px;height:130px;margin-top:14px;padding:0 2px}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk .b{width:100%;max-width:36px;border-radius:8px 8px 4px 4px;background:#cfe0fb;min-height:4px}
.wk.today .b{background:linear-gradient(180deg,var(--blue),var(--purple))}
.wk span{font-size:11.5px;font-weight:600;color:var(--muted)}.wk em{font-style:normal;font-size:11px;font-weight:700;color:var(--navy)}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

function rel(n){ return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n === -1 ? 'yesterday' : n > 0 ? 'in ' + n + ' days' : Math.abs(n) + ' days ago'; }
function cap(s){ s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
var SPECIES = {dog: '🐕', cat: '🐈', bird: '🦜', rabbit: '🐇', fish: '🐠', hamster: '🐹', turtle: '🐢', horse: '🐴'};
function emo(p){ var k = String((p && p.species) || '').toLowerCase(); return SPECIES[k] || SPECIES[/dog|canine|puppy/.test(k) ? 'dog' : /cat|feline|kitten/.test(k) ? 'cat' : ''] || '🐾'; }
function avatar(p){ return '<div class="av">' + (p && p.photo ? '<img src="' + esc(p.photo) + '" alt="' + esc(p.name) + '" onerror="this.parentNode.textContent=\'' + emo(p) + '\'">' : emo(p)) + '</div>'; }
function him(p){ var g = String((p && p.gender) || '').toLowerCase(); return g === 'male' ? ['he', 'his', 'him'] : g === 'female' ? ['she', 'her', 'her'] : ['they', 'their', 'them']; }
function emptyBox(e, t, p, btn){ return '<div class="empty"><div class="e">' + e + '</div><b>' + esc(t) + '</b>' + (p ? '<p>' + esc(p) + '</p>' : '') + (btn || '') + '</div>'; }
function P(){ return '/petcare/pets/' + encodeURIComponent(PID); }

/* status + vaccine look */
var ST = {up_to_date: ['p-ok', 'Up to date', 'ti-shield-check', 'c-sage', '#16a34a'], recorded: ['p-ok', 'Recorded', 'ti-circle-check', 'c-sage', '#16a34a'],
  due_soon: ['p-soon', 'Due soon', 'ti-clock', 'c-amber', '#f59e0b'], overdue: ['p-over', 'Overdue', 'ti-alert-circle', 'c-coral', '#e5484d'],
  check: ['p-chk', 'Check with vet', 'ti-help-circle', 'c-sky', '#1877F2'], not_recorded: ['p-none', 'Not recorded', 'ti-circle-dashed', 'c-grey', '#cfd6e4']};
var VX = {rabies: ['ti-shield-heart', 'c-coral'], dhpp: ['ti-vaccine', 'c-sky'], lepto: ['ti-droplet', 'c-teal'], kennel: ['ti-wind', 'c-lav'], civ: ['ti-virus', 'c-amber'], fvrcp: ['ti-vaccine', 'c-sky'], felv: ['ti-shield', 'c-lav']};
function vx(c){ return VX[c.key] || ['ti-vaccine-bottle', 'c-peach']; }
var ORDER = {overdue: 0, due_soon: 1, up_to_date: 2, recorded: 2, check: 3, not_recorded: 4};

/* ---------- load ---------- */
function boot(){
  if (!TOKEN) { location.href = '01_login.html'; return; }
  api('/petcare/pets').then(function(d){
    PETS = d.pets || [];
    if (!PETS.length) return renderWelcome();
    var saved = null; try { saved = localStorage.getItem('pb_health_pet'); } catch (e) {}
    var q = new URLSearchParams(location.search).get('pet');
    PID = [q, saved].filter(function(x){ return x && PETS.some(function(p){ return String(p.id) === String(x); }); })[0] || String(PETS[0].id);
    var t = new URLSearchParams(location.search).get('tab'); if (['diary', 'guide', 'india', 'certs', 'reminders'].indexOf(t) >= 0) TAB = t;
    loadPet();
  }).catch(function(e){ if (e.status === 401) return fail(e); document.getElementById('app').innerHTML = emptyBox('🐾', 'Could not load your pets', (e.message || '') + ' Please refresh in a moment.'); });
}
function loadPet(){
  try { localStorage.setItem('pb_health_pet', PID); } catch (e) {}
  return api(P() + '/vaccines').then(function(d){ V = d; render(); }).catch(fail);
}
function pickPet(id){ if (String(id) === String(PID)) return; PID = String(id); OPEN = {}; document.getElementById('app').style.opacity = '.55'; loadPet().then(function(){ document.getElementById('app').style.opacity = ''; }); }

/* sample photos (PawBook's own image set), shown only while a pet has no photo of its own */
function spKey(p){ var s = String((p && p.species) || '').toLowerCase(); return /dog|canine|puppy|pup\b/.test(s) ? 'dog' : /cat|feline|kitten/.test(s) ? 'cat' : s; }
var SAMPLE_IMG = {'dog-run': 'Playtime in the park', 'dog-sunset': 'Golden hour', 'dog-cat': 'Best friends', 'dog-lab': 'Happy & healthy', 'dog-lab-face': 'All smiles', 'dog-puppy': 'Puppy days', 'cat-kitten': 'Bright eyes', 'cat-ginger': 'Curious & cared for'};
var SAMPLE_SETS = {dog: {main: ['dog-run', 'dog-sunset', 'dog-cat'], side: ['dog-lab-face', 'dog-puppy', 'dog-lab', 'dog-sunset', 'dog-cat', 'dog-run']},
  cat: {main: ['cat-kitten', 'dog-cat'], side: ['cat-ginger', 'dog-cat', 'cat-kitten']}, other: {main: ['dog-cat', 'dog-run'], side: ['cat-kitten', 'dog-puppy', 'cat-ginger', 'dog-sunset']}};
var SAMPLE_POS = {'dog-puppy': '50% 12%', 'dog-lab': '50% 30%', 'cat-ginger': '50% 25%'};
function imgPos(u){ var m = /img\/pets\/([\w-]+)\.jpg$/.exec(u || ''); return (m && SAMPLE_POS[m[1]]) || 'center'; }
function sampleSet(p){
  var set = SAMPLE_SETS[spKey(p)] || SAMPLE_SETS.other, id = String((p && p.id) || ''), h = 0; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  var main = set.main[h % set.main.length], out = [main], side = set.side.filter(function(x){ return x !== main; });
  for (var j = 0; out.length < 3 && j < side.length; j++) out.push(side[(h + j) % side.length]);
  out = out.filter(function(x, k){ return out.indexOf(x) === k; });
  return out.map(function(n){ return ['img/pets/' + n + '.jpg', SAMPLE_IMG[n]]; });
}
function petPhotos(p){ var l = [], add = function(u){ if (u && /^https:\/\//.test(u) && l.indexOf(u) < 0) l.push(u); }; add(p.photo); (p.photos || []).forEach(add); return l.slice(0, 3); }

function renderWelcome(){
  document.getElementById('app').innerHTML = '<div class="hero-band"><section class="hero"><div><span class="eyebrow"><i class="ti ti-vaccine"></i>Vaccination diary</span>'
    + '<h1>Every vaccine,<br><span class="accent">one happy diary.</span></h1><p class="tag">Add your pet on the Pet Health page, then keep every vaccination, booster date and certificate together here.</p>'
    + '<div class="hero-ctas"><button class="btn btn-o" onclick="location.href=\'36_pet_life_record.html\'"><i class="ti ti-plus"></i>Add my pet</button><button class="btn btn-w" onclick="location.href=\'11_vet_booking.html\'"><i class="ti ti-stethoscope"></i>Find a vet</button></div></div>'
    + '<div class="collage">' + sampleSet(null).map(function(x, i){ return '<div class="ph' + (i ? '' : ' ph-main') + '"><img src="' + esc(x[0]) + '" style="object-position:' + imgPos(x[0]) + '" alt="" loading="' + (i ? 'lazy' : 'eager') + '" onerror="this.parentNode.style.display=\'none\'"><span class="ph-tag"><i class="ti ti-heart"></i>' + esc(x[1]) + '</span></div>'; }).join('')
    + '<div class="float-card float-1"><span class="fc-ic c-sky"><i class="ti ti-vaccine" style="font-size:20px"></i></span><div><div class="fc-t">Boosters on time</div><div class="fc-s">Reminders before each due date</div></div></div>'
    + '</div></section></div>';
}

/* ---------- render ---------- */
function render(){
  var p = V.pet, pr = him(p), cv = V.coverage || {}, cards = V.cards || [], h = '';
  document.title = p.name + "'s vaccination diary – PawBook";
  var cnt = {over: cards.filter(function(c){ return c.status === 'overdue'; }).length, soon: cards.filter(function(c){ return c.status === 'due_soon'; }).length, ok: cards.filter(function(c){ return c.status === 'up_to_date' || c.status === 'recorded'; }).length};
  var st = !V.records ? ['st-new', 'ti-sparkles', 'No records yet'] : cnt.over ? ['st-care', 'ti-alert-circle', cnt.over + ' vaccine' + (cnt.over > 1 ? 's' : '') + ' overdue'] : ['st-great', 'ti-shield-check', 'Vaccination records active'];
  h += '<div class="hero-band"><div class="pets" role="tablist" aria-label="Your pets">' + PETS.map(function(x){ var on = String(x.id) === String(PID);
    return '<button class="pchip' + (on ? ' on' : '') + '" role="tab" aria-selected="' + on + '" onclick="pickPet(\'' + esc(x.id) + '\')">' + avatar(x) + esc(x.name) + '</button>'; }).join('')
    + '<button class="pchip add no-print" onclick="location.href=\'36_pet_life_record.html\'"><i class="ti ti-plus"></i> Add pet</button></div>';
  var g = String(p.gender || ''), facts = [[p.breed || cap(p.species) || 'Pet', 'ti-paw', 'c-sky'], [p.age_label, 'ti-cake', 'c-amber'], [g && g !== 'unknown' ? cap(g) : '', g === 'female' ? 'ti-gender-female' : 'ti-gender-male', 'c-lav']].filter(function(f){ return f[0]; });
  var tag = V.records ? 'Keeping ' + p.name + ' protected and healthy! ' + V.records + ' vaccination record' + (V.records > 1 ? 's' : '') + ' saved.' : 'Start ' + p.name + '\'s diary by adding the vaccines from ' + pr[1] + ' vaccination card.';
  h += '<section class="hero" aria-label="' + esc(p.name) + ' vaccinations"><div><span class="eyebrow"><i class="ti ti-vaccine"></i>Vaccination diary</span>'
    + '<h1>' + esc(p.name) + '\'s vaccination<br><span class="accent">journey.</span></h1><p class="tag">' + esc(tag) + '</p>'
    + '<div class="hero-ctas no-print"><button class="btn btn-o" onclick="openForm(\'vaccine\')"><i class="ti ti-plus"></i>Log vaccine</button><button class="btn btn-w" onclick="location.href=\'11_vet_booking.html\'"><i class="ti ti-stethoscope"></i>Book a vet</button><button class="btn btn-w" onclick="openCard()"><i class="ti ti-id-badge-2"></i><span>Vaccination record</span></button></div>'
    + '<div class="facts">' + facts.map(function(f){ return '<span class="fact"><i class="ti ' + f[1] + ' ' + f[2] + '"></i>' + esc(f[0]) + '</span>'; }).join('') + '<span class="status ' + st[0] + '"><i class="ti ' + st[1] + '"></i>' + esc(st[2]) + '</span></div></div>';
  // collage
  var ph = petPhotos(p), tags = ['Hello, ' + p.name + '!', 'Happy moments', 'Protected & loved'], smp = !ph.length;
  if (smp) { var sm = sampleSet(p); ph = sm.map(function(x){ return x[0]; }); tags = sm.map(function(x){ return x[1]; }); }
  var cam = '<button class="cam no-print" onclick="pickPhoto()"><i class="ti ti-camera"></i>' + (smp ? 'Add ' + esc(p.name) + '\'s photo' : 'Change photo') + '</button>';
  var col = ph.map(function(u, i){ return '<div class="ph' + (i === 0 && ph.length === 3 ? ' ph-main' : '') + '"><img src="' + esc(u) + '" style="object-position:' + imgPos(u) + '" alt="' + esc(p.name) + '" loading="' + (i ? 'lazy' : 'eager') + '" onerror="this.parentNode.classList.add(\'ph-empty\');this.outerHTML=\'<div class=e>' + emo(p) + '</div>\'">' + (smp ? '<span class="ph-sample">Sample photo</span>' : '') + '<span class="ph-tag"><i class="ti ti-heart"></i>' + esc(tags[i]) + '</span>' + (i === 0 ? cam : '') + '</div>'; }).join('');
  var nextR = (V.reminders || [])[0];
  var f1 = cv.applies ? '<span class="fc-ic ' + (cv.current === cv.total ? 'c-sage' : cv.current ? 'c-amber' : 'c-coral') + '">' + cv.current + '/' + cv.total + '</span><div><div class="fc-t">Core vaccines current</div><div class="fc-s">' + (cv.current === cv.total ? 'Great protection!' : 'See what\'s missing below') + '</div></div>'
    : '<span class="fc-ic c-sky"><i class="ti ti-notebook" style="font-size:20px"></i></span><div><div class="fc-t">' + (V.records || 0) + ' record' + (V.records === 1 ? '' : 's') + ' saved</div><div class="fc-s">Ask your vet for ' + esc(p.name) + '\'s schedule</div></div>';
  h += '<div class="collage' + (ph.length <= 1 ? ' one' : ph.length === 2 ? ' two' : '') + '">' + col + '<div class="float-card float-1">' + f1 + '</div>'
    + '<div class="float-card float-2"><i class="ti ti-' + (nextR ? 'bell-ringing' : 'circle-check') + '"></i>' + esc(nextR ? nextR.label.split(' (')[0] + ' · ' + (nextR.days < 0 ? 'overdue' : 'due ' + fd(nextR.next_due, {day: 'numeric', month: 'short'})) : 'No vaccines due') + '</div></div></section></div>';
  // stats
  h += '<div class="stats">' + [['c-sage', 'ti-shield-check', cnt.ok, 'Up to date'], ['c-amber', 'ti-clock', cnt.soon, 'Due soon'], ['c-coral', 'ti-alert-circle', cnt.over, 'Overdue'], ['c-sky', 'ti-notebook', V.records || 0, 'Records saved']]
    .map(function(s){ return '<div class="stat"><span class="ic ' + s[0] + '"><i class="ti ' + s[1] + '"></i></span><div><b>' + s[2] + '</b><span>' + s[3] + '</span></div></div>'; }).join('') + '</div>';
  // protection + reminders
  h += '<div class="grid sec" style="margin-top:22px">' + protectHTML(p) + remHTML(p) + '</div>';
  // quick actions
  h += '<h2 class="sec-title no-print">Let\'s take care of ' + esc(p.name) + '</h2><p class="sec-sub no-print">Everything for ' + esc(p.name) + '\'s vaccinations in one tap</p><section class="no-print" aria-label="Quick actions"><div class="qa q4">' + [
    ['c-coral', 'ti-vaccine', 'Log vaccine', 'Record a new vaccination', "openForm('vaccine')"], ['c-sage', 'ti-stethoscope', 'Book a vet', 'Schedule a check-up', "location.href='11_vet_booking.html'"],
    ['c-lav', 'ti-id-badge-2', 'Health passport', 'View ' + p.name + '\'s health card', "location.href='36_pet_life_record.html?pet=" + encodeURIComponent(PID) + "&card=1'"], ['c-amber', 'ti-bell', 'Reminders', 'Manage vaccine alerts', "setTab('reminders',1)"]
  ].map(function(a){ return '<button onclick="' + a[4] + '"><i class="ti ' + a[1] + ' ' + a[0] + '"></i>' + esc(a[2]) + '<small>' + esc(a[3]) + '</small></button>'; }).join('') + '</div></section>';
  // tabs
  var TABS = [['diary', 'ti-notebook', 'Vaccine diary'], ['guide', 'ti-paw', 'Breed guide'], ['india', 'ti-map-pin-heart', 'India guidelines'], ['certs', 'ti-certificate', 'Certificates'], ['reminders', 'ti-bell', 'Reminders']];
  h += '<div class="tabs no-print" id="tabs" role="tablist">' + TABS.map(function(t){ return '<button class="tab' + (TAB === t[0] ? ' on' : '') + '" role="tab" aria-selected="' + (TAB === t[0]) + '" onclick="setTab(\'' + t[0] + '\')"><i class="ti ' + t[1] + '"></i>' + t[2] + '</button>'; }).join('') + '</div>';
  h += '<div id="panels">' + panels() + '</div>';
  document.getElementById('app').innerHTML = h;
  animateRing();
}
function setTab(t, scroll){ TAB = t; document.querySelectorAll('.tab').forEach(function(b){ var on = b.getAttribute('onclick').indexOf("'" + t + "'") > 0; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); }); document.getElementById('panels').innerHTML = panels(); if (scroll) { var tb = document.getElementById('tabs'); if (tb) window.scrollTo({top: tb.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth'}); } }
function panels(){ var p = V.pet; switch (TAB) { case 'guide': return guidePanel(p); case 'india': return indiaPanel(p); case 'certs': return certPanel(p); case 'reminders': return remPanel(p); default: return diaryPanel(p); } }

/* protection progress */
function protectHTML(p){
  var cv = V.coverage || {}, h = '<section class="card"><div class="ch"><h2><i class="ti ti-shield-heart"></i>' + esc(p.name) + '\'s protection progress</h2></div><div class="cb">';
  if (!cv.applies) return h + emptyBox(emo(p), 'Ask your vet about ' + p.name + '\'s vaccines', 'We only show a vaccine plan for dogs and cats, based on published veterinary guidelines. Your vet will advise what ' + p.name + ' needs, and you can still keep every record here.', '<button class="btn btn-o btn-s" onclick="openForm(\'vaccine\')"><i class="ti ti-plus"></i>Log vaccine</button>') + '</div></section>';
  var pc = cv.percent, col = pc >= 100 ? '#16a34a' : pc > 0 ? '#f59e0b' : '#e5484d', c = 2 * Math.PI * 50;
  var msg = !V.records ? 'Let\'s start ' + p.name + '\'s diary' : pc >= 100 ? p.name + ' is protected!' : pc > 0 ? 'Almost there' : 'Let\'s catch up';
  var k = cv.counts || {};

    + '<div><h3>' + esc(msg) + '</h3><p>' + cv.current + ' of ' + cv.total + ' core vaccines are current for ' + esc(p.name) + '. ' + (pc >= 100 ? 'Keep the boosters on time.' : 'Your vet can help with the rest.') + '</p></div></div>';
  h += '<div class="legend"><span><b class="c-sage">' + (k.up_to_date || 0) + '</b>Up to date</span><span><b class="c-amber">' + (k.due_soon || 0) + '</b>Due soon</span><span><b class="c-coral">' + (k.overdue || 0) + '</b>Overdue</span></div>';
  h += '<div class="core">' + cv.items.map(function(it){ var s = ST[it.status] || ST.not_recorded, ic = vx(it); return '<div class="row"><span class="ic ' + ic[1] + '"><i class="ti ' + ic[0] + '"></i></span><div class="t"><b>' + esc(it.label) + '</b><span>Core vaccine</span></div><span class="pill ' + s[0] + '">' + s[1] + '</span></div>'; }).join('') + '</div>';
  if (cv.young) h += '<div class="young"><i class="ti ti-baby-carriage"></i><div><b>' + (V.species_key === 'cat' ? 'Kitten' : 'Puppy') + ' series:</b> young pets get several core doses 2–4 weeks apart, the last at 16 weeks or older, then a booster at about 6 months. Your vet sets the exact dates.</div></div>';
  h += '<div class="disc"><i class="ti ti-info-circle"></i><span>“Core” follows the <a href="https://wsava.org/wp-content/uploads/2024/05/2024-Guidelines-for-the-Vaccination-of-Dogs-and-Cats.pdf" target="_blank" rel="noopener" style="color:var(--blue);font-weight:700">WSAVA 2024 vaccination guidelines</a>, with rabies included because rabies is present in India. Other vaccines depend on ' + esc(p.name) + '\'s lifestyle. Based only on the records you saved — not a veterinary assessment.</span></div>';
  return h + '</div></section>';
}
function animateRing(){ var r = document.getElementById('ring'); if (!r) return; requestAnimationFrame(function(){ requestAnimationFrame(function(){ r.style.strokeDashoffset = r.getAttribute('data-off'); }); }); }

/* reminders card */
function remLine(r){ return r.days < 0 ? 'Was due ' + fd(r.next_due) + ' · please book a vet visit' : r.days <= (V.lead_days || 30) ? 'Due ' + fd(r.next_due) + ' · ' + rel(r.days) : 'Due ' + fd(r.next_due); }
function remPill(r){ return r.days < 0 ? '<span class="pill p-over">Overdue</span>' : r.status === 'due_soon' ? '<span class="pill p-soon">' + (r.days === 0 ? 'Today' : r.days + ' day' + (r.days === 1 ? '' : 's')) + '</span>' : '<span class="pill p-ok">On track</span>'; }
function remRow(r, act){ var ic = vx(r); return '<div class="rem' + (r.days < 0 ? ' over' : r.status === 'due_soon' ? ' soon' : '') + '"><span class="ic ' + ic[1] + '"><i class="ti ' + ic[0] + '"></i></span><div class="t"><b>' + esc(r.label) + '</b><span>' + esc(remLine(r)) + '</span></div><div class="act">' + remPill(r) + (act && r.status !== 'up_to_date' ? '<button class="btn btn-w btn-s no-print" onclick="location.href=\'11_vet_booking.html\'">Book</button>' : '') + '</div></div>'; }
function remHTML(p){
  var l = V.reminders || [], due = l.filter(function(r){ return r.status !== 'up_to_date'; }).length;
  var h = '<section class="card"><div class="ch"><h2><i class="ti ti-paw"></i>' + esc(p.name) + '\'s vaccine reminders</h2>' + (due ? '<span class="badge">' + due + ' need' + (due === 1 ? 's' : '') + ' attention</span>' : '') + '</div><div class="cb">';
  if (!l.length) return h + emptyBox('🔔', 'No dates to remember yet', 'Add the “next due” date from ' + p.name + '\'s vaccination card and we\'ll remind you ' + (V.lead_days || 30) + ' days before.', '<button class="btn btn-o btn-s" onclick="openForm(\'vaccine\')"><i class="ti ti-plus"></i>Log vaccine</button>') + '</div></section>';
  return h + '<div class="rems">' + l.slice(0, 5).map(function(r){ return remRow(r, true); }).join('') + '</div>' + (l.length > 5 ? '<div style="margin-top:12px"><button class="btn-link" onclick="setTab(\'reminders\',1)">See all ' + l.length + ' reminders</button></div>' : '') + '</div></section>';
}

/* ---------- vaccine diary ---------- */
function diaryPanel(p){
  var cards = (V.cards || []).slice().sort(function(a, b){ return (ORDER[a.status] - ORDER[b.status]) || ((b.core ? 1 : 0) - (a.core ? 1 : 0)); });
  var h = '<section class="card"><div class="ch"><h2><i class="ti ti-notebook"></i>' + esc(p.name) + '\'s vaccination records</h2><span class="badge" style="background:var(--t-blue);color:var(--t-blue-d)">' + (V.records || 0) + ' recorded</span><button class="btn btn-o btn-s no-print" onclick="openForm(\'vaccine\')"><i class="ti ti-plus"></i>Log vaccine</button></div><div class="cb">';
  if (!cards.length) h += emptyBox('💉', p.name + '\'s diary is ready', 'Add each vaccine from ' + him(p)[1] + ' vaccination card — the date given, the next due date and the vet. Certificates can be attached too.', '<button class="btn btn-o btn-s" onclick="openForm(\'vaccine\')"><i class="ti ti-plus"></i>Log first vaccine</button>');
  else h += '<div class="vgrid">' + cards.map(vCard).join('') + '</div>';
  h += histHTML() + '</div></section>';
  return h;
}
function vCard(c){

    + fl('Reactions (optional)', inp('reaction', 'text', e.reaction, 'maxlength="300" placeholder="e.g. Sleepy for a day, small lump"'), 'reaction')
    + fl('Notes (optional)', inp('notes', 'text', e.notes, 'maxlength="300"'), 'notes') }; },
  cert: function(o){ o = o || {}; var recs = []; (V.cards || []).forEach(function(c){ c.doses.forEach(function(d){ if (!d.also) recs.push(d); }); });
    return {title: 'Upload a certificate', save: 'Upload', body: fl('Title (optional)', inp('title', 'text', '', 'maxlength="120" placeholder="e.g. Rabies certificate 2026"'), 'title')
    + (recs.length ? fl('For which vaccination? (optional)', '<select class="fi" name="vid"><option value="">Not linked</option>' + recs.map(function(d){ return '<option value="' + esc(d.id) + '"' + (o.vid === d.id ? ' selected' : '') + '>' + esc(d.name + ' · ' + fd(d.given)) + '</option>'; }).join('') + '</select>', 'vid') : '')
    + fl('File', '<input class="fi" name="file" type="file" accept="image/jpeg,image/png,application/pdf" required style="padding:9px">', 'file', 'Please choose a JPG, PNG or PDF up to 5 MB', 'Stored privately — only you can open it.') }; }
};
function openForm(kind, o){
  if (!V) return;
  var f = FORMS[kind](o); MO = {kind: kind, o: o || {}};
  document.getElementById('mo-title').textContent = f.title; document.getElementById('mo-body').innerHTML = f.body; document.querySelector('#mo-save span').textContent = f.save;
  var sel = document.querySelector('#mo-body select[name=cert_doc_id]'); if (sel) sel.onchange = function(){ var fi = document.querySelector('#mo-body input[name=file]'); fi.style.display = sel.value === 'new' ? '' : 'none'; };
  document.getElementById('mo').classList.add('open'); document.body.style.overflow = 'hidden';
  setTimeout(function(){ var i = document.querySelector('#mo-body input:not([type=radio]):not([type=hidden])'); if (i && window.innerWidth > 640) i.focus(); }, 60);
}
function closeMo(){ document.getElementById('mo').classList.remove('open'); document.body.style.overflow = ''; MO = null; }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') { closeMo(); closeCard(); } });
function val(f, n){ var e = f.elements[n]; if (!e) return ''; if (e.length && e[0] && e[0].type === 'radio') { for (var i = 0; i < e.length; i++) if (e[i].checked) return e[i].value; return ''; } return (e.value || '').trim(); }
function mark(f, keys){ f.querySelectorAll('.fl').forEach(function(l){ l.classList.toggle('bad', keys.indexOf(l.getAttribute('data-f')) >= 0); }); var b = f.querySelector('.fl.bad .fi'); if (b) b.focus(); }
function okFile(file){ return file && file.size <= 5 * 1024 * 1024 && /^(image\/(jpeg|png)|application\/pdf)$/.test(file.type); }
function upCert(file, title){ var fd2 = new FormData(); fd2.append('doc_kind', 'certificate'); fd2.append('title', title || ''); fd2.append('file', file); return api(P() + '/documents', {method: 'POST', body: fd2}).then(function(d){ return String(d.doc_id); }); }
function submitMo(e){
  e.preventDefault(); if (!MO) return; var f = e.target, k = MO.kind, btn = document.getElementById('mo-save'), bad = [];
  var done = function(msg){ closeMo(); toast(msg); return loadPet(); }, err = function(x){ if (x.fields) mark(f, x.fields.map(function(n){ return n === 'file' ? 'cert_doc_id' : n; })); fail(x); };
  if (k === 'cert') {
    var file = f.elements.file.files[0]; if (!okFile(file)) bad.push('file'); if (bad.length) return mark(f, bad);
    var vid = val(f, 'vid'); btn.disabled = true;
    return upCert(file, val(f, 'title')).then(function(id){ return vid ? api(P() + '/vaccinations/' + encodeURIComponent(vid), {method: 'PATCH', body: {cert_doc_id: id}}) : null; })
      .then(function(){ TAB = 'certs'; return done('Certificate saved privately'); }).catch(err).then(function(){ btn.disabled = false; });
  }
  var b = {name: val(f, 'name'), dose_label: val(f, 'dose_label'), given_date: val(f, 'given_date'), next_due_date: val(f, 'next_due_date'), vet_name: val(f, 'vet_name'), clinic: val(f, 'clinic'), brand: val(f, 'brand'), manufacturer: val(f, 'manufacturer'), batch_number: val(f, 'batch_number'), reaction: val(f, 'reaction'), notes: val(f, 'notes'), cert_doc_id: val(f, 'cert_doc_id')};
  if (!b.name) bad.push('name'); if (!b.given_date || b.given_date > today()) bad.push('given_date'); if (b.next_due_date && b.next_due_date <= b.given_date) bad.push('next_due_date');
  var nf = b.cert_doc_id === 'new' ? f.elements.file.files[0] : null; if (b.cert_doc_id === 'new' && !okFile(nf)) bad.push('cert_doc_id');
  if (bad.length) return mark(f, bad);
  btn.disabled = true;
  var isEdit = !!MO.o.edit;
  (nf ? upCert(nf, b.name + ' certificate') : Promise.resolve(b.cert_doc_id || null)).then(function(cid){
    b.cert_doc_id = cid; b.next_due_date = b.next_due_date || null;
    return isEdit ? api(P() + '/vaccinations/' + encodeURIComponent(MO.o.edit.id), {method: 'PATCH', body: b}) : api(P() + '/vaccinations', {method: 'POST', body: b});
  }).then(function(){ return done(isEdit ? 'Changes saved' : 'Vaccination saved'); }).catch(err).then(function(){ btn.disabled = false; });
}
function viewDoc(id){ var w = window.open('', '_blank'); fetch(API + '/petcare/documents/' + encodeURIComponent(id), {headers: {Authorization: 'Bearer ' + TOKEN}}).then(function(r){ if (!r.ok) throw new Error('Could not open the document'); return r.blob(); }).then(function(b){ var u = URL.createObjectURL(b); if (w) w.location = u; else location.href = u; setTimeout(function(){ URL.revokeObjectURL(u); }, 60000); }).catch(function(e){ if (w) w.close(); fail(e); }); }
function delDoc(id, btn){ if (btn.getAttribute('data-sure') !== '1') { btn.setAttribute('data-sure', '1'); btn.innerHTML = '<i class="ti ti-check"></i>'; toast('Tap again to delete'); return; } btn.disabled = true; api('/petcare/documents/' + encodeURIComponent(id), {method: 'DELETE'}).then(function(){ toast('Deleted'); loadPet(); }).catch(function(e){ btn.disabled = false; fail(e); }); }
function upPhoto(file){ if (file.size > 10 * 1024 * 1024) return Promise.reject(new Error('Photo is larger than 10 MB')); var fd2 = new FormData(); fd2.append('file', file); return api('/media/upload', {method: 'POST', body: fd2}).then(function(d){ return d.url || d.secure_url || (d.file && d.file.url) || (d.media && d.media.url) || null; }); }
function pickPhoto(){ var i = document.getElementById('photo-in'); i.value = ''; i.onchange = function(){ var f = i.files[0]; if (!f) return; toast('Uploading photo…'); upPhoto(f).then(function(url){ if (!url) throw new Error('Upload failed'); return api(P(), {method: 'PATCH', body: {photo_url: url}}); }).then(function(){ toast('Photo updated'); return api('/petcare/pets').then(function(x){ PETS = x.pets || []; return loadPet(); }); }).catch(fail); }; i.click(); }

/* ---------- printable vaccination record ---------- */
function latestList(){ return (V.cards || []).filter(function(c){ return c.latest; }).map(function(c){ return c; }); }
function cardText(){
  var p = V.pet, l = latestList();
  return p.name + "'s vaccination record (PawBook)\n" + [p.breed || cap(p.species), p.age_label, p.gender && p.gender !== 'unknown' ? cap(p.gender) : ''].filter(Boolean).join(' · ') + '\n\n'
    + (l.length ? l.map(function(c){ var d = c.latest; return '• ' + d.name + ' — given ' + fd(d.given) + (d.next_due ? ', next due ' + fd(d.next_due) : '') + (d.vet || d.clinic ? ' (' + [d.vet, d.clinic].filter(Boolean).join(', ') + ')' : '') + (d.batch ? ' · batch ' + d.batch : ''); }).join('\n') : '• No vaccinations recorded')
    + '\n\nRecorded by the owner in PawBook. Not an official certificate.';
}
function openCard(){
  if (!V) return; var p = V.pet, l = latestList();
  document.getElementById('card-title').textContent = p.name + "'s vaccination record";
  document.getElementById('card-body').innerHTML = '<div class="hcard"><div class="top">' + avatar(p) + '<div><h4>' + esc(p.name) + '</h4><div class="muted" style="font-weight:600;font-size:13px">' + esc([p.breed || cap(p.species), p.age_label, p.gender && p.gender !== 'unknown' ? cap(p.gender) : ''].filter(Boolean).join(' · ')) + '</div></div></div>'
    + (l.length ? '<table class="sumt"><thead><tr><th>Vaccine</th><th>Given</th><th>Next due</th><th>Vet / batch</th></tr></thead><tbody>' + l.map(function(c){ var d = c.latest, s = ST[c.status] || ST.recorded;
      return '<tr><td><b>' + esc(d.name) + '</b>' + (d.brand && d.brand !== d.name ? '<br><span class="muted">' + esc(d.brand) + '</span>' : '') + '</td><td>' + esc(fd(d.given)) + '</td><td>' + (d.next_due ? esc(fd(d.next_due)) + (c.status === 'overdue' ? ' <b style="color:#c2353a">(overdue)</b>' : '') : '—') + '</td><td>' + esc([d.vet, d.clinic].filter(Boolean).join(', ') || '—') + (d.batch ? '<br><span class="muted">Batch ' + esc(d.batch) + '</span>' : '') + '</td></tr>'; }).join('') + '</tbody></table>'
      : '<div class="muted" style="font-size:13px;margin-top:12px">No vaccinations recorded yet.</div>')
    + '<div class="disc" style="background:rgba(255,255,255,.7)">Recorded by the owner in PawBook on ' + esc(fd(new Date().toISOString())) + '. Not an official certificate — for travel or registration, carry the vet-signed card.</div></div>';
  document.getElementById('cardModal').classList.add('open'); document.body.style.overflow = 'hidden';
}
function closeCard(){ document.getElementById('cardModal').classList.remove('open'); document.body.style.overflow = ''; }
function printCard(){ document.body.classList.add('print-card'); window.print(); setTimeout(function(){ document.body.classList.remove('print-card'); }, 500); }
function shareCardWA(){ window.open('https://wa.me/?text=' + encodeURIComponent(cardText()), '_blank', 'noopener'); }
