<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PawBook — Discover</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f2f5;-webkit-font-smoothing:antialiased}

/* NAV */
.topnav{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid #e4e6eb;display:flex;align-items:center;padding:0 16px;gap:12px;z-index:400;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.nav-logo{font-size:20px;font-weight:900;color:#1877F2;display:flex;align-items:center;gap:8px;cursor:pointer;text-decoration:none}
.logo-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1877F2,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:16px}
.nav-search{flex:1;max-width:320px;height:40px;background:#f0f2f5;border-radius:999px;display:flex;align-items:center;padding:0 14px;gap:8px}
.nav-search input{border:none;outline:none;background:transparent;font-size:14px;width:100%;font-family:'Inter',sans-serif}
.nav-tabs{flex:1;display:flex;justify-content:center;gap:2px}
.nav-tab{height:48px;width:96px;border-radius:8px;border:none;background:transparent;cursor:pointer;color:#65676b;font-size:22px;display:flex;align-items:center;justify-content:center;position:relative;transition:all .15s}
.nav-tab:hover{background:#f0f2f5;color:#1877F2}
.nav-tab.active{color:#1877F2}
.nav-tab.active::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:#1877F2;border-radius:3px 3px 0 0}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:#f0f2f5;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;color:#050505}
.nav-btn:hover{background:#e4e6eb}
.nav-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1877F2,#8b5cf6);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* LAYOUT */
.page-wrap{padding-top:56px;height:100vh;display:flex;flex-direction:column}

/* FILTER BAR */
.filter-bar{background:#fff;border-bottom:1px solid #e4e6eb;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.filter-row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-box{display:flex;gap:8px;flex:1;min-width:200px}
.search-input{flex:1;height:38px;border:1.5px solid #e4e6eb;border-radius:999px;padding:0 14px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.search-input:focus{border-color:#1877F2}
.search-btn{height:38px;padding:0 18px;border-radius:999px;border:none;background:#1877F2;color:#fff;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif}
.search-btn:hover{background:#0d65d9}

.cat-chip{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid #e4e6eb;background:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:'Inter',sans-serif;transition:all .15s;flex-shrink:0}
.cat-chip:hover{background:#eff6ff;border-color:#1877F2;color:#1877F2}
.cat-chip.active{background:#1877F2;border-color:#1877F2;color:#fff}

.filter-select{height:34px;border:1.5px solid #e4e6eb;border-radius:999px;padding:0 12px;font-size:13px;font-family:'Inter',sans-serif;outline:none;background:#fff;cursor:pointer;transition:border-color .15s}
.filter-select:focus{border-color:#1877F2}

.my-loc-btn{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid #1877F2;background:#eff6ff;color:#1877F2;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:'Inter',sans-serif}
.my-loc-btn:hover{background:#dbeafe}

/* MAIN CONTENT */
.main-content{display:flex;flex:1;overflow:hidden}

/* LEFT PANEL */
.left-panel{width:360px;flex-shrink:0;overflow-y:auto;border-right:1px solid #e4e6eb;background:#fff}
.results-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f5}
.results-count{font-size:14px;font-weight:700;color:#050505}
.sort-select{height:30px;border:1.5px solid #e4e6eb;border-radius:999px;padding:0 10px;font-size:12px;font-family:'Inter',sans-serif;outline:none;cursor:pointer;background:#fff}

/* PLACE CARDS */
.place-card{padding:14px 16px;border-bottom:1px solid #f0f2f5;cursor:pointer;transition:background .12s;display:flex;gap:12px;align-items:flex-start}
.place-card:hover{background:#f7f8fa}
.place-card.selected{background:#eff6ff;border-left:3px solid #1877F2}
.place-img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#e4e6eb}
.place-info{flex:1;min-width:0}
.place-name{font-size:14px;font-weight:700;color:#050505;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-type{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:4px}
.place-addr{font-size:12px;color:#65676b;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.place-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.place-rating{font-size:12px;color:#f59e0b;font-weight:700}
.place-dist{font-size:11px;color:#8a8d91}
.place-hours{font-size:11px;font-weight:700}
.hours-open{color:#16a34a}
.hours-closed{color:#dc2626}
.place-actions{display:flex;gap:6px;margin-top:8px}
.place-btn{height:28px;padding:0 12px;border-radius:999px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;transition:all .15s}
.pbtn-blue{background:#1877F2;color:#fff}
.pbtn-blue:hover{background:#0d65d9}
.pbtn-gray{background:#f0f2f5;color:#050505;border:1.5px solid #e4e6eb}
.pbtn-gray:hover{background:#e4e6eb}
.pbtn-green{background:#22c55e;color:#fff}
.pbtn-green:hover{background:#16a34a}

.empty-state{padding:40px 20px;text-align:center;color:#8a8d91}
.empty-icon{font-size:48px;margin-bottom:12px}

/* MAP */
.map-panel{flex:1;position:relative}
#discover-map{width:100%;height:100%}
.map-overlay-btn{position:absolute;top:10px;right:10px;z-index:100;display:flex;flex-direction:column;gap:6px}
.map-ol-btn{height:36px;padding:0 14px;border-radius:999px;border:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px;transition:all .15s}
.map-ol-btn:hover{background:#f0f2f5}

/* BOTTOM NAV */
.bottomnav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:#fff;border-top:1px solid #e4e6eb;align-items:center;justify-content:space-around;z-index:400}
@media(max-width:768px){.bottomnav{display:flex}.left-panel{width:100%}.map-panel{display:none}.main-content{flex-direction:column}}
.bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 10px;border:none;background:none;font-family:'Inter',sans-serif}
.bnav-item i{font-size:20px;color:#8a8d91}
.bnav-item.active i{color:#1877F2}
.bnav-label{font-size:9px;font-weight:600;color:#8a8d91}
.bnav-item.active .bnav-label{color:#1877F2}

/* DETAIL MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-bg.open{display:flex}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 48px rgba(0,0,0,.2)}
.modal-img{width:100%;height:200px;object-fit:cover;border-radius:16px 16px 0 0;background:#e4e6eb;display:flex;align-items:center;justify-content:center;font-size:48px}
.modal-body{padding:18px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
.modal-name{font-size:20px;font-weight:800;color:#050505}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:#f0f2f5;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-info-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px;color:#3d4451}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.modal-btn{height:38px;padding:0 18px;border-radius:999px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:6px;transition:all .15s}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(0,0,0,.88);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:600;z-index:9999;white-space:nowrap;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
html,body{overflow-x:hidden!important;max-width:100%!important}
</style>
<style class="pb-mobile-pad">@media(max-width:768px){body{padding-bottom:72px}}
html,body{overflow-x:hidden}
@media(max-width:768px){
  .page-wrap{padding-top:56px!important;display:flex!important;flex-direction:column!important;height:auto!important;min-height:100vh!important}
  .filter-bar{flex-shrink:0!important}
  .filter-row1,.filter-row2{overflow-x:auto!important;flex-wrap:nowrap!important;scrollbar-width:none!important}
  .filter-row1::-webkit-scrollbar,.filter-row2::-webkit-scrollbar{display:none!important}
  .main-content{display:flex!important;flex-direction:column!important;flex:1!important;overflow:visible!important;height:auto!important}
  .map-panel{order:-1!important;height:260px!important;min-height:260px!important;max-height:260px!important;flex-shrink:0!important;width:100%!important;display:block!important;position:relative!important}
  #discover-map{height:260px!important;min-height:260px!important;width:100%!important}
  .left-panel{width:100%!important;max-height:none!important;height:auto!important;overflow-y:visible!important;border-right:none!important;border-top:1px solid #e4e6eb!important;flex-shrink:0!important}
  .topnav-tabs{display:none!important}
  .bottomnav{display:flex!important}
  body{padding-bottom:72px!important}
  .modal-box{width:calc(100vw - 20px)!important;max-width:calc(100vw - 20px)!important}
  .place-card{padding:10px!important}
  .place-img{width:52px!important;height:52px!important}
  .map-overlay-btn{top:6px!important;right:6px!important}
}
@media(max-width:480px){
  .nav-search,.topnav-search{display:none!important}
  .map-panel{height:220px!important;min-height:220px!important;max-height:220px!important}
  #discover-map{height:220px!important;min-height:220px!important}
}</style>
</head>

<div class="page-wrap">

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="filter-row1">
    <!-- Search -->
    <div class="search-box">
      <input class="search-input" id="city-search" placeholder="Enter city, e.g. Delhi, Mumbai, London…" onkeydown="if(event.key==='Enter')searchPlaces()">
      <button class="search-btn" onclick="searchPlaces()"><i class="ti ti-search"></i> Search</button>
    </div>
    <!-- My Location -->
    <button class="my-loc-btn" onclick="useMyLocation()">
      <i class="ti ti-current-location"></i> My Location
    </button>
    <!-- Sort -->
    <select class="filter-select" onchange="sortPlaces(this.value)" id="sort-select">
      <option value="distance">📍 Nearest First</option>
      <option value="rating">⭐ Top Rated</option>
      <option value="name">🔤 A–Z</option>
      <option value="open">🟢 Open Now</option>
    </select>
  </div>
  <div class="filter-row2">
    <!-- Category filters -->
    <button class="cat-chip active" onclick="filterCat('all',this)">🗺️ All</button>
    <button class="cat-chip" onclick="filterCat('vet',this)">🏥 Vets</button>
    <button class="cat-chip" onclick="filterCat('shelter',this)">🏠 Shelters</button>
    <button class="cat-chip" onclick="filterCat('zoo',this)">🦁 Zoos</button>
    <button class="cat-chip" onclick="filterCat('aquarium',this)">🐠 Aquariums</button>
    <button class="cat-chip" onclick="filterCat('petshop',this)">🛍️ Pet Shops</button>
    <button class="cat-chip" onclick="filterCat('grooming',this)">✂️ Grooming</button>
    <button class="cat-chip" onclick="filterCat('emergency',this)">🚨 Emergency</button>

    <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;padding:0 8px">
      <input type="checkbox" id="open-now-filter" onchange="applyFilters()" style="accent-color:#1877F2;width:16px;height:16px"> Open Now
    </label>
    <!-- Rating filter -->
    <select class="filter-select" onchange="applyFilters()" id="rating-filter">
      <option value="">⭐ Any Rating</option>
      <option value="4">4+ Stars</option>
      <option value="4.5">4.5+ Stars</option>
    </select>
  </div>
</div>

<!-- MAIN -->
<div class="main-content">

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="results-header">
      <div class="results-count" id="results-count">Search a city to find places</div>
      <select class="sort-select" onchange="sortPlaces(this.value)">
        <option value="distance">Nearest</option>
        <option value="rating">Top Rated</option>
        <option value="open">Open Now</option>
      </select>
    </div>
    <div id="places-list">
      <div class="empty-state">
        <div class="empty-icon">🗺️</div>
        <div style="font-size:16px;font-weight:700;margin-bottom:8px;color:#3d4451">Discover nearby places</div>

        <div style="margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
          <button class="cat-chip" onclick="document.getElementById('city-search').value='Delhi';searchPlaces()">🇮🇳 Delhi</button>
          <button class="cat-chip" onclick="document.getElementById('city-search').value='Mumbai';searchPlaces()">🇮🇳 Mumbai</button>
          <button class="cat-chip" onclick="document.getElementById('city-search').value='Bangalore';searchPlaces()">🇮🇳 Bangalore</button>
          <button class="cat-chip" onclick="document.getElementById('city-search').value='London';searchPlaces()">🇬🇧 London</button>
          <button class="cat-chip" onclick="document.getElementById('city-search').value='New York';searchPlaces()">🇺🇸 New York</button>
          <button class="cat-chip" onclick="document.getElementById('city-search').value='Sydney';searchPlaces()">🇦🇺 Sydney</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div class="map-panel">
    <div id="discover-map" style="width:100%;height:100%;min-height:260px"></div>
    <div class="map-overlay-btn">
      <button class="map-ol-btn" onclick="useMyLocation()"><i class="ti ti-current-location" style="color:#1877F2"></i> My Location</button>
      <button class="map-ol-btn" onclick="toggleMapStyle()" id="map-style-btn"><i class="ti ti-map"></i> Satellite</button>
    </div>
  </div>

</div>
</div>

<!-- DETAIL MODAL -->
<div class="modal-bg" id="place-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div id="modal-img" class="modal-img">🏥</div>
    <div class="modal-body">
      <div class="modal-head">
        <div>
          <div class="modal-name" id="modal-name">Place Name</div>
          <div style="font-size:13px;color:#65676b;margin-top:2px" id="modal-type-badge"></div>
        </div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-info-row"><i class="ti ti-map-pin" style="color:#1877F2;font-size:16px"></i><span id="modal-addr"></span></div>
      <div class="modal-info-row"><i class="ti ti-star" style="color:#f59e0b;font-size:16px"></i><span id="modal-rating"></span></div>
      <div class="modal-info-row"><i class="ti ti-clock" style="color:#22c55e;font-size:16px"></i><span id="modal-hours"></span></div>
      <div class="modal-info-row"><i class="ti ti-phone" style="color:#1877F2;font-size:16px"></i><span id="modal-phone"></span></div>

        <button class="modal-btn" style="background:#fee2e2;color:#dc2626" onclick="savePlace()"><i class="ti ti-heart"></i> Save</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="pb-toast"></div>

var CAT_IMGS = {
  vet:'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=400&q=80',
  shelter:'https://images.unsplash.com/photo-1548767797-d8c844163c4a?w=400&q=80',

};
var _osmSearchActive = false;

function osmElementToPlace(el, idx) {
  var tags = el.tags || {};
  var lat = el.lat || (el.center && el.center.lat);
  var lng = el.lon || (el.center && el.center.lon);
  if(!lat || !lng) return null;
  var nm = (tags.name || '').toLowerCase();
  var cat = 'vet';
  if(tags.amenity==='veterinary'||tags.amenity==='animal_hospital'||tags.healthcare==='veterinary')
    cat = (tags.opening_hours||'').indexOf('24')!==-1||nm.indexOf('emergency')!==-1?'emergency':'vet';
  else if(tags.amenity==='animal_shelter'||tags.amenity==='animal_boarding'||tags.emergency==='animal_rescue'||
    (tags.amenity==='social_facility'&&(nm.indexOf('animal')!==-1||nm.indexOf('pet')!==-1||nm.indexOf('rescue')!==-1||nm.indexOf('shelter')!==-1)))
    cat='shelter';
  else if(tags.tourism==='zoo'||tags.leisure==='nature_reserve') cat='zoo';
  else if(tags.tourism==='aquarium') cat='aquarium';
  else if(tags.shop==='pet') cat='petshop';
  else if(tags.shop==='grooming'||tags.shop==='pet_grooming'||tags.amenity==='animal_grooming') cat='grooming';
  else if(tags.amenity==='emergency_service') cat='emergency';
  else if(!tags.name) return null;
  var name = tags.name || tags['name:en'] || ('Pet Place '+(idx+1));
  var addr = [tags['addr:street'],tags['addr:city']].filter(Boolean).join(', ') || tags['addr:full'] || '';
  return {
    id:'osm_'+el.type+'_'+el.id,
    name:name, cat:cat, addr:addr,
    rating: 4.0 + Math.random()*0.9,
    open: !tags.opening_hours || tags.opening_hours.toLowerCase().indexOf('24')!==-1,
    hours: tags.opening_hours || '',
    phone: tags.phone||tags['contact:phone']||'',
    website: tags.website||tags['contact:website']||'',
    desc: tags.description || name + ' — found via OpenStreetMap.',
    img: CAT_IMGS[cat] || CAT_IMGS.vet,
    lat: lat, lng: lng, source:'osm'
  };
}

function buildOsmQuery(lat, lng) {
  var r = 25000;
  var tags = [
    ['node','amenity','veterinary'],['way','amenity','veterinary'],
    ['node','amenity','animal_hospital'],['way','amenity','animal_hospital'],
    ['node','healthcare','veterinary'],
    ['node','amenity','animal_shelter'],['way','amenity','animal_shelter'],
    ['node','amenity','animal_boarding'],
    ['node','amenity','social_facility'],['way','amenity','social_facility'],
    ['node','emergency','animal_rescue'],['way','emergency','animal_rescue'],
    ['node','tourism','zoo'],['way','tourism','zoo'],
    ['node','tourism','aquarium'],['way','tourism','aquarium'],
    ['node','leisure','nature_reserve'],['way','leisure','nature_reserve'],
    ['node','shop','pet'],['way','shop','pet'],
    ['node','shop','grooming'],['node','shop','pet_grooming'],
    ['node','amenity','animal_grooming'],
    ['node','amenity','emergency_service'],
  ];
  var q = '[out:json][timeout:60];(';
  tags.forEach(function(t){
    q += t[0]+'["'+t[1]+'"="'+t[2]+'"](around:'+r+','+lat+','+lng+');';
  });
  q += ');out center tags 150;';
  return q;
}

function searchPlaces() {
  var city = document.getElementById('city-search').value.trim();
  if(!city) { showToast('Please enter a city name', 'error'); return; }
  if(_osmSearchActive) return;
  _osmSearchActive = true;

  currentCity = city.toLowerCase();
  document.getElementById('results-count').textContent = 'Searching ' + city + '…';
  document.getElementById('places-list').innerHTML =
    '<div class="empty-state"><div class="empty-icon" style="font-size:36px">⏳</div>'+
    '<div style="margin-top:10px;font-size:13px;color:#65676b">Loading real places from OpenStreetMap…<br><small>Takes 5–20 seconds</small></div></div>';

  // Geocode
  var known = CITY_COORDS[city.toLowerCase()] || CITY_COORDS[city.toLowerCase().split(' ')[0]];
  function afterGeo(lat, lng) {
    if(mapInstance){ mapInstance.setView([lat,lng],13); setTimeout(function(){mapInstance.invalidateSize();},200); }
    var query = buildOsmQuery(lat, lng);
    var PBASE = (typeof window.API_BASE!=='undefined'?window.API_BASE:'https://pawbook-api-cquc.onrender.com/api/v1');
    var mirrors = ['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];

    function handleData(data) {
      _osmSearchActive = false;
      var elements = data.elements || [];
      var places = [];
      elements.forEach(function(el,i){ var p=osmElementToPlace(el,i); if(p){ var dx=p.lat-lat,dy=p.lng-lng; p._dist=Math.sqrt(dx*dx+dy*dy)*111; p.dist=p._dist.toFixed(1)+' km'; places.push(p); } });
      places.sort(function(a,b){return a._dist-b._dist;});
      if(!places.length){
        document.getElementById('results-count').textContent='No places found';
        document.getElementById('places-list').innerHTML='<div class="empty-state"><div class="empty-icon">🔍</div><div style="font-size:13px;margin-top:8px">No pet places found in '+city+'.<br>Try a larger city nearby.</div></div>';
        return;
      }
      allPlaces = places; currentCat = 'all';
      document.querySelectorAll('.cat-chip').forEach(function(c){c.classList.remove('active');});
      var firstChip = document.querySelectorAll('.cat-chip')[0]; if(firstChip) firstChip.classList.add('active');
      applyFilters();
    }

    function tryMirror(idx) {
      if(idx>=mirrors.length){
        _osmSearchActive=false;
        document.getElementById('results-count').textContent='Failed to load';
        document.getElementById('places-list').innerHTML='<div class="empty-state"><div class="empty-icon">⚠️</div><div style="font-size:13px;margin-top:8px">Could not load places.<br>OSM servers busy — try again.</div></div>';
        showToast('Could not load places. Try again.','error'); return;
      }
      fetch(mirrors[idx],{method:'POST',headers:{'Content-Type':'text/plain'},body:query})
        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
        .then(handleData)
        .catch(function(e){console.warn('Mirror failed:',mirrors[idx],e.message);tryMirror(idx+1);});
    }

    // Try backend proxy first
    fetch(PBASE+'/overpass',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:query})})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(handleData)
      .catch(function(e){console.warn('Proxy failed:',e.message);tryMirror(0);});
  }

  if(known) { afterGeo(known[0],known[1]); return; }
  fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(city)+'&format=json&limit=1',{headers:{'Accept-Language':'en'}})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.length){_osmSearchActive=false;showToast('City not found. Try another name.','error');return;}
      afterGeo(parseFloat(d[0].lat),parseFloat(d[0].lon));
    })
    .catch(function(){_osmSearchActive=false;showToast('Could not find city.','error');});
}

// ── FILTERS ───────────────────────────────────────────────────
function filterCat(cat, btn) {
  document.querySelectorAll('.cat-chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  currentCat = cat;
  applyFilters();
}

function applyFilters() {
  var openOnly = document.getElementById('open-now-filter').checked;
  var minRating = parseFloat(document.getElementById('rating-filter').value) || 0;

  filteredPlaces = allPlaces.filter(function(p) {
    if(currentCat !== 'all' && p.cat !== currentCat) return false;
    if(openOnly && !p.open) return false;
    if(minRating && p.rating < minRating) return false;
    return true;
  });

  sortPlaces(document.getElementById('sort-select').value);
}

function sortPlaces(by) {
  if(by === 'rating') {
    filteredPlaces.sort(function(a,b){ return b.rating - a.rating; });
  } else if(by === 'name') {
    filteredPlaces.sort(function(a,b){ return a.name.localeCompare(b.name); });
  } else if(by === 'open') {
    filteredPlaces.sort(function(a,b){ return (b.open?1:0) - (a.open?1:0); });
  }
  renderPlaces();
}

var CAT_COLORS = {vet:'#1877F2',shelter:'#f59e0b',zoo:'#22c55e',aquarium:'#06b6d4',petshop:'#8b5cf6',grooming:'#ec4899',emergency:'#dc2626'};
var CAT_LABELS = {vet:'🏥 Veterinary',shelter:'🏠 Shelter',zoo:'🦁 Zoo',aquarium:'🐠 Aquarium',petshop:'🛍️ Pet Shop',grooming:'✂️ Grooming',emergency:'🚨 Emergency'};
var CAT_EMOJIS = {vet:'🏥',shelter:'🏠',zoo:'🦁',aquarium:'🐠',petshop:'🛍️',grooming:'✂️',emergency:'🚨'};

function renderPlaces() {
  var list = document.getElementById('places-list');
  var count = document.getElementById('results-count');

  count.textContent = filteredPlaces.length + ' place' + (filteredPlaces.length !== 1 ? 's' : '') + ' found' + (currentCity ? ' in ' + currentCity.charAt(0).toUpperCase() + currentCity.slice(1) : '');

  if(!filteredPlaces.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div style="font-size:15px;font-weight:700;margin-bottom:6px">No places found</div><div style="font-size:13px">Try a different category or city</div></div>';
    clearMapMarkers();
    return;
  }

  list.innerHTML = filteredPlaces.map(function(p) {
    var col = CAT_COLORS[p.cat] || '#1877F2';
    var label = CAT_LABELS[p.cat] || p.cat;
    var emoji = CAT_EMOJIS[p.cat] || '📍';
    var starsHtml = '';
    var fullStars = Math.floor(p.rating);
    for(var i=0;i<5;i++) starsHtml += (i<fullStars?'★':'☆');

    return '<div class="place-card" id="card-'+p.id+'" onclick="selectPlace('+p.id+')">' +
      '<img class="place-img" src="'+p.img+'" alt="'+p.name+'" onerror="this.style.display=\'none\'">' +
      '<div class="place-info">' +
        '<div class="place-name">'+p.name+'</div>' +
        '<span class="place-type" style="background:'+col+'22;color:'+col+'">'+label+'</span>' +
        '<div class="place-addr"><i class="ti ti-map-pin" style="font-size:11px;color:#1877F2"></i>'+p.addr+'</div>' +
        '<div class="place-meta">' +
          '<span class="place-rating">'+starsHtml+' '+p.rating+'</span>' +
          '<span class="place-dist">'+p.dist+'</span>' +
          '<span class="place-hours '+(p.open?'hours-open':'hours-closed')+'">'+p.hours+'</span>' +
        '</div>' +
        '<div class="place-actions">' +
          '<button class="place-btn pbtn-blue" onclick="event.stopPropagation();showPlaceModal('+p.id+')"><i class="ti ti-info-circle"></i> Details</button>' +
          '<button class="place-btn pbtn-gray" onclick="event.stopPropagation();navigateToPlace('+p.id+')"><i class="ti ti-navigation"></i> Directions</button>' +
          (p.cat==='vet'||p.cat==='emergency'?'<button class="place-btn pbtn-green" onclick="event.stopPropagation();goTo(\'11_vet_booking.html\')"><i class="ti ti-calendar-plus"></i> Book</button>':'') +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  updateMapMarkers();
}

// ── MAP MARKERS ───────────────────────────────────────────────
function clearMapMarkers() {
  mapMarkers.forEach(function(m){ mapInstance.removeLayer(m); });
  mapMarkers = [];
}

function updateMapMarkers() {
  clearMapMarkers();
  filteredPlaces.forEach(function(p) {
    if(!p.lat || !p.lng) return;
    var col = CAT_COLORS[p.cat] || '#1877F2';
    var emoji = CAT_EMOJIS[p.cat] || '📍';
    var icon = L.divIcon({
      className: '',
      html: '<div style="width:36px;height:36px;border-radius:50%;background:'+col+';border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer">'+emoji+'</div>',
      iconSize: [36,36], iconAnchor: [18,18]
    });
    var marker = L.marker([p.lat, p.lng], {icon: icon}).addTo(mapInstance);
    marker.on('click', function(){ selectPlace(p.id); });
    marker.bindTooltip(p.name, {permanent: false, direction: 'top'});
    mapMarkers.push(marker);
  });
}

// ── SELECT PLACE ──────────────────────────────────────────────
function selectPlace(id) {
  var p = allPlaces.find(function(x){ return x.id === id; });
  if(!p) return;
  selectedPlace = p;

  // Highlight card
  document.querySelectorAll('.place-card').forEach(function(c){ c.classList.remove('selected'); });
  var card = document.getElementById('card-'+id);
  if(card) { card.classList.add('selected'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // Pan map
  if(p.lat && p.lng && mapInstance) {
    mapInstance.setView([p.lat, p.lng], 16);
  }
}

// ── DETAIL MODAL ──────────────────────────────────────────────
function showPlaceModal(id) {
  var p = allPlaces.find(function(x){ return x.id === id; });
  if(!p) return;
  selectedPlace = p;

  var col = CAT_COLORS[p.cat] || '#1877F2';
  var label = CAT_LABELS[p.cat] || p.cat;
  var starsHtml = '';
  for(var i=0;i<5;i++) starsHtml += (i<Math.floor(p.rating)?'★':'☆');

  // Set modal img
  var imgEl = document.getElementById('modal-img');
  imgEl.innerHTML = '<img src="'+p.img+'" style="width:100%;height:200px;object-fit:cover;border-radius:16px 16px 0 0" onerror="this.parentElement.innerHTML=\''+CAT_EMOJIS[p.cat]+'\'">';

  document.getElementById('modal-name').textContent = p.name;
  document.getElementById('modal-type-badge').innerHTML = '<span style="background:'+col+'22;color:'+col+';font-weight:700;padding:3px 10px;border-radius:999px;font-size:12px">'+label+'</span>';
  document.getElementById('modal-addr').textContent = p.addr;
  document.getElementById('modal-rating').textContent = starsHtml + ' ' + p.rating + ' · ' + p.dist + ' away';
  document.getElementById('modal-hours').textContent = p.hours + (p.open ? ' · Open Now' : ' · Closed');
  document.getElementById('modal-hours').style.color = p.open ? '#16a34a' : '#dc2626';
  document.getElementById('modal-phone').textContent = p.phone;
  document.getElementById('modal-desc').textContent = p.desc;

  document.getElementById('place-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('place-modal').classList.remove('open');
  document.body.style.overflow = '';
}

function navigateTo() {
  if(!selectedPlace) return;
  window.open('https://www.google.com/maps/dir/?api=1&destination='+selectedPlace.lat+','+selectedPlace.lng, '_blank');
}

function navigateToPlace(id) {
  var p = allPlaces.find(function(x){ return x.id === id; });
  if(!p) return;
  window.open('https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng, '_blank');
}

function callPlace() {
  if(!selectedPlace) return;
  window.open('tel:'+selectedPlace.phone);
}

function sharePlaceModal() {
  if(!selectedPlace) return;
  var msg = 'Check out ' + selectedPlace.name + ' at ' + selectedPlace.addr + ' — found on PawBook!';
  if(navigator.share) { navigator.share({title: selectedPlace.name, text: msg}); }
  else if(navigator.clipboard) { navigator.clipboard.writeText(msg); showToast('Link copied!', 'success'); }
}

function savePlace() {
  if(!selectedPlace) return;
  showToast('Saved ' + selectedPlace.name + ' to your favorites!', 'success');
}

// ── MY LOCATION ───────────────────────────────────────────────
function useMyLocation() {
  if(!navigator.geolocation) { showToast('Geolocation not supported', 'error'); return; }
  showToast('Getting your location...', 'info');
  navigator.geolocation.getCurrentPosition(function(pos) {
    var lat = pos.coords.latitude, lng = pos.coords.longitude;
    if(mapInstance) {
      mapInstance.setView([lat, lng], 14);
      L.marker([lat, lng], {
        icon: L.divIcon({
          className: '',
          html: '<div style="width:18px;height:18px;border-radius:50%;background:#1877F2;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',
          iconSize:[18,18], iconAnchor:[9,9]
        })
      }).addTo(mapInstance).bindPopup('You are here').openPopup();
    }
    // Try to detect city from coords
    document.getElementById('city-search').value = 'Delhi'; // fallback
    showToast('Showing places near you!', 'success');
    searchPlaces();
  }, function() {
    showToast('Could not get your location. Please search a city.', 'error');
  });
}

// ── TOAST ─────────────────────────────────────────────────────
function showToast(msg, type) {
  var t = document.getElementById('pb-toast');
  var bg = type==='error'?'#dc2626':type==='success'?'#22c55e':type==='info'?'#1877F2':'rgba(0,0,0,.88)';
  t.style.background = bg;
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ── INIT ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  // Give browser time to apply CSS and set heights before init
  setTimeout(function() {
    initMap();
    // Force map to fill container
    if(mapInstance) {
      mapInstance.invalidateSize(true);
    }
    document.getElementById('city-search').value = 'Delhi';
    searchPlaces();
  }, 100);
});

// Re-invalidate on resize
window.addEventListener('resize', function() {
  if(mapInstance) setTimeout(function(){ mapInstance.invalidateSize(true); }, 150);
});
</script>

    btns.forEach(function(b){
      b.style.display = isMobile ? 'flex' : 'none';
    });

    var tabs = document.querySelector('.topnav-tabs');

    var bnav = document.querySelector('.bottomnav');
    if(bnav) bnav.style.display = isMobile ? 'flex' : 'none';
  }

  window.addEventListener('resize', showBurgerOnMobile);
})();
