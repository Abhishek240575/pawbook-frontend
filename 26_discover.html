<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PawBook — Discover</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px;min-height:100vh}

/* ── NAV ── */
.topnav{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;
  backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;z-index:500;
  display:flex;align-items:center;padding:0 16px;gap:12px}
.nav-logo{font-size:18px;font-weight:900;color:#1e293b;display:flex;align-items:center;gap:6px}
.nav-logo span{font-size:22px}
.nav-search{flex:1;max-width:480px;position:relative}
.nav-search input{width:100%;height:36px;border-radius:20px;border:1.5px solid #e2e8f0;
  background:#f8fafc;color:#1e293b;padding:0 16px 0 40px;font-family:'Poppins',sans-serif;
  font-size:13px;outline:none;transition:border-color 0.2s}
.nav-search input:focus{border-color:#6366f1}
.nav-search input::placeholder{color:#94a3b8}
.nav-search i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:16px}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;cursor:pointer}
.nav-back{background:none;border:none;color:#64748b;cursor:pointer;font-size:22px;
  display:flex;align-items:center;padding:4px}

/* ── LAYOUT ── */
.page{padding-top:56px;display:flex;height:100vh;overflow:hidden}
.sidebar{width:340px;flex-shrink:0;height:100%;overflow-y:auto;background:#fff;
  border-right:1px solid #e2e8f0;display:flex;flex-direction:column}
.map-panel{flex:1;position:relative;min-height:500px;}
#map{width:100%;height:calc(100vh - 56px);min-height:500px;}

/* ── SIDEBAR HEADER ── */
.sb-header{padding:16px;border-bottom:1px solid #e2e8f0;background:#fff}
.sb-title{font-size:18px;font-weight:800;color:#1e293b;margin-bottom:12px}
.cat-pill{flex-shrink:0;height:32px;padding:0 12px;border-radius:20px;border:1.5px solid #e2e8f0;
  background:#f8fafc;color:#64748b;font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all 0.15s;font-family:'Poppins',sans-serif}
.cat-pill:hover{border-color:#6366f1;color:#6366f1}
.cat-pill.active{background:#6366f1;border-color:#6366f1;color:#fff}
.city-input{flex:1;height:38px;border-radius:10px;border:1.5px solid #e2e8f0;
  background:#f8fafc;color:#1e293b;padding:0 12px;font-family:'Poppins',sans-serif;
  font-size:13px;outline:none}
.city-input:focus{border-color:#6366f1}
.city-input::placeholder{color:#94a3b8}
.result-card{background:#f8fafc;border-radius:12px;padding:14px;margin-bottom:10px;
  border:1px solid #e2e8f0;cursor:pointer;transition:all 0.15s}
.result-card:hover{border-color:#6366f1;background:#f0f1ff}
.result-card.selected{border-color:#6366f1;background:#f0f1ff;box-shadow:0 0 0 2px rgba(99,102,241,0.15)}
.rc-name{font-size:13px;font-weight:800;color:#1e293b;margin-bottom:2px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rc-addr{font-size:11px;color:#94a3b8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rc-tag{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600;background:#e2e8f0;color:#475569}
.rc-btn.secondary{background:#f1f5f9;color:#64748b}
.rc-btn.secondary:hover{background:#e2e8f0;color:#1e293b}
.results-count{font-size:11px;color:#94a3b8;font-weight:600;margin-bottom:10px;padding:0 2px}
.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;
  height:100px;margin-bottom:10px}
.stat-chip{background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);
  border:1px solid #e2e8f0;border-radius:20px;padding:6px 14px;
  font-size:12px;font-weight:700;color:#1e293b;display:flex;align-items:center;gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.legend-box{background:rgba(255,255,255,0.95);backdrop-filter:blur(8px);
  border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.legend-title{font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:6px;text-transform:uppercase}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:#475569}
.detail-panel{position:absolute;bottom:0;left:0;right:0;background:#fff;
  border-top:1px solid #e2e8f0;transform:translateY(100%);transition:transform 0.3s ease;
  z-index:450;max-height:60%;overflow-y:auto;border-radius:20px 20px 0 0;
  box-shadow:0 -4px 20px rgba(0,0,0,0.1)}
.detail-handle{width:36px;height:4px;background:#e2e8f0;border-radius:2px;margin:12px auto 16px}
.detail-name{font-size:18px;font-weight:900;color:#1e293b;margin-bottom:4px}
.detail-item{background:#f8fafc;border-radius:10px;padding:10px 12px}
.detail-item-label{font-size:10px;color:#94a3b8;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.detail-item-val{font-size:13px;font-weight:700;color:#1e293b}
.empty-state{text-align:center;padding:40px 20px;color:#94a3b8}
.empty-state .title{font-size:15px;font-weight:700;color:#64748b;margin-bottom:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:56px;
  background:#fff;border-top:1px solid #e2e8f0;display:flex;z-index:500}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;color:#94a3b8;font-size:10px;
  font-weight:600;border:none;background:none;font-family:'Poppins',sans-serif}
.bn-item.active{color:#6366f1}
.bn-item i{font-size:20px}
.emergency-section{background:#fff5f5;border:1px solid #fecaca;border-radius:12px;
  padding:14px;margin-bottom:10px}
.emergency-title{font-size:12px;font-weight:800;color:#ef4444;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.emg-item{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid #fee2e2}
.emg-item:last-child{border-bottom:none}
.emg-country{font-size:12px;font-weight:700;color:#dc2626}
.emg-num{font-size:11px;color:#64748b;margin-top:1px}
.emg-call{background:#fee2e2;color:#dc2626;border:none;border-radius:8px;
  padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif}

/* Category pills */
.cat-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;height:32px;padding:0 12px;border-radius:20px;border:1.5px solid #1e293b;
  background:#1a1f2e;color:#94a3b8;font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;white-space:nowrap;transition:all 0.15s;font-family:'Poppins',sans-serif}
.cat-pill:hover{border-color:#6366f1;color:#a5b4fc}
.cat-pill.active{background:#6366f1;border-color:#6366f1;color:#fff}

/* City search */
.city-row{display:flex;gap:8px;margin-top:12px}
.city-input{flex:1;height:38px;border-radius:10px;border:1.5px solid #1e293b;
  background:#1a1f2e;color:#e2e8f0;padding:0 12px;font-family:'Poppins',sans-serif;
  font-size:13px;outline:none}
.city-input:focus{border-color:#6366f1}
.city-input::placeholder{color:#475569}
.search-btn{height:38px;padding:0 14px;border-radius:10px;border:none;
  background:#6366f1;color:#fff;font-size:12px;font-weight:700;cursor:pointer;
  font-family:'Poppins',sans-serif;white-space:nowrap}
.search-btn:hover{background:#4f46e5}

/* ── RESULTS ── */
.results-area{flex:1;overflow-y:auto;padding:12px}
.results-count{font-size:11px;color:#475569;font-weight:600;margin-bottom:10px;padding:0 2px}

.result-card{background:#1a1f2e;border-radius:12px;padding:14px;margin-bottom:10px;
  border:1px solid #1e293b;cursor:pointer;transition:all 0.15s}
.result-card:hover{border-color:#6366f1;background:#1e2236}
.result-card.selected{border-color:#6366f1;background:#1e2236;box-shadow:0 0 0 2px rgba(99,102,241,0.2)}

.rc-top{display:flex;gap:10px;align-items:flex-start}
.rc-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0}
.rc-info{flex:1;min-width:0}
.rc-name{font-size:13px;font-weight:800;color:#f1f5f9;margin-bottom:2px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rc-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:3px}
.rc-addr{font-size:11px;color:#64748b;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.rc-tag{font-size:10px;padding:2px 8px;border-radius:12px;font-weight:600;background:#0f1117;color:#94a3b8}
.rc-actions{display:flex;gap:6px;margin-top:10px}
.rc-btn{flex:1;height:30px;border-radius:8px;border:none;cursor:pointer;font-size:11px;
  font-weight:700;font-family:'Poppins',sans-serif;transition:all 0.15s}
.rc-btn.primary{background:#6366f1;color:#fff}
.rc-btn.primary:hover{background:#4f46e5}
.rc-btn.secondary{background:#1e293b;color:#94a3b8}
.rc-btn.secondary:hover{background:#263348;color:#e2e8f0}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,#1a1f2e 25%,#1e2540 50%,#1a1f2e 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;
  height:100px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── MAP OVERLAYS ── */
.map-overlay{position:absolute;z-index:400;pointer-events:none}
.map-stats{top:12px;right:12px;display:flex;gap:8px;pointer-events:all}
.stat-chip{background:rgba(15,17,23,0.9);backdrop-filter:blur(8px);
  border:1px solid #1e293b;border-radius:20px;padding:6px 14px;
  font-size:12px;font-weight:700;color:#e2e8f0;display:flex;align-items:center;gap:6px}
.stat-chip i{font-size:14px}

.map-legend{bottom:32px;left:12px;pointer-events:all}
.legend-box{background:rgba(15,17,23,0.92);backdrop-filter:blur(8px);
  border:1px solid #1e293b;border-radius:12px;padding:10px 14px}
.legend-title{font-size:10px;font-weight:700;color:#475569;margin-bottom:6px;text-transform:uppercase}
.legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:11px;color:#94a3b8}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── DETAIL PANEL ── */
.detail-panel{position:absolute;bottom:0;left:0;right:0;background:#0f1117;
  border-top:1px solid #1e293b;transform:translateY(100%);transition:transform 0.3s ease;
  z-index:450;max-height:60%;overflow-y:auto;border-radius:20px 20px 0 0}
.detail-panel.open{transform:translateY(0)}
.detail-handle{width:36px;height:4px;background:#1e293b;border-radius:2px;
  margin:12px auto 16px}
.detail-content{padding:0 20px 24px}
.detail-name{font-size:18px;font-weight:900;color:#fff;margin-bottom:4px}
.detail-type-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;
  border-radius:12px;font-size:11px;font-weight:700;margin-bottom:12px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.detail-item{background:#1a1f2e;border-radius:10px;padding:10px 12px}
.detail-item-label{font-size:10px;color:#475569;font-weight:600;text-transform:uppercase;margin-bottom:2px}
.detail-item-val{font-size:13px;font-weight:700;color:#e2e8f0}
.detail-actions{display:flex;gap:8px}
.detail-btn{flex:1;height:42px;border-radius:10px;border:none;cursor:pointer;
  font-size:13px;font-weight:700;font-family:'Poppins',sans-serif}

/* ── EMERGENCY PANEL ── */
.emergency-section{background:#1a0a0a;border:1px solid #3f1515;border-radius:12px;
  padding:14px;margin-bottom:10px}
.emergency-title{font-size:12px;font-weight:800;color:#f87171;margin-bottom:10px;
  display:flex;align-items:center;gap:6px}
.emg-item{display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid #2d1515}
.emg-item:last-child{border-bottom:none}
.emg-flag{font-size:18px}
.emg-info{flex:1}
.emg-country{font-size:12px;font-weight:700;color:#fca5a5}
.emg-num{font-size:11px;color:#64748b;margin-top:1px}
.emg-call{background:#7f1d1d;color:#fca5a5;border:none;border-radius:8px;
  padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;font-family:'Poppins',sans-serif}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:56px;
  background:rgba(15,17,23,0.97);border-top:1px solid #1e293b;
  display:flex;z-index:500}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;color:#475569;font-size:10px;
  font-weight:600;border:none;background:none;font-family:'Poppins',sans-serif}
.bn-item.active{color:#6366f1}
.bn-item i{font-size:20px}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:40px 20px;color:#475569}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state .title{font-size:15px;font-weight:700;color:#64748b;margin-bottom:6px}
.empty-state .sub{font-size:12px;line-height:1.6}

/* Leaflet custom markers */
.custom-marker{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:18px;border:3px solid rgba(255,255,255,0.3);
  box-shadow:0 2px 8px rgba(0,0,0,0.4)}
</style>

      <!-- Category pills -->
      <div class="cat-scroll" id="cat-pills">
        <button class="cat-pill active" data-type="veterinary" data-osm='["amenity"="veterinary"]' onclick="selectCat(this)">🏥 Vets</button>

      <div class="detail-content" id="detail-content"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">

// ── Map Init ──────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { zoomControl: false }).setView(currentCenter, 5);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  markersLayer = L.layerGroup().addTo(map);
  map.on('click', () => closeDetail());
  // Force tile render
  setTimeout(() => map.invalidateSize(), 300);
}

// ── Category Select ───────────────────────────────────────────────────────────
function selectCat(el) {
  document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  currentCat = el.dataset.type;
  currentOSM = el.dataset.osm || '';

  if (currentCat === 'emergency') {
    showEmergencyNumbers();
    return;
  }

  const city = document.getElementById('city-input').value.trim();
  if (city) searchCity();
}

// ── City Search ───────────────────────────────────────────────────────────────
async function searchCity() {
  const city = document.getElementById('city-input').value.trim();
  if (!city) { alert('Please enter a city name'); return; }
  if (currentCat === 'emergency') { showEmergencyNumbers(); return; }

  showLoading();

  try {
    // Geocode city via Nominatim
    const geoRes = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`,
      { headers: { 'Accept-Language': 'en' } }
    );
    const geoData = await geoRes.json();

    if (!geoData.length) {
      showEmpty('City not found', 'Try a different city name or check spelling');
      return;
    }

    const { lat, lon, display_name } = geoData[0];
    currentCenter = [parseFloat(lat), parseFloat(lon)];
    map.setView(currentCenter, 13);

    // Query Overpass API
    await queryOverpass(parseFloat(lat), parseFloat(lon), city);
  } catch(e) {
    showEmpty('Search failed', 'Check your internet connection and try again');
  }
}

// ── Overpass Query ────────────────────────────────────────────────────────────
async function queryOverpass(lat, lng, cityName) {
  const radius = 10000; // 10km
  const filter = currentOSM || '["amenity"="veterinary"]';

  const query = `
    [out:json][timeout:25];
    (
      node${filter}(around:${radius},${lat},${lng});
      way${filter}(around:${radius},${lat},${lng});
      relation${filter}(around:${radius},${lat},${lng});
    );
    out center tags 50;
  `;

  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: query
    });
    const data = await res.json();
    const elements = data.elements || [];
    renderResults(elements, cityName);
  } catch(e) {
    // Fallback to alternative Overpass instance
    try {
      const res2 = await fetch('https://overpass.kumi.systems/api/interpreter', {
        method: 'POST',
        body: query
      });
      const data2 = await res2.json();
      renderResults(data2.elements || [], cityName);
    } catch(e2) {
      showEmpty('Data unavailable', 'Overpass API is temporarily busy. Try again in a moment.');
    }
  }
}

// ── Render Results ─────────────────────────────────────────────────────────────
function renderResults(elements, cityName) {
  markersLayer.clearLayers();
  const cfg = CAT_CONFIG[currentCat] || CAT_CONFIG.veterinary;

  if (!elements.length) {
    showEmpty(
      `No ${cfg.label}s found`,
      `No results for ${cityName}. Try zooming out or searching a nearby city.`
    );
    document.getElementById('result-count').textContent = '0';
    return;
  }

  document.getElementById('result-count').textContent = elements.length;

  const resultsArea = document.getElementById('results-area');
  resultsArea.innerHTML = `<div class="results-count">${elements.length} ${cfg.label}s near ${cityName}</div>`;

  elements.forEach((el, idx) => {
    const tags = el.tags || {};
    const lat = el.lat || el.center?.lat;
    const lng = el.lon || el.center?.lon;
    if (!lat || !lng) return;

    const name = tags.name || tags['name:en'] || `${cfg.label} ${idx + 1}`;
    const addr = [tags['addr:street'], tags['addr:city'], tags['addr:country']]
      .filter(Boolean).join(', ') || tags['addr:full'] || 'Address not listed';
    const phone = tags.phone || tags['contact:phone'] || tags['contact:mobile'] || '';
    const website = tags.website || tags['contact:website'] || '';
    const hours = tags.opening_hours || '';
    const species = tags.animals || tags.species || '';

    // Add marker
    const markerIcon = L.divIcon({
      className: '',
      html: `<div class="custom-marker" style="background:${cfg.color}">${cfg.emoji}</div>`,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    const marker = L.marker([lat, lng], { icon: markerIcon }).addTo(markersLayer);
    marker.on('click', () => showDetail({ name, addr, phone, website, hours, species, lat, lng }, cfg));

    // Result card
    const card = document.createElement('div');
    card.className = 'result-card';
    card.id = `card-${idx}`;
    card.innerHTML = `
      <div class="rc-top">
        <div class="rc-icon" style="background:${cfg.bg}">${cfg.emoji}</div>
        <div class="rc-info">
          <div class="rc-name" title="${name}">${name}</div>
          <div class="rc-type" style="color:${cfg.color}">${cfg.label}</div>
          <div class="rc-addr">${addr}</div>
        </div>
      </div>
      ${hours || phone || species ? `<div class="rc-tags">
        ${hours ? `<div class="rc-tag">🕐 ${hours.slice(0,30)}${hours.length>30?'...':''}</div>` : ''}
        ${phone ? `<div class="rc-tag">📞 ${phone}</div>` : ''}
        ${species ? `<div class="rc-tag">🐾 ${species}</div>` : ''}
      </div>` : ''}
      <div class="rc-actions">
        <button class="rc-btn primary" onclick="flyToMarker(${lat},${lng},'${name.replace(/'/g,'`')}')">📍 View on Map</button>
        ${phone ? `<button class="rc-btn secondary" onclick="window.open('tel:${phone}')">📞 Call</button>` : ''}
        ${website ? `<button class="rc-btn secondary" onclick="window.open('${website}','_blank')">🌐 Website</button>` : ''}
      </div>`;

    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      document.querySelectorAll('.result-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      map.setView([lat, lng], 16);
      showDetail({ name, addr, phone, website, hours, species, lat, lng }, cfg);
    });

    resultsArea.appendChild(card);
  });
}

// ── Fly to Marker ──────────────────────────────────────────────────────────────
function flyToMarker(lat, lng, name) {
  map.flyTo([lat, lng], 17, { duration: 1.2 });
}

// ── Show Detail Panel ──────────────────────────────────────────────────────────
function showDetail(item, cfg) {
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');

  content.innerHTML = `
    <div class="detail-name">${item.name}</div>
    <div class="detail-type-badge" style="background:${cfg.bg};color:${cfg.color}">
      ${cfg.emoji} ${cfg.label}
    </div>
    <div class="detail-grid">
      <div class="detail-item">
        <div class="detail-item-label">Address</div>
        <div class="detail-item-val" style="font-size:11px">${item.addr || 'Not listed'}</div>
      </div>
      <div class="detail-item">
        <div class="detail-item-label">Phone</div>
        <div class="detail-item-val">${item.phone || 'Not listed'}</div>
      </div>
      ${item.hours ? `<div class="detail-item">
        <div class="detail-item-label">Hours</div>
        <div class="detail-item-val" style="font-size:11px">${item.hours}</div>
      </div>` : ''}
      ${item.species ? `<div class="detail-item">
        <div class="detail-item-label">Animals</div>
        <div class="detail-item-val">${item.species}</div>
      </div>` : ''}
    </div>
    <div class="detail-actions">
      <button class="detail-btn" style="background:#6366f1;color:#fff"
        onclick="window.open('https://www.openstreetmap.org/directions?to=${item.lat},${item.lng}','_blank')">
        🗺️ Get Directions
      </button>
      ${item.phone ? `<button class="detail-btn" style="background:#10b981;color:#fff"
        onclick="window.open('tel:${item.phone}')">📞 Call Now</button>` : ''}
      ${item.website ? `<button class="detail-btn" style="background:#1e293b;color:#94a3b8"
        onclick="window.open('${item.website}','_blank')">🌐 Website</button>` : ''}
    </div>`;

  panel.classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
}

// ── Emergency Numbers ─────────────────────────────────────────────────────────
function showEmergencyNumbers() {
  const resultsArea = document.getElementById('results-area');
  markersLayer.clearLayers();
  document.getElementById('result-count').textContent = EMERGENCY_DATA.length;

  resultsArea.innerHTML = `
    <div class="results-count">${EMERGENCY_DATA.length} countries · Emergency & Wildlife numbers</div>
    <div class="emergency-section">
      <div class="emergency-title"><i class="ti ti-alert-triangle"></i> Animal Emergency Numbers Worldwide</div>
      ${EMERGENCY_DATA.map(e => `
        <div class="emg-item">
          <div class="emg-flag">${e.flag}</div>
          <div class="emg-info">
            <div class="emg-country">${e.country}</div>
            <div class="emg-num">
              🚑 Ambulance: <strong>${e.ambulance}</strong> &nbsp;
              🐾 Wildlife: <strong>${e.wildlife}</strong>
            </div>
          </div>
          <button class="emg-call" onclick="window.open('tel:${e.ambulance}')">Call</button>
        </div>`).join('')}
    </div>`;
}

// ── My Location ───────────────────────────────────────────────────────────────
function useMyLocation() {
  if (!navigator.geolocation) { alert('Geolocation not supported'); return; }
  const chip = document.getElementById('location-chip');
  chip.innerHTML = '<i class="ti ti-loader"></i> Locating...';

  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    currentCenter = [lat, lng];
    map.setView([lat, lng], 14);
    chip.innerHTML = '<i class="ti ti-current-location"></i> Located!';
    setTimeout(() => { chip.innerHTML = '<i class="ti ti-current-location"></i> My Location'; }, 2000);

    // Reverse geocode
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
      const data = await res.json();
      const city = data.address?.city || data.address?.town || data.address?.village || 'your location';
      document.getElementById('city-input').value = city;
      await queryOverpass(lat, lng, city);
    } catch(e) {
      await queryOverpass(lat, lng, 'your location');
    }

    // Add user location marker
    L.circleMarker([lat, lng], {
      radius: 10, fillColor: '#6366f1', color: '#fff', weight: 3, fillOpacity: 1
    }).addTo(markersLayer).bindPopup('📍 You are here');

  }, () => {
    chip.innerHTML = '<i class="ti ti-current-location"></i> My Location';
    alert('Location access denied. Please enter a city manually.');
  });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showLoading() {
  const area = document.getElementById('results-area');
  area.innerHTML = [1,2,3,4,5].map(() =>
    `<div class="skeleton"></div>`
  ).join('');
}

function showEmpty(title, sub) {
  document.getElementById('results-area').innerHTML = `
    <div class="empty-state">
      <div class="icon">🔍</div>
      <div class="title">${title}</div>
      <div class="sub">${sub}</div>
    </div>`;
}

// Global search bar
document.getElementById('global-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = e.target.value.trim();
    if (val) {
      document.getElementById('city-input').value = val;
      searchCity();
    }
  }
});

// City input enter key
document.getElementById('city-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchCity();
});

// Nav avatar
const user = typeof Auth !== 'undefined' ? Auth.getUser() : null;
if (user) {
  document.getElementById('nav-av').textContent =
    (user.full_name || user.username || 'A')[0].toUpperCase();
}

// Init

// Ensure map initializes after layout is complete
if(document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() { setTimeout(initMap, 100); });
} else {
  setTimeout(initMap, 100);
}


// Auto-detect location on load
setTimeout(() => {
  if (navigator.geolocation) useMyLocation();
}, 500);
</script>
